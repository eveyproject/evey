  audioShortBadge: "Audio -{{sec}}s"
  audioShortHint: "Una pista de audio se detiene {{sec}}s antes que el vídeo (créditos en silencio en esa pista). El archivo está sano por lo demás y la reproducción rellena el final que falta con silencio. Se mide contra el final real de la imagen, no contra la duración declarada del contenedor, así que una duración exagerada nunca se le achaca al audio. No hay reparación posible: ese audio simplemente no está en el archivo; vuelve a obtener la fuente para una corrección real."
  statsSeekCoarse: "Búsqueda imprecisa"
  seekCoarseBadge: "Búsqueda imprecisa"
  seekCoarseHint: "El índice se reconstruyó y queda un hueco: {{detail}}. Una búsqueda DENTRO de ese hueco cae en su borde; en el resto es exacta. Medido en real, el hueco suele ser los créditos finales (ningún fotograma clave tras el último), que ningún índice puede llenar y que no molesta a nadie. Un hueco en mitad de la película son los fotogramas clave de la codificación misma - solo una mejor fuente lo remedia."
