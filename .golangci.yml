version: "2"

run:
  go: "1.26"
  timeout: 5m

linters:
  enable:
    # Core (+ defaults: errcheck, govet, ineffassign, staticcheck, unused)
    - errorlint
    - wastedassign
    - nilerr
    - recvcheck
    # Code quality
    - misspell
    - unconvert
    - revive
    - gocritic
    - modernize
    - intrange
    # HTTP / SQL safety
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # Test quality
    - testifylint
    # nolint hygiene
    - nolintlint
    # TxUnit enforcement: repos must honor an ambient transaction
    - forbidigo

  settings:
    forbidigo:
      forbid:
        # A postgres repo calling its *sql.DB handle directly (r.db.ExecContext,
        # …) bypasses any ambient transaction set by TxUnit.Do — so a caller
        # wrapping several writes in uow.Do silently loses atomicity. Route every
        # statement through txFromCtx(ctx, r.db), which uses the ambient tx when
        # present and falls back to the raw handle otherwise. (Own-tx repos keep
        # using r.db.BeginTx + tx.ExecContext, which this does not match.)
        - pattern: '\.db\.(ExecContext|QueryContext|QueryRowContext)\('
          msg: "use txFromCtx(ctx, <recv>.db).XContext so the repo honors an ambient TxUnit transaction"
    errcheck:
      check-blank: true
      # Non-actionable error returns
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer close — error logged by DB/OS layer already
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Conn).Close
        - (*github.com/evey-project/evey/internal/adapters/driven/pluginrunner.pluginLogWriter).Close
        # startup best-effort initialization
        - (*github.com/evey-project/evey/internal/app/feed.CommandService).EnsureLibraryFeedConfig
        - (net/http.Response.Body).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (database/sql.Result).RowsAffected
        # intentional zero-fallback conversions
        - strconv.Atoi
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.ParseInt
        # process cleanup — error expected after cancel/kill
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        # cleanup / best-effort FS ops
        - os.RemoveAll
        - os.ReadDir
        # scan helpers — zero-value fallback on parse failure
        - fmt.Sscan
        # body drain to io.Discard
        - io.Copy
        # slog handler — multi-handler best-effort
        - (log/slog.Handler).Handle
        # websocket best-effort operations
        - (*golang.org/x/net/websocket.Conn).Close
        - (*golang.org/x/net/websocket.Conn).SetWriteDeadline
        - (golang.org/x/net/websocket.Codec).Send
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true  # project style: sparse comments
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
          - forbidigo
      # Not a postgres repo / TxUnit participant — owns its own *sql.DB.
      - path: internal/app/transcoding/caps_override_service\.go
        linters:
          - forbidigo
      - path: gen/
        linters:
          - errcheck
          - unused
          - staticcheck
          - revive
          - gocritic
          - modernize
          - intrange
      - path: fakes/
        linters:
          - unused
          - revive
          - errcheck
      - path: internal/adapters/driven/ebml/
        linters:
          - errcheck
      - path: testhelpers/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
