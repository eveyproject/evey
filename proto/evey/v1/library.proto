syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service LibraryService {
  rpc CreateLibrary(CreateLibraryRequest) returns (Library) {
    option (google.api.http) = {
      post: "/api/v1/libraries"
      body: "*"
    };
  }

  rpc GetLibrary(GetLibraryRequest) returns (Library) {
    option (google.api.http) = {
      get: "/api/v1/libraries/{id}"
    };
  }

  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse) {
    option (google.api.http) = {
      get: "/api/v1/libraries"
    };
  }

  rpc UpdateLibrary(UpdateLibraryRequest) returns (Library) {
    option (google.api.http) = {
      patch: "/api/v1/libraries/{id}"
      body: "*"
    };
  }

  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/libraries/{id}"
    };
  }

  rpc ScanLibrary(ScanLibraryRequest) returns (stream ScanProgress) {
    option (google.api.http) = {
      post: "/api/v1/libraries/{id}/scan"
    };
  }

  rpc GetMediaItem(GetMediaItemRequest) returns (MediaItem) {
    option (google.api.http) = {
      get: "/api/v1/media/{id}"
    };
  }

  rpc ListMediaItems(ListMediaItemsRequest) returns (ListMediaItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/media"
    };
  }

  // Public, non-sensitive projection of media items (id/title/type/year/poster/
  // overview only - never file paths or provider ids). This is the read surface
  // a plugin may be granted via the `public` permission; regular users may call
  // it too. Distinct from GetMediaItem/ListMediaItems, which return sensitive
  // server-side detail and are never exposed to plugin tokens.
  rpc GetPublicMediaItem(GetPublicMediaItemRequest) returns (PublicMediaItem) {
    option (google.api.http) = {
      get: "/api/v1/public/media/{id}"
    };
  }

  rpc ListPublicMediaItems(ListPublicMediaItemsRequest) returns (ListPublicMediaItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/public/media"
    };
  }

  rpc SearchMedia(SearchMediaRequest) returns (SearchMediaResponse) {
    option (google.api.http) = {
      get: "/api/v1/media/search"
    };
  }

  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse) {
    option (google.api.http) = {
      get: "/api/v1/people/{id}"
    };
  }

  rpc GetLibrarySchedule(GetLibraryScheduleRequest) returns (GetLibraryScheduleResponse) {
    option (google.api.http) = {
      get: "/api/v1/libraries/{id}/schedule"
    };
  }

  rpc SetLibrarySchedule(SetLibraryScheduleRequest) returns (LibrarySchedule) {
    option (google.api.http) = {
      put: "/api/v1/libraries/{id}/schedule"
      body: "*"
    };
  }

  rpc DeleteLibrarySchedule(DeleteLibraryScheduleRequest) returns (DeleteLibraryScheduleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/libraries/{id}/schedule"
    };
  }

  rpc FilterMediaItems(FilterMediaItemsRequest) returns (FilterMediaItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/media/filter"
    };
  }

  // ListGenres returns the distinct, sorted genres present across an entire
  // library's media (the full set, not a sample). Powers the library filter's
  // genre chips, which otherwise only saw genres from the first loaded page.
  rpc ListGenres(ListGenresRequest) returns (ListGenresResponse) {
    option (google.api.http) = {
      get: "/api/v1/libraries/{library_id}/genres"
    };
  }

  rpc GetSeriesAggregate(GetSeriesAggregateRequest) returns (SeriesAggregate) {
    option (google.api.http) = {
      get: "/api/v1/media/{id}/series-aggregate"
    };
  }
}

message Library {
  string id = 1;
  string name = 2;
  LibraryType type = 3;
  repeated string paths = 4;
  bool scan_on_startup = 5;
  bool realtime_monitoring = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_scanned_at = 9;
}

enum LibraryType {
  LIBRARY_TYPE_UNSPECIFIED = 0;
  LIBRARY_TYPE_MOVIES = 1;
  LIBRARY_TYPE_SHOWS = 2;
  LIBRARY_TYPE_MUSIC = 3;
  LIBRARY_TYPE_PHOTOS = 4;
  // Deprecated: the server never accepted a books library (domain rejects the
  // type) and no client offers a reader. Kept for wire compatibility only;
  // remove after two server releases per ADR-0004.
  LIBRARY_TYPE_BOOKS = 5 [deprecated = true];
}

message MediaItem {
  string id = 1;
  string library_id = 2;
  string parent_id = 3;
  MediaItemType type = 4;
  string title = 5;
  string sort_title = 6;
  string original_title = 7;
  string overview = 8;
  string tagline = 9;
  string file_path = 10;
  int64 file_size = 11;
  string container_format = 12;
  int64 duration_ms = 13;
  int64 bitrate = 14;
  int32 index_number = 15;
  double community_rating = 16;
  string official_rating = 17;
  google.protobuf.Timestamp premiere_date = 18;
  int32 year = 19;
  map<string, string> provider_ids = 20;
  repeated string genres = 21;
  repeated string studios = 22;
  repeated string tags = 23;
  repeated MediaStream streams = 24;
  repeated MediaPerson people = 25;
  repeated Artwork artwork = 26;
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.Timestamp updated_at = 28;
  repeated Rating ratings = 29;
  repeated Trailer trailers = 30;
  // Per-country content ratings (e.g. {"US":"PG-13","FR":"-12"}).
  // official_rating mirrors the "US" entry when available.
  map<string, string> certifications_by_country = 31;
  // Ancestor display titles, stamped by the read endpoints on episodes (both)
  // and seasons (series_title only): rows and search results can label an
  // episode with its series without one round-trip per card.
  string series_title = 32;
  string season_title = 33;
}

message Rating {
  string source = 1;  // imdb, rt, metacritic, tmdb
  double value = 2;
  double max_value = 3;  // 10 for imdb/tmdb, 100 for rt/metacritic
}

message Trailer {
  string site = 1;
  string key = 2;
  string language = 3;
  bool official = 4;
  string type = 5;
  bool use_subtitles = 6;
  string subtitle_language = 7;
}

enum MediaItemType {
  MEDIA_ITEM_TYPE_UNSPECIFIED = 0;
  MEDIA_ITEM_TYPE_MOVIE = 1;
  MEDIA_ITEM_TYPE_SERIES = 2;
  MEDIA_ITEM_TYPE_SEASON = 3;
  MEDIA_ITEM_TYPE_EPISODE = 4;
  MEDIA_ITEM_TYPE_ALBUM = 5;
  MEDIA_ITEM_TYPE_ARTIST = 6;
  MEDIA_ITEM_TYPE_TRACK = 7;
  MEDIA_ITEM_TYPE_PHOTO = 8;
  // Deprecated: see LIBRARY_TYPE_BOOKS.
  MEDIA_ITEM_TYPE_BOOK = 9 [deprecated = true];
}

message MediaStream {
  int32 index = 1;
  MediaStreamType type = 2;
  string codec = 3;
  string codec_long_name = 4;
  string language = 5;
  string title = 6;
  bool is_default = 7;
  bool is_forced = 8;
  bool is_external = 9;
  string external_path = 10;
  int32 width = 11;
  int32 height = 12;
  double frame_rate = 13;
  string pixel_format = 14;
  string color_space = 15;
  string color_transfer = 16;
  string color_primaries = 17;
  int32 channels = 18;
  int32 sample_rate = 19;
  int32 bit_depth = 20;
  int64 bitrate = 21;
  string profile = 22;
  string level = 23;
}

enum MediaStreamType {
  MEDIA_STREAM_TYPE_UNSPECIFIED = 0;
  MEDIA_STREAM_TYPE_VIDEO = 1;
  MEDIA_STREAM_TYPE_AUDIO = 2;
  MEDIA_STREAM_TYPE_SUBTITLE = 3;
  MEDIA_STREAM_TYPE_ATTACHMENT = 4;
}

message MediaPerson {
  string id = 1;
  string name = 2;
  string role = 3;
  PersonType type = 4;
  string thumb_url = 5;
  int32 sort_order = 6;
}

enum PersonType {
  PERSON_TYPE_UNSPECIFIED = 0;
  PERSON_TYPE_ACTOR = 1;
  PERSON_TYPE_DIRECTOR = 2;
  PERSON_TYPE_WRITER = 3;
  PERSON_TYPE_PRODUCER = 4;
  PERSON_TYPE_COMPOSER = 5;
  PERSON_TYPE_GUEST_STAR = 6;
}

message Artwork {
  string id = 1;
  ArtworkType type = 2;
  string url = 3;
  string provider = 4;
  string language = 5;
  int32 width = 6;
  int32 height = 7;
  bool is_selected = 8;
  // Compact (~30-char) blurhash placeholder. Empty when the source predates
  // the feature or encoding failed. Clients decode it to show a coloured
  // preview while the full image is still loading (Wolt blurhash spec).
  string blurhash = 9;
}

enum ArtworkType {
  ARTWORK_TYPE_UNSPECIFIED = 0;
  ARTWORK_TYPE_PRIMARY = 1;
  ARTWORK_TYPE_BACKDROP = 2;
  ARTWORK_TYPE_BANNER = 3;
  ARTWORK_TYPE_THUMB = 4;
  ARTWORK_TYPE_LOGO = 5;
  ARTWORK_TYPE_DISC = 6;
}

message ScanProgress {
  string library_id = 1;
  ScanPhase phase = 2;
  int32 total_items = 3;
  int32 processed_items = 4;
  string current_path = 5;
  double percent = 6;
  string error = 7;
}

enum ScanPhase {
  SCAN_PHASE_UNSPECIFIED = 0;
  SCAN_PHASE_DISCOVERING = 1;
  SCAN_PHASE_SCANNING = 2;
  SCAN_PHASE_METADATA = 3;
  SCAN_PHASE_ARTWORK = 4;
  SCAN_PHASE_COMPLETE = 5;
}

message Collection {
  string id = 1;
  string name = 2;
  string overview = 3;
  repeated string media_item_ids = 4;
  repeated Artwork artwork = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
  // Opaque keyset cursor returned by a previous PaginationResponse. When
  // set, server uses keyset pagination instead of offset and ignores
  // `page` - guarantees no skips/duplicates under concurrent writes.
  string cursor = 3;
}

message PaginationResponse {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_items = 3;
  int32 total_pages = 4;
  // Opaque cursor for the next page. Empty when no more pages or when
  // the server fell back to offset pagination.
  string next_cursor = 5;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

enum MediaSortField {
  MEDIA_SORT_FIELD_UNSPECIFIED = 0;
  MEDIA_SORT_FIELD_TITLE = 1;
  MEDIA_SORT_FIELD_YEAR = 2;
  MEDIA_SORT_FIELD_RATING = 3;
  MEDIA_SORT_FIELD_DATE_ADDED = 4;
  MEDIA_SORT_FIELD_PREMIERE_DATE = 5;
}

message CreateLibraryRequest {
  string name = 1;
  LibraryType type = 2;
  repeated string paths = 3;
  bool scan_on_startup = 4;
  bool realtime_monitoring = 5;
}

message GetLibraryRequest {
  string id = 1;
}

message ListLibrariesRequest {}

message ListLibrariesResponse {
  repeated Library libraries = 1;
}

message DeleteLibraryRequest {
  string id = 1;
}

message UpdateLibraryRequest {
  string id = 1;
  optional string name = 2;
  repeated string paths = 3;
}

message DeleteLibraryResponse {}

message ScanLibraryRequest {
  string id = 1;
  bool force_refresh = 2;
}

message GetMediaItemRequest {
  string id = 1;
}

// PublicMediaItem is the non-sensitive projection exposed via the `public`
// permission. It deliberately omits file_path, file_size, provider_ids,
// streams and any server-side detail.
message PublicMediaItem {
  string id = 1;
  MediaItemType type = 2;
  string title = 3;
  int32 year = 4;
  string overview = 5;
  string poster_url = 6;
}

message GetPublicMediaItemRequest {
  string id = 1;
}

message ListPublicMediaItemsRequest {
  string library_id = 1;
  MediaItemType type = 2;
  PaginationRequest pagination = 3;
}

message ListPublicMediaItemsResponse {
  repeated PublicMediaItem items = 1;
  int32 total = 2;
}

message ListMediaItemsRequest {
  string library_id = 1;
  MediaItemType type = 2;
  string genre = 3;
  int32 year = 4;
  string parent_id = 5;
  MediaSortField sort_field = 6;
  SortOrder sort_order = 7;
  PaginationRequest pagination = 8;
  string person_id = 9;
}

message ListMediaItemsResponse {
  repeated MediaItem items = 1;
  PaginationResponse pagination = 2;
}

message SearchMediaRequest {
  string query = 1;
  MediaItemType type = 2;
  int32 limit = 3;
  string genre = 4;
  int32 year_min = 5;
  int32 year_max = 6;
  MediaSortField sort_field = 7;
  SortOrder sort_order = 8;
  // Scope the search to a single library. Empty = global. Wired by the
  // library page so its search box stops behaving like a client-side
  // filter on already-loaded items - the backend now actually limits
  // results to the library. Meilisearch + SQL fallback both filter on
  // library_id natively.
  string library_id = 9;
}

message SearchMediaResponse {
  repeated MediaItem items = 1;
  int32 total_hits = 2;
}

message GetPersonRequest {
  string id = 1;
}

message GetPersonResponse {
  string id = 1;
  string name = 2;
  string thumb_url = 3;
  map<string, string> provider_ids = 4;
  string biography = 5;
  string birthday = 6;
  string deathday = 7;
  string place_of_birth = 8;
  string known_for = 9;
}

message LibrarySchedule {
  string library_id = 1;
  string cron = 2;
  bool enabled = 3;
  google.protobuf.Timestamp last_run_at = 4;
  google.protobuf.Timestamp next_run_at = 5;
}

message GetLibraryScheduleRequest {
  string id = 1;
}

message GetLibraryScheduleResponse {
  LibrarySchedule schedule = 1;
}

message SetLibraryScheduleRequest {
  string id = 1;
  string cron = 2;
  bool enabled = 3;
}

message DeleteLibraryScheduleRequest {
  string id = 1;
}

message DeleteLibraryScheduleResponse {}

message FilterMediaItemsRequest {
  string library_id = 1;
  MediaItemType type = 2;
  // genre: single-genre filter (kept for the free-text genre input). For
  // multi-select use `genres` below - when both are set, `genres` wins.
  string genre = 3;
  int32 year_from = 4;
  int32 year_to = 5;
  double min_rating = 6;
  MediaSortField sort_field = 7;
  SortOrder sort_order = 8;
  int32 limit = 9;
  int32 offset = 10;
  // genres: OR-match on any of these genres (the filter chips). Discriminant
  // server-side over the whole library, unlike the previous client-side
  // narrowing on already-loaded items.
  repeated string genres = 11;
}

message FilterMediaItemsResponse {
  repeated MediaItem items = 1;
  int32 total = 2;
}

message ListGenresRequest {
  string library_id = 1;
}

message ListGenresResponse {
  repeated string genres = 1;
}

message GetSeriesAggregateRequest {
  string id = 1;
}

// Aggregate runtime for a series: sum of every episode's duration across all
// seasons that are actually present in the library. Computed live (not
// denormalized) via a recursive CTE.
message SeriesAggregate {
  string series_id = 1;
  int64 total_duration_ms = 2;
  int32 episode_count = 3;
  int32 season_count = 4;
}
