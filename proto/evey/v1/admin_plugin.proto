syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service AdminPluginService {
  rpc ListPluginRuntimes(ListPluginRuntimesRequest) returns (ListPluginRuntimesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugin-runtimes"
    };
  }

  rpc AddPluginRuntime(AddPluginRuntimeRequest) returns (PluginRuntime) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugin-runtimes"
      body: "*"
    };
  }

  rpc RemovePluginRuntime(RemovePluginRuntimeRequest) returns (RemovePluginRuntimeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/plugin-runtimes/{id}"
    };
  }

  rpc InstallPlugin(InstallPluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/install"
      body: "*"
    };
  }

  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/plugins/{id}"
    };
  }

  rpc EnablePlugin(EnablePluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{id}/enable"
    };
  }

  rpc DisablePlugin(DisablePluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{id}/disable"
    };
  }

  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins"
    };
  }

  rpc GetPluginConfig(GetPluginConfigRequest) returns (PluginConfig) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins/{plugin_id}/config"
    };
  }

  rpc UpdatePluginConfig(UpdatePluginConfigRequest) returns (PluginConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/plugins/{plugin_id}/config"
      body: "*"
    };
  }

  rpc GetPluginLogs(GetPluginLogsRequest) returns (GetPluginLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins/{plugin_id}/logs"
    };
  }

  // IssuePluginToken returns a short-lived (5min) scoped JWT for the plugin iframe.
  // Scopes are the intersection of the plugin manifest permissions and the
  // admin-approved permissions, filtered through the auth-layer whitelist.
  // Forbidden scopes (admin:*, auth:*, system:*, user:write, library:write) are
  // stripped unconditionally.
  rpc IssuePluginToken(IssuePluginTokenRequest) returns (IssuePluginTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/plugins/{plugin_id}/token"
      body: "*"
    };
  }

  // PreviewPluginUpdate returns a diff of what would change if the candidate
  // ZIP were applied to the currently installed plugin. No state is mutated.
  rpc PreviewPluginUpdate(PreviewPluginUpdateRequest) returns (PreviewPluginUpdateResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{plugin_id}/preview-update"
      body: "*"
    };
  }

  // ApplyPluginUpdate applies a previously previewed update. The
  // acknowledged_hash must match the SHA-256 of the candidate ZIP computed
  // during the preview call (anti-TOCTOU guard). When the preview indicated
  // requires_ack=true, the admin must explicitly confirm before calling this.
  rpc ApplyPluginUpdate(ApplyPluginUpdateRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{plugin_id}/apply-update"
      body: "*"
    };
  }

  // GetPluginResourceLimits returns the effective per-plugin resource caps the
  // runner is enforcing (env defaults overlaid with admin overrides).
  rpc GetPluginResourceLimits(GetPluginResourceLimitsRequest) returns (PluginResourceLimits) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugin-resource-limits"
    };
  }

  // UpdatePluginResourceLimits validates, persists and applies the per-plugin
  // resource caps live: memory/PID/disk on the next monitor sweep, cpu_nice and
  // sandbox_mode to plugins started afterwards. Returns the new effective caps.
  rpc UpdatePluginResourceLimits(PluginResourceLimits) returns (PluginResourceLimits) {
    option (google.api.http) = {
      put: "/api/v1/admin/plugin-resource-limits"
      body: "*"
    };
  }

  // GetPluginMetadataSettings returns what a metadata plugin (capability
  // metadata.provider) may replace on an item, and where the fetch of the
  // existing library stands.
  rpc GetPluginMetadataSettings(GetPluginMetadataSettingsRequest) returns (PluginMetadataSettings) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins/{plugin_id}/metadata-settings"
    };
  }

  // UpdatePluginMetadataSettings sets the fields a metadata plugin may
  // replace. It applies to what the plugin already gave: nothing is fetched
  // again.
  rpc UpdatePluginMetadataSettings(UpdatePluginMetadataSettingsRequest) returns (PluginMetadataSettings) {
    option (google.api.http) = {
      put: "/api/v1/admin/plugins/{plugin_id}/metadata-settings"
      body: "*"
    };
  }

  // RefreshPluginMetadata asks a metadata plugin about every movie and
  // series of the libraries, in the background, one item after the other.
  // New items are asked about as they are enriched; this is for the library
  // the plugin found when it was installed.
  rpc RefreshPluginMetadata(RefreshPluginMetadataRequest) returns (PluginMetadataSettings) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{plugin_id}/metadata-refresh"
      body: "*"
    };
  }

  // Trusted publishers are the plugin signing keys this instance accepts: a
  // plugin signed by one of them shows its publisher's name, an unknown key
  // shows its fingerprint, and the enforce policy admits trusted keys only.
  rpc ListTrustedPublishers(ListTrustedPublishersRequest) returns (ListTrustedPublishersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugin-publishers"
    };
  }

  // AddTrustedPublisher registers a key by its PEM public key, or by the
  // fingerprint an installed plugin already carries.
  rpc AddTrustedPublisher(AddTrustedPublisherRequest) returns (TrustedPublisher) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugin-publishers"
      body: "*"
    };
  }

  rpc RemoveTrustedPublisher(RemoveTrustedPublisherRequest) returns (RemoveTrustedPublisherResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/plugin-publishers/{fingerprint}"
    };
  }
}

// PluginSignature is the verdict on a plugin package's cosign signature. The
// key travels with the package (cosign.pub at the ZIP root); its fingerprint
// is pinned at install so a later update signed by another key is caught.
message PluginSignature {
  // verified says the detached signature matches the package and its key.
  bool verified = 1;
  // key_fingerprint is "sha256:<hex>" of the signing public key, empty when
  // the package carries no key.
  string key_fingerprint = 2;
  // publisher is the trusted publisher's name when the key is in the
  // instance's list, empty otherwise.
  string publisher = 3;
  bool trusted = 4;
  // continuity against the installed version: "" (first install or the
  // installed version was unsigned), "same", "changed" (another key),
  // "lost" (the installed version was signed, this one is not).
  string continuity = 5;
  string error = 6;
}

message TrustedPublisher {
  string fingerprint = 1;
  string name = 2;
  string public_key_pem = 3;
  string added_at = 4;
  // seeded says the key came from EVEY_PLUGINS_COSIGN_PUBLIC_KEY at boot and
  // cannot be removed from the panel.
  bool seeded = 5;
}

message ListTrustedPublishersRequest {}

message ListTrustedPublishersResponse {
  repeated TrustedPublisher publishers = 1;
}

message AddTrustedPublisherRequest {
  string name = 1;
  // One of the two: a PEM public key, or the fingerprint of a key an
  // installed plugin carries (the server already holds that key).
  string public_key_pem = 2;
  string fingerprint = 3;
}

message RemoveTrustedPublisherRequest {
  string fingerprint = 1;
}

message RemoveTrustedPublisherResponse {}

message IssuePluginTokenRequest {
  string plugin_id = 1;
}

message IssuePluginTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  repeated string scopes = 3;
}

message PluginRuntime {
  string id = 1;
  string name = 2;
  string language = 3;
  string version = 4;
  string binary_path = 5;
  bool available = 6;
}

message FrontModule {
  string slot = 1;
  string src = 2;
}

message Plugin {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string author = 5;
  string language = 6;
  bool enabled = 7;
  PluginState state = 8;
  string entry_point = 9;
  google.protobuf.Timestamp installed_at = 10;
  repeated string permissions = 11;
  repeated string capabilities = 12;
  string source_hash = 13;
  PluginAnalysisReport analysis_report = 14;
  string error_message = 15;
  string kind = 16;
  repeated FrontModule frontend = 17;
  repeated string external_fetch = 18;
  string web_root = 19;
  // signature is the install-time verdict; null when the policy is off.
  PluginSignature signature = 20;
}

// PluginAnalysisReport exposes the static-analysis warnings recorded at
// install time so the admin can audit them post-install.
message PluginAnalysisReport {
  bool safe = 1;
  repeated string issues = 2;
  repeated PluginExtractedURL urls = 3;
  int32 file_count = 4;
}

message PluginExtractedURL {
  string url = 1;
  string file = 2;
  int32 line = 3;
}

enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_INSTALLED = 1;
  PLUGIN_STATE_RUNNING = 2;
  PLUGIN_STATE_STOPPED = 3;
  PLUGIN_STATE_ERROR = 4;
  PLUGIN_STATE_INITIALIZING = 5;
}

message PluginConfig {
  string plugin_id = 1;
  map<string, string> values = 2;
  string config_schema_json = 3;
}

message GetPluginResourceLimitsRequest {}

// PluginResourceLimits is the effective per-plugin cap set enforced by the
// runner's resource monitor. Used as both the read response and the update
// request (server validates ranges and ignores out-of-range values).
message PluginResourceLimits {
  int32 memory_mb = 1;     // max RSS per plugin (MiB); 0 = package default
  int32 pids_max = 2;      // max threads/processes per plugin; 0 = package default
  int32 disk_max_mb = 3;   // max install-dir size per plugin (MiB); 0 = disabled
  int32 cpu_nice = 4;      // scheduling nice applied at spawn (0-19)
  string sandbox_mode = 5; // auto | landlock | bubblewrap | strict | basic
}

message PluginLogEntry {
  string level = 1;
  string message = 2;
  map<string, string> fields = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ListPluginRuntimesRequest {}

message ListPluginRuntimesResponse {
  repeated PluginRuntime runtimes = 1;
}

message AddPluginRuntimeRequest {
  string name = 1;
  string language = 2;
  string version = 3;
  string binary_path = 4;
}

message RemovePluginRuntimeRequest {
  string id = 1;
}

message RemovePluginRuntimeResponse {}

message InstallPluginRequest {
  string source = 1;
  string name = 2;
  // Set to true after the admin has explicitly acknowledged the new
  // permissions / capabilities / slots / external_fetch hosts requested by
  // an update. When false, an update that escalates permissions returns
  // FAILED_PRECONDITION with the diff in the error message and the install
  // is rolled back. The frontend should surface a modal listing the diff
  // and retry with this flag set after the admin confirms.
  bool accept_permission_changes = 3;
}

message UninstallPluginRequest {
  string id = 1;
}

message UninstallPluginResponse {}

message EnablePluginRequest {
  string id = 1;
}

message DisablePluginRequest {
  string id = 1;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

message GetPluginConfigRequest {
  string plugin_id = 1;
}

message UpdatePluginConfigRequest {
  string plugin_id = 1;
  map<string, string> values = 2;
}

message GetPluginLogsRequest {
  string plugin_id = 1;
  string level = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetPluginLogsResponse {
  repeated PluginLogEntry entries = 1;
  int32 total = 2;
}

message SecurityFinding {
  string category = 1;
  string severity = 2;
  string file = 3;
  int32 line = 4;
  string description = 5;
}

message PreviewPluginUpdateRequest {
  string plugin_id = 1;
  string source = 2;
}

message PreviewPluginUpdateResponse {
  string current_version = 1;
  string candidate_version = 2;
  repeated string permissions_added = 3;
  repeated string permissions_removed = 4;
  repeated string capabilities_added = 5;
  repeated string capabilities_removed = 6;
  repeated string slots_added = 7;
  repeated string slots_removed = 8;
  repeated string external_fetch_added = 9;
  repeated string external_fetch_removed = 10;
  repeated SecurityFinding new_findings = 11;
  // signature_status: "signed", "signed-untrusted", "unsigned", "invalid",
  // "publisher-changed" or "signature-lost" (the last two set requires_ack).
  string signature_status = 12;
  bool requires_ack = 13;
  string source_hash = 14;
  PluginSignature signature = 15;
}

message ApplyPluginUpdateRequest {
  string plugin_id = 1;
  string source = 2;
  // acknowledged_hash must match the source_hash returned by PreviewPluginUpdate.
  // Ensures the admin acknowledged exactly the candidate that was previewed.
  string acknowledged_hash = 3;
  // accept_new_publisher lets an update signed by another key than the
  // installed version (or no longer signed) through; refused without it.
  bool accept_new_publisher = 4;
}

message GetPluginMetadataSettingsRequest {
  string plugin_id = 1;
}

message UpdatePluginMetadataSettingsRequest {
  string plugin_id = 1;
  // fields the plugin may replace, among PluginMetadataSettings.available_fields.
  repeated string fields = 2;
}

message RefreshPluginMetadataRequest {
  string plugin_id = 1;
}

// PluginMetadataRefresh is where the fetch of the existing library stands for
// one plugin since the server started.
message PluginMetadataRefresh {
  bool running = 1;
  // done of total movies and series asked about; covered is how many of them
  // the plugin gave a text for.
  int32 done = 2;
  int32 total = 3;
  int32 covered = 4;
  // failed counts the items the plugin did not answer (an error, a timeout).
  int32 failed = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message PluginMetadataSettings {
  string plugin_id = 1;
  // fields the plugin may replace; TMDB keeps the others.
  repeated string fields = 2;
  // available_fields is every field a metadata plugin can replace, in display
  // order: title, overview, tagline.
  repeated string available_fields = 3;
  PluginMetadataRefresh refresh = 4;
}
