name: lumina
kind: plugin
version: 1.0.0
description: Ambient volumetric light art - abstract drifting god-rays, liquid caustics and floating bokeh, zero network access
author: evey-examples
language: nodejs
entrypoint: node main.js
permissions:
  - prefs
web_root: dist
frontend:
  - slot: home.section
    src: dist/index.js
  - slot: settings.user.appearance
    src: dist/settings.js
config_schema:
  palette:
    type: select
    label: Palette
    default: aurore
    options:
      - value: aurore
        label: Aurore
      - value: neon
        label: Néon
      - value: braise
        label: Braise
      - value: ocean
        label: Océan
  intensity:
    type: number
    label: Intensity
    default: 0.7
    min: 0.2
    max: 1
  speed:
    type: number
    label: Speed
    default: 1
    min: 0.3
    max: 2
