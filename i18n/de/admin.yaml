  audioOffsetBadge: "Ton bei +{{sec}} s"
  audioOffsetHint: "Eine Tonspur beginnt nach dem Bild. Genau so wird eine Synchronfassung auf einen Schnitt gelegt, und jeder Player folgt dem - hier ist nichts zu reparieren."
  audioOffsetProvenHint: "Eine Tonspur beginnt nach dem Bild, und die Spuren dieser Datei wurden verglichen: Sie stimmen überein, der Versatz ist gewollt. Nichts zu tun."
  audioTracksDisagreeBadge: "Tonspuren {{sec}} s auseinander"
  audioTracksDisagreeHint: "Die Tonspuren dieser Datei wurden verglichen und liegen {{sec}} s auseinander - eine davon sitzt falsch. Welche, lässt sich hier nicht sagen, also wird nichts automatisch geändert: beide anhören und die richtige behalten, oder die Datei neu beschaffen."
  audioPictureOffBadge: "Ton {{sec}} s neben dem Bild"
  audioPictureOffHint: "Gemessen an den Untertiteln der Datei (die auf das Bild getaktet sind): Audiospur {{track}} liegt {{sec}} s neben der Stelle, an der die Sprache sein müsste - positiv heißt, der Ton muss später kommen. Mindestens zwei Abschnitte des Films stimmen überein. Auf dem Vorschau-Clip prüfen und die Verschiebung von dort anwenden; nichts wird von allein umgeschrieben."
  audioTrackZeroedBadge: "Tonspur auf 0 gezogen"
  audioTrackZeroedHint: "Eine Tonspur dieser Datei beginnt exakt mit dem Bild, während eine andere ihren kleinen ursprünglichen Versatz behält. Das ist die Spur, die eine frühere Audio-Reparatur hinterlässt, wenn sie eine Tonspur um ihren eigenen deklarierten Versatz zurückzieht. Läuft die Synchronfassung zu früh, ist der entfernte Wert nicht mehr in der Datei und nichts hier kann ihn automatisch zurückbringen: anhören, von Hand korrigieren oder die Datei neu beschaffen."
  truncatedBadge: "Unvollständiger Download"
  truncatedSizeBadge: "Unvollständig - fehlendes Ende ~{{size}}"
  repairHint: "Baut den Seek-Index neu auf. Konstruktiv sicher: Neuaufbau in eine Temp-Kopie, vollständige Re-Validierung, atomarer Tausch - das Original bleibt als wiederherstellbares .mkvgobak erhalten."
  damagedBadge: "Beschädigt ~{{size}}"
  truncatedHint: "Diese Datei ist ein unvollständiger Download: Das Ende fehlt und kein Werkzeug kann es wiederherstellen. Quelle erneut beschaffen - ein Resync würde nur einen abspielbaren Anfang rekonstruieren, nicht den ganzen Film."
  wrongContainerBadge: "Falscher Container"
  wrongContainerHint: "Diese .mkv ist in Wirklichkeit eine MP4/MOV-Datei: Es gibt keinen Matroska-Index aufzubauen. Die Reparatur benennt sie in .mp4 um und aktualisiert die Bibliothek."
  brokenInterleaveBadge: "Spuren blockweise abgelegt"
  brokenInterleaveHint: "Die Spuren liegen in getrennten Blöcken von mehreren Minuten (erst nur Video, dann nur Audio) statt verschachtelt - ein Zeitstempel springt zwischen zwei Stellen der Datei um {{sec}}s zurück. Alle Header sind in Ordnung und jeder Stream dekodiert, aber kein sequentieller Player kommt über den ersten Block hinaus: die Direktwiedergabe bleibt hängen und ffmpeg wartet minutenlang auf sein erstes Audio-Segment. Nur der Packager (Streaming ohne Umwandlung) liefert sie aus und liest dabei etwa die doppelte Datei und bei jedem Sprung einen ganzen Block. Die Schaltfläche „Spuren neu verschachteln“ schreibt die Datei verlustfrei neu (das Original bleibt als Sicherung); eine einfache Stream-Kopie anderswo reproduziert das Layout."
  unreadableBadge: "Unlesbar"
  unreadableHint: "Der Scan konnte diese Datei nicht diagnostizieren: fehlt oder ist auf der Platte unlesbar, oder der Container wurde vom Parser abgelehnt. Von hier aus ist nichts zu reparieren - Einhängepunkt prüfen oder die Quelle neu beschaffen. Detail: {{detail}}"
  trailingJunkBadge: "Überschüssige Bytes"
  trailingJunkHint: "Überschüssige Bytes liegen NACH dem deklarierten Ende des Segments - das Medium ist vollständig und abspielbar. Nichts zu tun: Ein Neuschreiben für eine andere Reparatur entfernt sie nebenbei."
  statsAudioShort: "Audio endet zu früh"
  audioShortBadge: "Audio -{{sec}} s"
  audioShortHint: "Eine Audiospur endet {{sec}}s vor dem Bild (stummer Abspann auf dieser Spur). Die Datei ist ansonsten intakt; die Wiedergabe füllt das fehlende Ende mit Stille. Gemessen wird gegen das tatsächliche Ende des Bildes, nicht gegen die deklarierte Dauer des Containers - eine zu hoch angesetzte Dauer wird also nie dem Ton angelastet. Keine Reparatur möglich: Dieses Audio ist schlicht nicht in der Datei; für eine echte Korrektur die Quelle neu beziehen."
  statsSeekCoarse: "Grobes Springen"
  seekCoarseBadge: "Grobes Springen"
  seekCoarseHint: "Der Index wurde neu aufgebaut und eine Lücke bleibt: {{detail}}. Ein Sprung IN diese Lücke landet an ihrem Rand; überall sonst ist das Springen exakt. Live gemessen ist die Lücke meist der Abspann (kein Keyframe nach dem letzten), den kein Index füllen kann und der niemanden stört. Eine Lücke mitten im Film sind die Keyframes der Kodierung selbst - nur eine bessere Quelle hilft."
  repair: "Reparieren"
  repairResync: "Reparatur mit Neusynchronisierung"
  repairResyncHint: "Baut den Index neu und überspringt den beschädigten Bereich: rettet alles davor und danach, verliert nur die beschädigte Spanne (Sekundenbruchteil). Behält eine Sicherung."
  resyncRequiredBadge: "Beschädigung bei der Reparatur gefunden"
  resyncRequiredHint: "Die normale Reparatur hat diese Datei durchlaufen und ihr Stream lässt sich nicht lesen: ein beschädigter Bereich, den der Scan - der nur den Kopf liest - nicht sehen konnte. Nur eine Resynchronisierung kommt daran vorbei; sie überspringt den Bereich und verliert diese Bytes endgültig, behält aber immer das Original als Backup. Wie viel verloren geht, ist hier nicht im Voraus bekannt."
  resyncRequiredNote: "Darunter {{count}}, die die normale Reparatur abgelehnt hat: Ihre Beschädigung wurde erst beim Neuschreiben gefunden, ihr Verlust steckt also nicht in der Zahl oben."
