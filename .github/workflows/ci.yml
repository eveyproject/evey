name: CI

on:
  push:
    branches:
      - main
      - master
      # Beta/alpha test branches publish their own image tag (named after
      # the branch, e.g. gravityz/evey:beta-0.0.1). `latest` stays gated on
      # semver tags below - beta builds never touch it.
      - 'beta-*'
      - 'alpha-*'
    # Release tags also trigger publish (vX.Y.Z → latest alias + semver tags).
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  # Manual re-run, mainly to force the arm64 half of the image without pushing
  # a tag. Branch pushes build amd64 only - see "Resolve build platforms".
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Image platforms to build (buildx list)'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Backend is split in two parallel jobs (was one ~13-17 min sequential
  # backend job): `quality` carries vet + govulncheck + golangci-lint + gosec,
  # `correctness` carries build + unit tests + postgres testcontainers.
  # The two share the same proto-generate prelude but run on separate
  # runners - wallclock drops from sum(quality, correctness) to max(...).
  # Cost: setup-go + buf duplicated, but both cache hit so the overhead
  # is ~30-60s per job, far less than what's saved.
  quality:
    name: Backend - quality & security
    # fetch-depth: 0 below - the proto breaking-change check diffs against the
    # pre-push SHA, which a depth-1 checkout would not contain.
    # Self-hosted temporarily disabled 2026-07-03 - reusing GitHub-hosted runners
    # for now. Restore the ternary below to route push + same-repo PRs back to the
    # self-hosted workers (fork PRs stayed on GitHub-hosted so untrusted code never
    # executes on the self-hosted runner - RCE guard):
    # runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto
        run: buf generate

      - name: check proto breaking changes
        # Diff current HEAD against the target branch tip (not HEAD~1, which
        # silently passes on multi-commit pushes since it only looks at the last
        # commit).
        #
        # This step used to be gated on `if: github.event_name == 'pull_request'`
        # and therefore never ran once: this project merges locally and pushes
        # branches straight to the remote, so no pull request is ever opened. A
        # proto break would have reached already-deployed mobile and TV clients
        # with the only guard against it structurally unreachable.
        #
        # On a push the target is the pre-push SHA, not the default branch. The
        # contract that matters is whatever the clients are currently running,
        # and for a release branch that is its own previous tip - diffing a long
        # lived branch against master instead reports every deliberate removal
        # it has ever accumulated, which would leave the gate permanently red
        # and get it switched off again. A branch's first push has no `before`
        # commit (all zeroes), so there is nothing to compare and we skip.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            against="https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch, no previous tip to compare against - skipping"
            exit 0
          else
            before="${{ github.event.before }}"
            # A force-push (history rewrite) leaves `before` pointing at a
            # commit this clone no longer contains, and buf then fails on a
            # missing tree rather than on a proto break. Nothing survives under
            # that history, so there is no contract left to diff against.
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "previous tip ${before} is gone (history rewritten) - skipping"
              exit 0
            fi
            against=".git#ref=${before}"
          fi
          echo "buf breaking against: ${against}"
          buf breaking --against "${against}"

      - name: vet
        run: go vet $(go list ./... | grep -v /gen/)

      # Self-healing install + absolute-path invoke. The old actions/cache step
      # was built for ephemeral GitHub-hosted runners and MISBEHAVED on the
      # self-hosted box: it reported a cache HIT (so the conditional install was
      # skipped) while the binary was absent → `127: no such file`. On the
      # persistent self-hosted runner GOPATH/bin survives between runs, so we
      # just ensure the binary exists (first run installs, later runs reuse) and
      # call it by full path (GOPATH/bin isn't on PATH there, unlike GitHub
      # runners). The version is pinned for reproducibility - and CHECKED, not
      # just "does the file exist": the self-hosted runner keeps GOPATH/bin
      # between runs, so a stale binary would survive a version bump forever.
      # v1.7.0 is the floor that understands Go 1.27 syntax (v1.1.4 panics with
      # "unexpected expr: *ast.KeyValueExpr" on this module).
      - name: govulncheck
        run: |
          VULN_VERSION=v1.7.0
          BIN="$(go env GOPATH)/bin/govulncheck"
          "$BIN" -version 2>/dev/null | grep -q "${VULN_VERSION#v}" || go install golang.org/x/vuln/cmd/govulncheck@${VULN_VERSION}
          "$BIN" ./cmd/... ./internal/...

      # Code-quality linters (.golangci.yml). Ratchet mode: only-new-issues
      # means a pre-existing finding never blocks - only issues introduced by
      # the pushed commits (push: before..after diff) or the PR diff fail the
      # build. Skipped on release tags (no diff base → would report everything).
      - name: lint (golangci-lint, new issues only)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.13.2
          only-new-issues: true

      # Curated gosec security scan (.golangci.gosec.yml - high-signal rules
      # only; see gosec_eval). Same ratchet: the ~21 legacy findings (mostly
      # already-triaged false positives) never block - only a newly introduced
      # SQL/cookie/taint/secret regression does.
      - name: gosec security scan (curated, new issues only)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.13.2
          only-new-issues: true
          skip-save-cache: true
          args: --config=.golangci.gosec.yml

  correctness:
    name: Backend - build & test
    # Self-hosted temporarily disabled 2026-07-03 - reusing GitHub-hosted runners
    # for now. Restore the ternary below to route push + same-repo PRs back to the
    # self-hosted workers (fork PRs stayed on GitHub-hosted so untrusted code never
    # executes on the self-hosted runner - RCE guard):
    # runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto
        run: buf generate

      - name: build
        run: go build ./...

      # Unit tests keep -race: lots of goroutines (HTTP handlers, transcoder
      # sessions, etc.) - race detection is high-value there.
      #
      # -timeout is PER PACKAGE binary. The ffmpeg package runs several real
      # ffmpeg calibration benchmarks (BenchmarkRunner_*): each does a full
      # SDR+HDR+AV1+HW encode ladder, ~30-60 s of subprocess time. On the fast
      # GitHub-hosted amd64 boxes the package fit in 120 s; on the slower
      # self-hosted runner it doesn't (the assertions are hardware-agnostic -
      # they floor at 720p - so this is purely a wall-clock budget, not a
      # failure). 600 s gives the ffmpeg package comfortable headroom while
      # still catching a genuine hang.
      - name: test (unit)
        run: |
          go test \
            $(go list ./... | grep -v "adapters/driven/postgres" | grep -v /gen/) \
            -count=1 -timeout=600s -race

      # Postgres tests run serialised through a shared testcontainer
      # (no t.Parallel - truncateAll would race across tests). -race adds
      # 2-3× overhead with little signal here (the postgres repo layer
      # has no concurrent goroutines on its hot path), so it runs without
      # -race in CI and is re-run with -race nightly (cf nightly-race.yml).
      # 600s: the suite grew past the old 300s budget (403 tests × one
      # multi-table TRUNCATE each), so the alarm expired MID-RUN and blamed
      # whichever test happened to be executing - three different "victims"
      # across three runs on 2026-07-10/11. fsync=off on the test containers
      # brought the suite back to a fraction of that; the budget doubles so
      # organic growth doesn't recreate the false-hang for a long while.
      - name: test (postgres - testcontainers)
        run: go test ./internal/adapters/driven/postgres/... -count=1 -timeout=600s

  frontend:
    name: Frontend - typecheck, test & build
    # Self-hosted temporarily disabled 2026-07-03 - reusing GitHub-hosted runners
    # for now. Restore the ternary below to route push + same-repo PRs back to the
    # self-hosted workers (fork PRs stayed on GitHub-hosted so untrusted code never
    # executes on the self-hosted runner - RCE guard):
    # runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: enable corepack
        run: corepack enable

      - name: install pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: install buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto (swagger)
        run: buf generate

      - name: install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: generate api client
        working-directory: frontend
        run: pnpm --filter @evey/api run generate

      - name: typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: lint
        working-directory: frontend
        run: pnpm run lint

      # Runs every vitest project at once (web, mobile, tv, store, api). Until
      # 2026-07-23 this job was typecheck+lint+build only, so the whole frontend
      # suite gated nothing despite being the larger half of the project's tests.
      - name: unit tests
        working-directory: frontend
        run: pnpm run test

      - name: build
        working-directory: frontend
        run: pnpm run build

  docker:
    name: Docker - build & push (${{ matrix.runtime.name }})
    runs-on: ubuntu-latest  # GitHub-hosted - self-hosted re-disabled 2026-07-03, reusing GitHub runners for now
    # runs-on: self-hosted  # re-enable to switch back to the self-hosted workers
    needs: [quality, correctness, frontend]
    # Only publish on push events (branch push or release tag) and on an
    # explicit manual run - never on PRs. The 3 backend/frontend jobs already
    # gate this, so a failing test/lint blocks the image from reaching either
    # registry.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    strategy:
      fail-fast: false
      # Three image variants are published in parallel. The `lean` variant is
      # the default tag (no suffix) - python3 only. `-nodejs` adds node for
      # JS plugins, `-full` adds php + ruby + lua too. The Dockerfile's
      # RUNTIMES build-arg drives which apt packages are layered in (all three
      # share the same full-HW Debian `runtime` stage - only plugin runtimes
      # differ). See the Dockerfile `runtime` stage + docker/entrypoint.sh.
      matrix:
        runtime:
          - { name: lean,   suffix: ''        }
          - { name: nodejs, suffix: '-nodejs' }
          - { name: full,   suffix: '-full'   }
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner (ghcr requires lowercase)
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Tag strategy:
      # - push to master/main       → `master`  + `sha-<short>`
      # - push git tag vX.Y.Z       → `X.Y.Z`   + `X.Y` + `X` + `latest` + `sha-<short>`
      # - push git tag vX.Y.Z-beta.N → `X.Y.Z-beta.N` + `sha-<short>` (no `latest`, no X.Y)
      # `latest` is gated on vX.Y.Z tags only so it always means "latest
      # semver release", never "last commit on master that happened to build".
      #
      # The matrix variant suffix (`-nodejs`, `-full`) is applied to every
      # tag via `flavor.suffix` so each variant gets a parallel set:
      #   beta-0.0.1, beta-0.0.1-nodejs, beta-0.0.1-full
      #   v1.2.3,     v1.2.3-nodejs,     v1.2.3-full
      #   latest,     latest-nodejs,     latest-full   (release only)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/evey
            ghcr.io/${{ steps.owner.outputs.name }}/evey
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # `latest` = the newest STABLE release only. A pre-release tag
            # (v0.1.0-beta.1, v1.0.0-rc.2 - anything with a hyphen) publishes its
            # own version tag and leaves `latest` alone, so a closed-beta cut can
            # never land on the operators who track `latest`.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          flavor: |
            suffix=${{ matrix.runtime.suffix }},onlatest=true

      # arm64 emulation for the multi-arch stable-release build (below). Cheap
      # to register on every run; only actually used when arm64 is a target.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build timestamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Multi-arch (amd64 + arm64) on every published build.
      #
      # This used to be gated on a STABLE `vX.Y.Z` tag - a tag this repository
      # has never created. The arm64 image was therefore configured but never
      # once built, and the guards written for it (the TARGETARCH branches in
      # the Dockerfile) were never exercised. A trigger that never fires is not
      # a conservative default, it is dead configuration.
      #
      # What made the old gate defensible was the cost: every stage ran under
      # QEMU. Since the $BUILDPLATFORM pins on the gomod/protogen/wasm/frontend/
      # builder stages, the four architecture-independent stages (protos, wasm,
      # frontend bundle, Go compile) run NATIVE and are shared across both
      # targets - `go build ./cmd/evey` alone measured 239 s emulated vs 16 s
      # cross-compiled on the same host, same cold cache, same 4 CPUs.
      # Only the Debian runtime stage (apt, no compilation) is still emulated,
      # which is why building both arches on each push is now affordable.
      #
      # BUT: measured on the real repo, a push still costs ~33 min wall clock -
      # three image variants times two arches, and the Debian runtime stage is
      # emulated for every one of them. The owner builds on every push; releases
      # are rare. So amd64 is the DEFAULT and arm64 is opt-in:
      #   - workflow_dispatch input  -> exactly what the operator asked for
      #   - a v*.*.* tag             -> both arches (that is what ships)
      #   - `[arm64]` in the commit  -> both arches, for a one-off check
      #   - anything else            -> amd64 only
      # The arm64 path stays exercised (every release goes through it), which is
      # what the old `[skip arm64]` gate failed to guarantee.
      - name: Resolve build platforms
        id: platforms
        env:
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -n "${DISPATCH_PLATFORMS}" ]]; then
            value="${DISPATCH_PLATFORMS}"
            echo "manual dispatch - building ${value}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            value="linux/amd64,linux/arm64"
            echo "release tag - building multi-arch amd64 + arm64"
          elif [[ "${HEAD_COMMIT_MSG}" == *"[arm64]"* ]]; then
            value="linux/amd64,linux/arm64"
            echo "commit message carries [arm64] - building multi-arch"
          else
            value="linux/amd64"
            echo "branch push - building amd64 only (tag or [arm64] to get both)"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # COMMIT/BUILD_DATE stamp the binary so /healthz and the admin API
          # report the exact code they run - `VERSION` alone is a branch name
          # and two images months apart both call themselves "beta-0.0.1".
          # github.sha is always a full 40-char SHA here, so the Dockerfile's
          # lie guard (which rejects an empty or malformed value) never fires
          # in CI - it exists for hand-run builds outside a git checkout.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            RUNTIMES=${{ matrix.runtime.name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          # Scope the GHA cache per variant so a `full` build never overwrites
          # the `lean` cache and vice versa - buildx layers diverge only in the
          # apt layer but the cache key needs to reflect that to stay correct.
          #
          # ignore-error=true: the image build+push is the deliverable; the GHA
          # cache export is a best-effort speedup. The GitHub Actions Cache
          # service is flaky/unavailable on this self-hosted + over-quota setup
          # (400 "services aren't available" on export), which would otherwise
          # red-fail the job AFTER the image already shipped. Don't let a cache
          # hiccup mask a successful publish. (If the cache stays down, builds
          # just run uncached - switch to type=local for persistent on-disk
          # caching on the runner if speed becomes an issue.)
          cache-from: type=gha,scope=docker-${{ matrix.runtime.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.runtime.name }},ignore-error=true
          outputs: type=image,compression=zstd,compression-level=3,force-compression=true,push=true

      # Docker Hub page: short blurb + docs/dockerhub.md as the full description.
      # Once per run (the lean variant), and best-effort: the image is the
      # deliverable, a Hub API hiccup must not red-fail a publish that already
      # happened. Needs DOCKERHUB_TOKEN with read/write/delete scope (a push-only
      # token is refused by the description endpoint - the step then fails
      # visibly here without blocking anything).
      - name: Sync Docker Hub description
        if: matrix.runtime.name == 'lean'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/evey
          short-description: "Self-hosted media server. One container, hardware transcoding included, sandboxed plugins."
          readme-filepath: ./docs/dockerhub.md
          enable-url-completion: false

  # Sentinel job for branch protection. Required check should target this
  # one job rather than each parallel job individually - that way `docker`
  # being skipped on PRs (event_name != 'push') doesn't break the gate.
  # Succeeds iff every required upstream job either passed or was correctly
  # skipped for the event type.
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest  # GitHub-hosted - self-hosted re-disabled 2026-07-03, reusing GitHub runners for now
    # runs-on: self-hosted  # re-enable to switch back to the self-hosted workers
    needs: [quality, correctness, frontend, docker]
    if: always()
    steps:
      - name: verify required jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          CORRECTNESS: ${{ needs.correctness.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -e
          fail=0
          for kv in "quality=$QUALITY" "correctness=$CORRECTNESS" "frontend=$FRONTEND" "docker=$DOCKER"; do
            name="${kv%%=*}"
            result="${kv#*=}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Required job '$name' did not pass (result: $result)"
              fail=1
            else
              echo "OK: $name -> $result"
            fi
          done
          exit $fail
