# Builds the eveyproject.org documentation site from docs/.
#
# The build is the gate that catches a nav entry pointing at a file that moved,
# a translation that drifted from its English source, and - the reason the
# guard exists at all - a hostname or credential that reached docs/ and would
# have gone public. A docs change that breaks the site fails here, not after it
# is served.
#
# Nothing here publishes. The site lives in Evey-project/evey-project.github.io
# and is published by hand: `make wiki-publish` commits the build into the local
# clone of that repository, and pushing it puts the site live.

name: Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wiki/requirements.txt

      - name: Install
        run: pip install -r wiki/requirements.txt

      # --check turns the assembler's warnings into failures: a missing page, a
      # stale translation, a dangling link, or anything the leak guard matches.
      - name: Assemble (manifest, translations, leak guard)
        run: python3 wiki/assemble.py --check

      # --strict fails on a broken internal link. Between the two steps, a
      # documentation link cannot rot unnoticed.
      - name: Build
        run: mkdocs build --strict -f wiki/mkdocs.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-site
          path: wiki/site
          retention-days: 7
