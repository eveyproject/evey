syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service PushService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse) {
    option (google.api.http) = {
      post: "/api/v1/push/register"
      body: "*"
    };
  }

  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse) {
    option (google.api.http) = {
      delete: "/api/v1/push/unregister"
    };
  }

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.http) = {
      get: "/api/v1/push/devices"
    };
  }

  rpc GetVAPIDKey(GetVAPIDKeyRequest) returns (GetVAPIDKeyResponse) {
    option (google.api.http) = {
      get: "/api/v1/push/vapid-key"
    };
  }

  rpc RegisterWebPush(RegisterWebPushRequest) returns (RegisterWebPushResponse) {
    option (google.api.http) = {
      post: "/api/v1/push/web/register"
      body: "*"
    };
  }

  rpc UnregisterWebPush(UnregisterWebPushRequest) returns (UnregisterWebPushResponse) {
    option (google.api.http) = {
      delete: "/api/v1/push/web/unregister"
    };
  }

  rpc ListWebPushSubscriptions(ListWebPushSubscriptionsRequest) returns (ListWebPushSubscriptionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/push/subscriptions"
    };
  }

  rpc DeleteWebPushSubscription(DeleteWebPushSubscriptionRequest) returns (DeleteWebPushSubscriptionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/push/subscriptions"
    };
  }

  rpc GetPushConsent(GetPushConsentRequest) returns (GetPushConsentResponse) {
    option (google.api.http) = {
      get: "/api/v1/push/consent"
    };
  }

  rpc UpdatePushConsent(UpdatePushConsentRequest) returns (UpdatePushConsentResponse) {
    option (google.api.http) = {
      put: "/api/v1/push/consent"
      body: "*"
    };
  }
}

message RegisterDeviceRequest {
  string token = 1;
  string platform = 2; // "ios", "android", "web"
}

message RegisterDeviceResponse {
  bool ok = 1;
}

message UnregisterDeviceRequest {
  string token = 1;
}

message UnregisterDeviceResponse {
  bool ok = 1;
}

message Device {
  string token = 1;
  string platform = 2;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

// Web Push messages

message GetVAPIDKeyRequest {}

message GetVAPIDKeyResponse {
  string public_key = 1;
}

message WebPushKeys {
  string p256dh = 1;
  string auth = 2;
}

message RegisterWebPushRequest {
  string endpoint = 1;
  WebPushKeys keys = 2;
  bool consent = 3;
}

message RegisterWebPushResponse {
  bool ok = 1;
}

message UnregisterWebPushRequest {
  string endpoint = 1;
}

message UnregisterWebPushResponse {
  bool ok = 1;
}

message ListWebPushSubscriptionsRequest {}

message WebPushSubscription {
  string endpoint = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ListWebPushSubscriptionsResponse {
  repeated WebPushSubscription subscriptions = 1;
}

message DeleteWebPushSubscriptionRequest {
  string endpoint = 1;
}

message DeleteWebPushSubscriptionResponse {
  bool ok = 1;
}

message GetPushConsentRequest {}

message GetPushConsentResponse {
  bool push_consent = 1;
}

message UpdatePushConsentRequest {
  bool consent = 1;
}

message UpdatePushConsentResponse {
  bool ok = 1;
}
