# Publishes eveyproject.org from docs/.
#
# Two triggers, deliberately different:
#
# - Pull requests and non-publishing branches BUILD only. The build is the gate
#   that catches a nav entry pointing at a file that moved, a translation that
#   drifted from its English source, and - the reason the guard exists at all -
#   a hostname or credential that reached docs/ and would have gone public. A
#   docs change that breaks the site fails here, not after it is served.
# - master PUBLISHES. Nothing else does: a beta branch that changes a page must
#   not silently rewrite the public documentation.
#
# The site is NOT this repository's GitHub Pages target. It is pushed to
# Evey-project/evey-project.github.io, which is public and already holds the
# eveyproject.org domain, so the wiki can go live while this repository is still
# private. When this repository opens, point Pages here and drop the deploy job -
# the build job is unchanged either way.

name: Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wiki/requirements.txt

      - name: Install
        run: pip install -r wiki/requirements.txt

      # --check turns the assembler's warnings into failures: a missing page, a
      # stale translation, a dangling link, or anything the leak guard matches.
      - name: Assemble (manifest, translations, leak guard)
        run: python3 wiki/assemble.py --check

      # --strict fails on a broken internal link. Between the two steps, a
      # documentation link cannot rot unnoticed.
      - name: Build
        run: mkdocs build --strict -f wiki/mkdocs.yml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-site
          path: wiki/site
          retention-days: 7

  deploy:
    name: Publish to eveyproject.org
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wiki-site
          path: site

      # CNAME and .nojekyll are recreated on every deploy: the branch is fully
      # replaced by the generated site, so a file that only lives in the target
      # repository would be wiped by the first publish that forgets it.
      - name: Pin the domain
        run: |
          echo 'eveyproject.org' > site/CNAME
          touch site/.nojekyll

      # WIKI_DEPLOY_KEY: a deploy key with write access on
      # Evey-project/evey-project.github.io, and on nothing else. A PAT would
      # carry the whole account. Pages serves that repository's main branch.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.WIKI_DEPLOY_KEY }}
          external_repository: Evey-project/evey-project.github.io
          publish_branch: main
          publish_dir: site
          commit_message: 'docs: publish ${{ github.sha }}'
