name: Nightly - race & deep vuln

# Nightly deep-security gate. The commit-CI runs unit tests with -race
# (cheap, high signal - lots of goroutines) but skips -race on the postgres
# repo tests (300+ serialised tests through a shared container, -race adds
# 2-3× overhead with little signal there). This workflow re-runs the
# postgres tests with -race + a verbose govulncheck pass with call traces.
# A red here is a real race-condition or vuln regression and should block
# the next push until investigated.
#
# ⚠️ VERIFIED NOT RUNNING as of 2026-07-23, for two independent reasons:
#
#  1. Both jobs targeted `self-hosted`, which ci.yml disabled on 2026-07-03
#     ("Self-hosted temporarily disabled - reusing GitHub-hosted runners").
#     Fixed below by moving back to ubuntu-latest, matching ci.yml.
#  2. GitHub only schedules `on: schedule` workflows from the DEFAULT branch.
#     This file lives on beta-0.0.1 and not on master, so the cron above has
#     never fired - `gh api .../workflows/nightly-race.yml` returns 404 and no
#     nightly run appears in the history. **Merging this file to master is what
#     actually turns the schedule on**; changing the runner alone is not enough.
#
# Until (2) is done, the postgres layer has NO -race coverage at all: the
# commit CI deliberately excludes it, and this is the only job that runs it.
# Use `workflow_dispatch` from a branch to exercise it in the meantime.

on:
  schedule:
    # 03:17 UTC daily - staggered off the hour to dodge the cron stampede
    # GitHub Actions sees at HH:00 (queue can be 10-30 min late).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  postgres-race:
    name: Postgres tests with -race
    # Back on GitHub-hosted to match ci.yml: the self-hosted workers this used
    # to target were disabled on 2026-07-03 and nothing has run here since.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto
        run: buf generate

      # 300s without -race was just barely enough; with -race the historical
      # baseline is ~600s, give 900s headroom in case a future test adds load.
      - name: test (postgres - race)
        run: go test ./internal/adapters/driven/postgres/... -count=1 -timeout=900s -race

  vuln-deep:
    name: govulncheck (deep, call traces)
    # Back on GitHub-hosted to match ci.yml: the self-hosted workers this used
    # to target were disabled on 2026-07-03 and nothing has run here since.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto
        run: buf generate

      # Verbose mode dumps the call traces for each vulnerability - heavier
      # than the commit-CI run but the surface for a regression here is the
      # whole transitive dep graph, so it's worth the extra time nightly.
      # Self-healing install + full-path invoke (see ci.yml: actions/cache
      # false-hit on the self-hosted runner left the binary absent → 127).
      - name: govulncheck (verbose)
        run: |
          BIN="$(go env GOPATH)/bin/govulncheck"
          test -x "$BIN" || go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$BIN" -show=traces,version,verbose ./cmd/... ./internal/...
