root = "."
tmp_dir = "tmp"

[build]
  # Build the server (fatal), then the landlock launcher + the LD_PRELOAD
  # seccomp shim (best-effort, never block server start). With both present and
  # Landlock available, sandbox auto-detection resolves to landlock like prod.
  cmd = "go build -o ./tmp/evey ./cmd/evey && (go build -o ./tmp/evey-plugin-launcher ./cmd/evey-plugin-launcher && gcc -shared -fPIC -nostartfiles -o /app/libevey-sandbox.so sandbox/sandbox.c || true)"
  bin = "./tmp/evey"
  full_bin = "./tmp/evey"
  include_ext = ["go", "yaml"]
  exclude_dir = ["tmp", "vendor", "frontend", "gen", "docker", "internal/adapters/driven/postgres/migrations", "plugins", "evey-data", "tests/plugins", "examples/plugins"]
  delay = 500
  kill_delay = 500
  rerun = false

[log]
  main_only = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
