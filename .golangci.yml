version: "2"

run:
  go: "1.25"
  timeout: 5m

linters:
  enable:
    # Core (+ defaults: errcheck, govet, ineffassign, staticcheck, unused)
    - errorlint
    - wastedassign
    - nilerr
    - recvcheck
    # Code quality
    - misspell
    - unconvert
    - revive
    - gocritic
    - modernize
    - intrange
    # HTTP / SQL safety
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # Test quality
    - testifylint
    # nolint hygiene
    - nolintlint

  settings:
    errcheck:
      check-blank: true
      # Non-actionable error returns
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer close — error logged by DB/OS layer already
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (net/http.Response.Body).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        # intentional zero-fallback conversions
        - strconv.Atoi
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.ParseInt
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true  # project style: sparse comments
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
      - path: gen/
        linters:
          - errcheck
          - unused
          - staticcheck
          - revive
          - gocritic
          - modernize
          - intrange
      - path: fakes/
        linters:
          - unused
          - revive
          - errcheck
      - path: internal/adapters/driven/ebml/
        linters:
          - errcheck
      - path: testhelpers/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
