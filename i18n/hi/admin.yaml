  description: "एक केवल-पढ़ने वाला स्कैन हर MKV/WebM फ़ाइल की जाँच करता है: गुम या अनुपयोगी सीक इंडेक्स, विलंबित ऑडियो, अधूरे डाउनलोड, फ़ाइल के बीच की क्षति, गलत लेबल वाले कंटेनर, अतिरिक्त बाइट्स, क्रेडिट से पहले समाप्त होने वाले ऑडियो ट्रैक। मरम्मत इंडेक्स को उसी जगह फिर से बनाती है (और विलंबित ऑडियो भी ठीक कर सकती है) और मूल को पुनर्स्थापना योग्य .mkvgobak बैकअप के रूप में रखती है। पूरी लाइब्रेरी की मरम्मत एक लंबा काम है - यह फ़ाइलें फिर से लिखती है और घंटों ले सकती है।"
  readOnlyNote: "मरम्मत आपके मीडिया फ़ोल्डरों में लिखती है। यदि वे केवल-पठन (docker-compose में :ro) माउंट हैं, तो पहले उन्हें लेखन योग्य माउंट करें और कंटेनर पुनरारंभ करें - स्कैन फिर भी काम करता है।"
