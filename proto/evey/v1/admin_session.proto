syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service AdminSessionService {
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/audit-log"
    };
  }

  rpc ListActiveSessions(ListActiveSessionsRequest) returns (ListActiveSessionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/sessions/active"
    };
  }

  rpc KillSession(KillSessionRequest) returns (KillSessionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/sessions/{session_id}"
    };
  }

  rpc SendSessionCommand(SendSessionCommandRequest) returns (SendSessionCommandResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/sessions/{session_id}/command"
      body: "*"
    };
  }

  // SendCastReceiverCommand reaches a Chromecast that is still beating but has
  // no play session left to address. Keyed by PROFILE because that is all the
  // online-devices panel knows, and what the receiver's own stream token
  // carries. Same vocabulary as SendSessionCommand.
  rpc SendCastReceiverCommand(SendCastReceiverCommandRequest) returns (SendCastReceiverCommandResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/cast-receivers/{profile_id}/command"
      body: "*"
    };
  }
}

message AuditLogEntry {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string action = 4;
  string resource_type = 5;
  string resource_id = 6;
  string details = 7;
  string ip_address = 8;
  google.protobuf.Timestamp created_at = 9;
  string resource_name = 10;
  string user_agent = 11;
  string device_name = 12;
  // Which PROFILE of that account acted. Persisted with the entry (a profile
  // can be renamed or deleted later); profile_name is resolved by JOIN and is
  // empty once the profile is gone.
  string profile_id = 13;
  string profile_name = 14;
}

message ActiveSession {
  string session_id = 1;
  string profile_name = 2;
  string media_title = 3;
  string media_type = 4;
  string media_item_id = 5;
  double progress = 6;
  int64 duration_ms = 7;
  int64 position_ms = 8;
  google.protobuf.Timestamp started_at = 9;
  string device_name = 10;
  string device_type = 11;
  string client_ip = 12;
  string play_method = 13;
  string video_codec = 14;
  string audio_codec = 15;
  string resolution = 16;
  int64 bandwidth_bps = 17;
  string transcode_info = 18;
  string profile_id = 19;
  string series_title = 20;
  int32 season_number = 21;
  int32 episode_number = 22;
  bool is_paused = 23;
  // Per-track serving decision ("copy"|"transcode"). The panel derives the
  // serving engine from these (copy rung -> mkvgo on-demand, transcode -> ffmpeg)
  // and renders per-track badges. video_codec/audio_codec/resolution above carry
  // the served codecs (source->target form when transcoding).
  string video_decision = 24;
  string audio_decision = 25;
  // Non-empty when the client relays playback to a cast device (web sender ->
  // Chromecast): the media actually plays THERE, not on device_name. The
  // panel shows it as the real playback target.
  string cast_device_name = 26;
  // Album cover URL for music sessions (media_type "track"); empty for video,
  // which the panel renders from a trickplay thumbnail instead.
  string cover_art_url = 27;
  // Owning account. profile_name alone ("Papa") does not say whose household
  // it belongs to once two accounts use the same profile names.
  string user_id = 28;
  string username = 29;
  // What the server ACTUALLY serves, recorded when the master playlist is
  // rendered (the decisions above are the client's start-time declaration,
  // audio_decision then follows the wasm beacons). video_engine: "mkvgo"
  // (on-demand copy) | "ffmpeg". video_backend, transcode only: "software" |
  // "qsv" | "vaapi" | "nvenc". audio_engine: "mkvgo" | "ffmpeg" | "client"
  // (ac3go wasm decode on the player). Empty on sessions started before this.
  string video_engine = 30;
  string video_backend = 31;
  string audio_engine = 32;
}

message ListActiveSessionsRequest {}

message ListActiveSessionsResponse {
  repeated ActiveSession sessions = 1;
}

message KillSessionRequest {
  string session_id = 1;
}

message KillSessionResponse {}

message GetAuditLogRequest {
  string user_id = 1;
  string action = 2;
  string resource_type = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  int32 limit = 6;
  int32 offset = 7;
  string profile_id = 8;
}

message GetAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total = 2;
}

message SendSessionCommandRequest {
  string session_id = 1;
  string command = 2; // "pause", "play"
}

message SendSessionCommandResponse {}


message SendCastReceiverCommandRequest {
  string profile_id = 1;
  // "pause" | "play" | "stop" | "message:<text>"
  string command = 2;
}

message SendCastReceiverCommandResponse {}
