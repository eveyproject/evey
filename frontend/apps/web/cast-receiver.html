<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Evey Cast Receiver</title>
    <!-- The CAF v3 Web Receiver SDK: only loadable from gstatic, this page's
         server CSP explicitly allows it. -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0f19;
        overflow: hidden;
      }
      /* Idle splash: the Evey text logo, same accent as the app. */
      cast-media-player {
        --splash-background: #0b0f19;
        --splash-image: none;
        --logo-image: none;
        --theme-hue: 240;
        --progress-color: #7c7ff2;
      }
      #idle-brand {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28vmin;
        height: 28vmin;
        pointer-events: none;
      }
      /* Overlay de debug : les erreurs de lecture s'affichent SUR la TV au
         lieu de mourir en silence comme sur le Default Media Receiver. */
      #dbg {
        display: none;
        position: absolute;
        left: 2vmin;
        bottom: 2vmin;
        max-width: 90vw;
        padding: 1vmin 2vmin;
        background: rgba(0, 0, 0, 0.75);
        color: #ffb454;
        font-family: monospace;
        font-size: 2.5vmin;
        border-radius: 0.8vmin;
        z-index: 10;
      }
      /* Carte « À suivre » : l'épisode suivant s'annonce à la fin, avec le
         compte à rebours de l'auto-avance (voir castNext.ts). */
      #upnext {
        display: none;
        position: absolute;
        right: 4vmin;
        bottom: 8vmin;
        max-width: 60vw;
        padding: 2.2vmin 3vmin;
        background: rgba(11, 15, 25, 0.9);
        border-left: 0.5vmin solid #7c7ff2;
        border-radius: 1vmin;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 11;
      }
      #upnext .heading {
        font-size: 2.1vmin;
        letter-spacing: 0.25vmin;
        text-transform: uppercase;
        color: #a5a8f8;
      }
      #upnext .title {
        margin-top: 0.8vmin;
        font-size: 3.1vmin;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #upnext .count {
        margin-top: 0.8vmin;
        font-size: 2.1vmin;
        color: #9ca3af;
      }
      /* HUD de pause : quoi est en pause, où on en est, ce qui reste. */
      #hud {
        display: none;
        position: absolute;
        left: 4vmin;
        top: 4vmin;
        max-width: 70vw;
        padding: 2.2vmin 3vmin;
        background: rgba(11, 15, 25, 0.85);
        border-radius: 1vmin;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 11;
      }
      #hud .title {
        font-size: 3.4vmin;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #hud .clock {
        margin-top: 0.8vmin;
        font-size: 2.4vmin;
        color: #c3c6ff;
        font-variant-numeric: tabular-nums;
      }
      #hud .remaining {
        margin-top: 0.4vmin;
        font-size: 2.1vmin;
        color: #9ca3af;
      }
      /* Carte de fin : la grâce d'extinction ne laisse plus un écran noir. */
      #endcard {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 80vw;
        text-align: center;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 11;
      }
      #endcard .heading {
        font-size: 2.6vmin;
        letter-spacing: 0.3vmin;
        text-transform: uppercase;
        color: #a5a8f8;
      }
      #endcard .title {
        margin-top: 1.2vmin;
        font-size: 4.2vmin;
        font-weight: 600;
      }
    </style>
  </head>
