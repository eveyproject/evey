# Example: Evey behind Nginx (you supply the certificate and key)
# Usage:
#   docker compose -f docker-compose.yml -f examples/nginx/docker-compose.nginx.yml up -d

services:
  # The base file's bundled Caddy also binds 80 and 443: park it behind a
  # profile that is never enabled, so Nginx can take the ports.
  caddy:
    profiles: ["disabled"]

  nginx:
    container_name: evey-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVEY_DOMAIN: ${EVEY_DOMAIN:-media.example.com}
    volumes:
      - ./examples/nginx/evey.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx-certs:/etc/ssl
    depends_on:
      evey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nginx-certs:
