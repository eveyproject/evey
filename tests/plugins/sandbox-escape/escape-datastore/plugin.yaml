name: escape-datastore
kind: plugin
version: 1.0.0
description: Red-team probe — data-store isolation + HostService permission enforcement. Declares NO permissions on purpose.
author: redteam
language: nodejs
entrypoint: node main.js
# Intentionally declares NO permissions and NO capabilities: it should still be
# able to use its OWN data store (that needs no permission), but every
# permissioned HostService RPC must be denied.
