syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service FeedService {
  rpc GetFeedConfig(GetFeedConfigRequest) returns (GetFeedConfigResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/config"
    };
  }

  rpc ContinueWatching(ContinueWatchingRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/continue-watching"
    };
  }

  rpc RecentlyAdded(RecentlyAddedRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/recently-added"
    };
  }

  rpc Recommended(RecommendedRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/recommended"
    };
  }

  rpc SimilarItems(SimilarItemsRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/similar/{media_item_id}"
    };
  }

  rpc GetAdminFeedConfigs(GetAdminFeedConfigsRequest) returns (GetAdminFeedConfigsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/feeds/config"
    };
  }

  rpc UpdateAdminFeedConfig(UpdateAdminFeedConfigRequest) returns (AdminFeedConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/feeds/config/{feed_type}"
      body: "*"
    };
  }

  rpc UpdateProfileFeedConfig(UpdateProfileFeedConfigRequest) returns (ProfileFeedConfig) {
    option (google.api.http) = {
      put: "/api/v1/feeds/config/{feed_type}"
      body: "*"
    };
  }

  rpc ResetProfileFeedConfig(ResetProfileFeedConfigRequest) returns (ResetProfileFeedConfigResponse) {
    option (google.api.http) = {
      delete: "/api/v1/feeds/config/{feed_type}"
    };
  }

  rpc ResumePlayback(ResumePlaybackRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/resume-playback"
    };
  }

  rpc NextEpisode(NextEpisodeRequest) returns (FeedResponse) {
    option (google.api.http) = {
      get: "/api/v1/feeds/next-episode"
    };
  }

  rpc BatchUpdateAdminFeedConfigs(BatchUpdateAdminFeedConfigsRequest) returns (BatchUpdateAdminFeedConfigsResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/feeds/config"
      body: "*"
    };
  }
}

message FeedItem {
  string media_item_id = 1;
  string parent_id = 2;
  string title = 3;
  string type = 4;
  int64 position_ms = 5;
  string added_at = 6;
  int32 score = 7;
  // Populated for episodes (zero otherwise) so clients can render
  // "S{season}E{episode} - {title}" without another roundtrip.
  int32 season_number = 8;
  int32 episode_number = 9;
  // Primary artwork blurhash placeholder. Empty when the item has no
  // primary artwork or pre-dates the blurhash field. Lets home/library
  // grids render a coloured preview before the poster image loads.
  string primary_blurhash = 10;
}

message MergedFeedConfig {
  string feed_type = 1;
  bool enabled = 2;
  int32 display_order = 3;
  int32 max_items = 4;
}

message AdminFeedConfig {
  string feed_type = 1;
  bool enabled = 2;
  int32 display_order = 3;
  int32 max_items = 4;
}

message ProfileFeedConfig {
  string profile_id = 1;
  string feed_type = 2;
  optional bool enabled = 3;
  optional int32 display_order = 4;
  optional int32 max_items = 5;
}

message GetFeedConfigRequest {
  string profile_id = 1;
}

message GetFeedConfigResponse {
  repeated MergedFeedConfig configs = 1;
}

message ContinueWatchingRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message RecentlyAddedRequest {
  int32 days_window = 1;
  int32 limit = 2;
}

message RecommendedRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message SimilarItemsRequest {
  string media_item_id = 1;
  string profile_id = 2;
  int32 limit = 3;
}

message FeedResponse {
  repeated FeedItem items = 1;
}

message GetAdminFeedConfigsRequest {}

message GetAdminFeedConfigsResponse {
  repeated AdminFeedConfig configs = 1;
}

message UpdateAdminFeedConfigRequest {
  string feed_type = 1;
  bool enabled = 2;
  int32 display_order = 3;
  int32 max_items = 4;
}

message UpdateProfileFeedConfigRequest {
  string profile_id = 1;
  string feed_type = 2;
  optional bool enabled = 3;
  optional int32 display_order = 4;
  optional int32 max_items = 5;
}

message ResetProfileFeedConfigRequest {
  string profile_id = 1;
  string feed_type = 2;
}

message ResetProfileFeedConfigResponse {}

message ResumePlaybackRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message NextEpisodeRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message BatchUpdateAdminFeedConfigsRequest {
  repeated AdminFeedConfig configs = 1;
}

message BatchUpdateAdminFeedConfigsResponse {}
