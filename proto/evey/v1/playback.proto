syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "evey/v1/library.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service PlaybackService {
  rpc GetStreamInfo(GetStreamInfoRequest) returns (StreamInfo) {
    option (google.api.http) = {
      get: "/api/v1/playback/{media_item_id}/stream-info"
    };
  }

  rpc StartStream(StartStreamRequest) returns (PlaySession) {
    option (google.api.http) = {
      post: "/api/v1/playback/start"
      body: "*"
    };
  }

  rpc StopStream(StopStreamRequest) returns (StopStreamResponse) {
    option (google.api.http) = {
      post: "/api/v1/playback/stop"
      body: "*"
    };
  }

  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse) {
    option (google.api.http) = {
      post: "/api/v1/playback/progress"
      body: "*"
    };
  }

  rpc GetWatchProgress(GetWatchProgressRequest) returns (WatchProgress) {
    option (google.api.http) = {
      get: "/api/v1/playback/{media_item_id}/progress"
    };
  }

  rpc GetWatchHistory(GetWatchHistoryRequest) returns (GetWatchHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/playback/history"
    };
  }

  rpc GetResumeItems(GetResumeItemsRequest) returns (GetResumeItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/playback/resume"
    };
  }

  rpc GetNextUp(GetNextUpRequest) returns (GetNextUpResponse) {
    option (google.api.http) = {
      get: "/api/v1/playback/next-up"
    };
  }

  rpc MarkAsWatched(MarkAsWatchedRequest) returns (MarkAsWatchedResponse) {
    option (google.api.http) = {
      post: "/api/v1/playback/{media_item_id}/watched"
    };
  }

  rpc MarkAsUnwatched(MarkAsUnwatchedRequest) returns (MarkAsUnwatchedResponse) {
    option (google.api.http) = {
      post: "/api/v1/playback/{media_item_id}/unwatched"
    };
  }

  // ClearWatchHistory deletes all of the caller's own watch progress.
  rpc ClearWatchHistory(ClearWatchHistoryRequest) returns (ClearWatchHistoryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/playback/history"
    };
  }

  // Burned names - ADR-0004 (§2, "never reuse"). GetPlaybackDifficulties (bulk
  // "playback difficulty" badge for list views) was added in 860da77e8 and
  // deleted in-place nine hours later in f7be73ea6, because the badge it fed
  // was judged misleading and pulled on purpose. Its messages
  // (GetPlaybackDifficultiesRequest/Response, PlaybackDifficulty) are gone with
  // it and are NOT coming back; the names must never be reused for a different
  // shape. Protobuf has no `reserved` for RPC or message names, so this comment
  // is the enforcement.
}

enum PlayMethod {
  PLAY_METHOD_UNSPECIFIED = 0;
  PLAY_METHOD_DIRECT_PLAY = 1;
  PLAY_METHOD_DIRECT_STREAM = 2;
  PLAY_METHOD_TRANSCODE = 3;
}

message StreamInfo {
  string media_item_id = 1;
  string direct_play_url = 2;
  string transcode_url = 3;
  repeated MediaStream media_streams = 4;
  PlayMethod play_method = 5;
  string container = 6;
  int64 bitrate = 7;
  repeated string transcode_reasons = 8;
  string video_decision = 9;
  string audio_decision = 10;
  // Target (served) codecs and resolution the client will actually receive.
  // For a copy decision these equal the source; for a transcode they are the
  // rung output (e.g. h264 / aac). The player echoes them back on StartStream
  // so the admin "Now Playing" panel can show what's really being served.
  string video_codec = 11;
  string audio_codec = 12;
  string resolution = 13;
  // Audio bitrate actually served, in bits per second. A Matroska container
  // rarely carries a per-track bitrate, so the source probe usually has none -
  // but on a transcode we know it exactly: it is what we ask the encoder for.
  // 0 when unknown (audio copied from a source that declares no bitrate).
  int64 audio_bitrate = 14;
}

message WatchProgress {
  string id = 1;
  string profile_id = 2;
  string media_item_id = 3;
  int64 position_ms = 4;
  int64 duration_ms = 5;
  double percent_complete = 6;
  bool played = 7;
  int32 play_count = 8;
  google.protobuf.Timestamp last_played_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Display metadata, populated by GetWatchHistory so clients show a real label
  // instead of the bare media_item_id. Empty when the item can't be resolved.
  string title = 11; // movie title, or episode title for episodes
  string media_type = 12; // "movie" | "episode" | "track" | ...
  int32 index_number = 13; // episode number (episodes only)
  int32 parent_index_number = 14; // season number (episodes only)
  string series_title = 15; // parent series title (episodes only)
}

message PlaySession {
  string id = 1;
  string profile_id = 2;
  string media_item_id = 3;
  PlayMethod play_method = 4;
  string device_id = 5;
  string device_name = 6;
  string client_name = 7;
  int64 position_ms = 8;
  bool is_paused = 9;
  google.protobuf.Timestamp started_at = 10;
}

message GetStreamInfoRequest {
  string media_item_id = 1;
  string device_id = 2;
  int64 max_bitrate = 3;
  int32 max_width = 4;
  int32 max_height = 5;
  repeated string supported_codecs = 6;
  repeated string supported_containers = 7;
  int32 audio_stream_index = 8;
  int32 subtitle_stream_index = 9;
  repeated string supported_audio_codecs = 10;
  // network_type hints the active client connection ("wifi" or "cellular").
  // Empty defaults to wifi. When "cellular", the profile's
  // max_bitrate_cellular_kbps preference (if set) caps the stream.
  string network_type = 11;
  // supports_hdr signals the client display can render HDR (HDR10/HLG) natively.
  // The web player sets it from the (dynamic-range: high) media query. When
  // false (the default), an HDR source is transcoded/tonemapped to SDR; when
  // true, an HDR10/HLG source can direct-play / remux. Dolby Vision always
  // transcodes regardless (a single bool can't distinguish a DoVi-capable
  // panel from an HDR10-only one).
  bool supports_hdr = 12;
  // wasm_audio: the client decodes AC-3/E-AC-3 itself (ac3go), same capability
  // as ?wasmAudio=1 on the master. Needs its own field - such a client must not
  // advertise those codecs in supported_audio_codecs (MSE refuses them muxed).
  bool wasm_audio = 13;
  // fmp4_audio_passthrough: audio codecs the client accepts as a RAW
  // passthrough inside our fMP4 segments, beyond the always-wired
  // AAC/AC-3/E-AC-3. Separate from supported_audio_codecs on purpose:
  // "I decode MP3" and "I accept MP3 muxed in fMP4" are different questions,
  // and the web player declares the first unconditionally while AVPlayer
  // refuses the second. Only "mp3" is honoured today; anything else is
  // ignored server-side. Empty (older clients) keeps the previous behaviour,
  // a server-side re-encode to AAC.
  repeated string fmp4_audio_passthrough = 14;
}

message StartStreamRequest {
  string media_item_id = 1;
  string profile_id = 2;
  PlayMethod play_method = 3;
  string device_id = 4;
  string device_name = 5;
  string client_name = 6;
  int64 start_position_ms = 7;
  int32 audio_stream_index = 8;
  int32 subtitle_stream_index = 9;
  // Bitrate (bits/s) the client will actually pull, copied from the StreamInfo
  // the player just fetched. Stamped onto the session so the admin dashboard
  // shows the served rate, not the source. Absent/0 falls back to the source
  // bitrate server-side (older clients keep the previous behaviour).
  int64 served_bitrate_bps = 10;
  // Per-track serving decision + served codecs/resolution, copied from the
  // StreamInfo the player just resolved. Persisted on the session so the admin
  // panel can distinguish a copy rung (video copied) from a real transcode and
  // show the served codecs. video_decision/audio_decision are "copy"|"transcode";
  // video_codec/audio_codec carry a "source->target" form when transcoding.
  string video_decision = 11;
  string audio_decision = 12;
  string video_codec = 13;
  string audio_codec = 14;
  string resolution = 15;
}

message StopStreamRequest {
  string session_id = 1;
  int64 position_ms = 2;
}

message StopStreamResponse {}

message ReportProgressRequest {
  string session_id = 1;
  int64 position_ms = 2;
  bool is_paused = 3;
  bool is_muted = 4;
  int32 volume_level = 5;
  // Name of the remote device the media is ACTUALLY playing on when the
  // reporting client is only a relay (web sender driving a Chromecast).
  // The position/pause fields above then describe the REMOTE playback.
  // Empty = playing on the session's own device (clears a previous value).
  string cast_device_name = 6;
}

message ReportProgressResponse {
  string remote_command = 1;
}

message GetWatchProgressRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message GetWatchHistoryRequest {
  string profile_id = 1;
  int32 limit = 2;
  PaginationRequest pagination = 3;
}

message GetWatchHistoryResponse {
  repeated WatchProgress items = 1;
  PaginationResponse pagination = 2;
}

message ClearWatchHistoryRequest {
  // Defaults to the caller's active profile; a non-admin cannot target another.
  string profile_id = 1;
}

message ClearWatchHistoryResponse {
  int32 deleted = 1;
}

message GetResumeItemsRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message GetResumeItemsResponse {
  repeated MediaItem items = 1;
  repeated WatchProgress progress = 2;
}

message GetNextUpRequest {
  string profile_id = 1;
  int32 limit = 2;
}

message GetNextUpResponse {
  repeated MediaItem items = 1;
}

message MarkAsWatchedRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message MarkAsWatchedResponse {}

message MarkAsUnwatchedRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message MarkAsUnwatchedResponse {}
