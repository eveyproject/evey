syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravity/evey/gen/evey/v1;eveyv1";

service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections"
    };
  }

  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections/{id}"
    };
  }

  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/collections/{id}"
    };
  }

  rpc GetCollectionItems(GetCollectionItemsRequest) returns (GetCollectionItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections/{id}/items"
    };
  }
}

message CollectionProto {
  string id = 1;
  string name = 2;
  string overview = 3;
  optional int32 tmdb_id = 4;
  string poster_url = 5;
  string backdrop_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionProto collections = 1;
}

message GetCollectionRequest {
  string id = 1;
}

message GetCollectionResponse {
  CollectionProto collection = 1;
}

message DeleteCollectionRequest {
  string id = 1;
}

message DeleteCollectionResponse {}

message GetCollectionItemsRequest {
  string id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetCollectionItemsResponse {
  repeated string media_item_ids = 1;
  int32 total = 2;
  repeated CollectionItemProto items = 3;
}

message CollectionItemProto {
  string id = 1;
  string title = 2;
  string type = 3;
  int32 year = 4;
  string overview = 5;
  double community_rating = 6;
  repeated string genres = 7;
}
