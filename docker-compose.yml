services:

  evey:
    container_name: evey-server
    image: gravityz/evey:${EVEY_VERSION:-latest}
    # No CPU or memory limit by default: the server gets the whole machine, the
    # way Docker behaves out of the box. A hard 4g/4-core cap used to be the
    # default here, which silently throttled Evey on any host bigger than a
    # small NAS - and made the built-in load test measure the cap instead of the
    # hardware. Evey already sizes itself to what it finds (GOMEMLIMIT follows
    # the cgroup limit when there IS one, else host RAM; worker pools follow the
    # CPU quota, else the core count), so capping it is an operator's choice,
    # not a default.
    #
    # Know what that choice costs before making it. GOMEMLIMIT bounds the Go
    # heap ONLY - the ffmpeg children are bounded by nothing at all. On
    # 2026-08-24 a single analysis ffmpeg grew to ~10 GiB on an 11.5 GiB host:
    # the OOM killer fired 23 times, and because the kill is global rather than
    # scoped to a cgroup, the whole machine went down three times (SSH included)
    # while the Go server itself sat at 43 MiB. A memory limit here turns that
    # into a container that dies alone. On a host with little headroom, set it.
    #
    # To cap it, uncomment and set the two variables:
    #
    # deploy:
    #   resources:
    #     limits:
    #       memory: ${EVEY_MEMORY_LIMIT:-4g}
    #       cpus: '${EVEY_CPU_LIMIT:-4}'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    ports:
      - "${EVEY_HTTP_PORT:-9091}:${EVEY_HTTP_PORT:-9091}"
    environment:
      # Postgres as a sibling service (the operator layout, see the comment
      # on the service below). Unset EVEY_DB_HOST and drop that service to
      # run the database embedded in this container instead (data lands in
      # ./evey-data/postgres, password generated on first boot).
      EVEY_DB_HOST: postgres
      # PUID/PGID: the user the server runs as. Leave UNSET (the default) and
      # the entrypoint adopts the owner of your /media* mounts automatically,
      # so write-features (seek-index repair) work out of the box. Set them
      # explicitly to override - e.g. the output of `id -u` / `id -g` on the
      # host. The container starts as root only long enough to apply the
      # mapping, then drops privileges; the server never runs as root. If you
      # refuse even that transient root, use `user: "UID:GID"` below instead
      # (and manage ./evey-data ownership yourself).
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      # Meilisearch runs embedded inside the evey container - the entrypoint
      # spawns it before exec'ing the server. Set EVEY_EMBEDDED_MEILI=false
      # AND point EVEY_MEILI_URL at an external instance to opt out (useful
      # for shared search clusters or running Meili on dedicated hardware).
      # The master key is generated on first boot (./evey-data/keys/meili.key)
      # when MEILI_MASTER_KEY is left empty; set it only to bring your own.
      EVEY_EMBEDDED_MEILI: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      EVEY_JWT_PRIVATE_KEY_PATH: /data/jwt.key
      EVEY_TRANSCODING_CACHE_DIR: /cache/transcode
      EVEY_TRICKPLAY_CACHE_DIR: /data/trickplay
      EVEY_LOG_DIR: /data/logs
      EVEY_BACKUP_DIR: /data/backups
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evey-data:/data          # keys, logs, backups, avatars, meili index
      - ./evey-data/plugins:/data/plugins # plugin files
      - evey-cache:/cache           # transcode + trickplay cache (expendable)
      # Media is mounted read-write so the repair features (seek-index reindex
      # rebuilds files in place) work natively; the server only ever writes
      # media through those operator-triggered repairs. Append `:ro` if you
      # prefer a read-only library and accept that repairs will fail.
      - ${MEDIA_DIR:-/media}:/media
    # No security_opt overrides: the plugin sandbox uses Landlock (sandbox_mode
    # auto/landlock), which self-confines the plugin's filesystem access from
    # *inside* the process and needs no mount/unshare. It therefore runs under
    # Docker's DEFAULT seccomp + AppArmor - the baseline container security
    # stays fully intact (no relaxed profile, no added capability, no
    # privileged mode). On a kernel without Landlock, auto falls back to the
    # best isolation the host allows.
    # Advanced (bare-metal namespace isolation): bubblewrap mode is available but
    # needs the mount syscall, which the default AppArmor blocks inside Docker -
    # enabling it in a container requires a relaxed seccomp profile (a security
    # downgrade). See "Advanced: bubblewrap mode" in docs/plugins.md.
    # Hardware-accelerated transcoding is opt-in via an overlay file so the
    # base stack stays `up`-able on hosts without a GPU:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # See docker-compose.gpu.yml.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${EVEY_HTTP_PORT:-9091}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Must cover a migration boot: the pre-migration pg_dump of a NAS-sized
      # catalogue can take minutes. See the HEALTHCHECK note in the Dockerfile.
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Database ──
  # Kept as a sibling service rather than bundled inside the evey image:
  # Postgres major upgrades (16→17) require a dump+restore step, having
  # them as a separate container makes that lifecycle explicit and lets
  # ops pin/swap to a managed Postgres without rebuilding the app image.
  postgres:
    container_name: evey-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EVEY_DB_NAME:-evey}
      POSTGRES_USER: ${EVEY_DB_USER:-evey}
      POSTGRES_PASSWORD: ${EVEY_DB_PASSWORD:?EVEY_DB_PASSWORD must be set in .env}
    expose:
      - "5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVEY_DB_USER:-evey}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Reverse proxy (optional - use your own if you prefer) ──
  caddy:
    container_name: evey-caddy
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVEY_DOMAIN: ${EVEY_DOMAIN:-localhost}
    volumes:
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      evey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  evey-cache:  # transcode + trickplay cache (safe to prune)
