syntax = "proto3";

package plugin.v1;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravity/evey/gen/plugin/v1;pluginv1";

// Host -> Plugin communication
service PluginService {
  rpc Initialize(InitRequest) returns (InitResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc OnEvent(EventNotification) returns (EventResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// Plugin -> Host communication
service HostService {
  rpc GetMediaItem(GetMediaItemRequest) returns (MediaItem);
  rpc ListMediaItems(ListMediaItemsRequest) returns (ListMediaItemsResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message InitRequest {
  string plugin_id = 1;
  map<string, string> config = 2;
  string host_version = 3;
}

message InitResponse {
  bool success = 1;
  string error = 2;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {}

message EventNotification {
  string event_type = 1;
  google.protobuf.Struct payload = 2;
  google.protobuf.Timestamp timestamp = 3;
  string source = 4;
}

message EventResponse {
  bool handled = 1;
  google.protobuf.Struct result = 2;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
  map<string, string> details = 3;
}

message PluginCapability {
  string name = 1;
  string description = 2;
  repeated string event_types = 3;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated PluginCapability capabilities = 1;
  string api_version = 2;
}

// Host service messages

message MediaItem {
  string id = 1;
  string library_id = 2;
  string parent_id = 3;
  string type = 4;
  string title = 5;
  string overview = 6;
  int32 year = 7;
  map<string, string> provider_ids = 8;
  repeated string genres = 9;
  string file_path = 10;
  google.protobuf.Struct extra_fields = 11;
}

message GetMediaItemRequest {
  string id = 1;
}

message ListMediaItemsRequest {
  string library_id = 1;
  string type = 2;
  string parent_id = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListMediaItemsResponse {
  repeated MediaItem items = 1;
  int32 total = 2;
}

message UpdateMetadataRequest {
  string media_item_id = 1;
  map<string, string> fields = 2;
  map<string, string> provider_ids = 3;
}

message UpdateMetadataResponse {
  bool success = 1;
}

message GetUserPreferencesRequest {
  string user_id = 1;
  string profile_id = 2;
}

message GetUserPreferencesResponse {
  map<string, string> preferences = 1;
}

message EmitEventRequest {
  string event_type = 1;
  google.protobuf.Struct payload = 2;
}

message EmitEventResponse {}

message LogRequest {
  LogLevel level = 1;
  string message = 2;
  map<string, string> fields = 3;
}

message LogResponse {}

message GetConfigRequest {
  string key = 1;
}

message GetConfigResponse {
  string value = 1;
  bool found = 2;
}

message SetConfigRequest {
  string key = 1;
  string value = 2;
}

message SetConfigResponse {}
