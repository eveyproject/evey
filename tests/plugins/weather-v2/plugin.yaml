name: weather-v2
kind: plugin
version: 2.11.0
description: Animated weather widget v2 - dependency-free WebGL scene, responsive, DDD architecture. 2.11.0 - the sun-image fetch now goes through the host Fetch broker (no direct plugin network access). 2.10.0 - disambiguated city picker (region + country, stores coordinates) so homonyms like Brest FR/BY resolve correctly.
author: evey-examples
language: nodejs
entrypoint: node main.js
permissions:
  - network
  - prefs
external_fetch:
  - api.open-meteo.com
  - geocoding-api.open-meteo.com
  - sdo.gsfc.nasa.gov
web_root: dist
frontend:
  - slot: home.section
    src: dist/index.js
  - slot: settings.user.appearance
    src: dist/settings.js
config_schema:
  city:
    type: string
    label: City
    required: true
    default: Paris
    description: City name (resolved via Open-Meteo geocoding)
  units:
    type: select
    label: Temperature units
    default: celsius
    options:
      - value: celsius
        label: Celsius (°C)
      - value: fahrenheit
        label: Fahrenheit (°F)
