syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service RatingService {
  rpc PutThumbRating(PutThumbRatingRequest) returns (PutThumbRatingResponse) {
    option (google.api.http) = {
      put: "/api/v1/media/{media_item_id}/rate"
      body: "*"
    };
  }

  rpc GetMyThumbRating(GetMyThumbRatingRequest) returns (GetMyThumbRatingResponse) {
    option (google.api.http) = {
      get: "/api/v1/media/{media_item_id}/my-rating"
    };
  }

  rpc GetRatingAggregate(GetRatingAggregateRequest) returns (GetRatingAggregateResponse) {
    option (google.api.http) = {
      get: "/api/v1/media/{media_item_id}/rating/aggregate"
    };
  }
}

message PutThumbRatingRequest {
  string media_item_id = 1;
  int32 value = 2;
}

message PutThumbRatingResponse {
  int32 value = 1;
}

message GetMyThumbRatingRequest {
  string media_item_id = 1;
}

message GetMyThumbRatingResponse {
  int32 value = 1;
}

message GetRatingAggregateRequest {
  string media_item_id = 1;
}

message GetRatingAggregateResponse {
  double average = 1;
  int32 count = 2;
}
