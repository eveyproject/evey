  readAmplificationLine: "Attention : le serveur lit {{ratio}} fois plus d'octets sur le disque qu'il n'en sert. Il sature son stockage avec des données qu'il jette - diviser ce rapport par deux doublerait le nombre de spectateurs, sur le même matériel."
  appAmplificationLine: "Dont {{app}}x demandé par le serveur lui-même : au-delà, c'est le noyau qui lit d'avance des données que personne n'a réclamées."
  servedFromCacheLine: "Attention : le disque n'a presque rien lu - tout a été servi depuis la mémoire cache du système. La bibliothèque tient en RAM, ce qui ne sera pas le cas en usage réel : ce nombre de spectateurs est surestimé, parfois d'un facteur plusieurs."
  coldCacheToggle: "Cache froid : mesurer le stockage, pas la RAM"
  coldCacheHint: "Éjecte en continu la bibliothèque du cache du système pendant tout le test. Plus proche de l'usage réel quand la bibliothèque ne tient pas en mémoire - attendez-vous à un nombre de spectateurs plus bas, et plus honnête."
  coldCacheLine: "La bibliothèque a été éjectée du cache du système pendant tout le test : ces chiffres mesurent le stockage, pas la RAM. Ne les comparez jamais à un test à cache chaud."
  coldCacheStillStarvedLine: "Attention : le compteur disque n'a presque rien vu, alors même que le cache était éjecté en continu. Sur ce montage, le noyau ne voit pas les lectures (chemin réseau ou 9p/virtiofs), ou un cache extérieur à ce système (hôte de VM, contrôleur NAS) les absorbe. Ces chiffres mesurent ce chemin de livraison, pas les disques."
  storageOpaqueLine: "La bibliothèque est sur un montage {{fs}}. Le noyau du serveur ne voit pas les lectures derrière lui : le compteur disque reste aveugle et un pool compte comme un seul disque. Les chiffres de stockage décrivent ce chemin de livraison, pas les disques."
  storageOpaqueColdLine: "La bibliothèque est sur un montage {{fs}}. Le cache froid a été appliqué au montage, mais les disques en dessous peuvent continuer à servir depuis leur propre cache, et le noyau du serveur ne voit pas les lectures derrière lui (compteur disque aveugle, un pool compte comme un seul disque). Ces chiffres sont plus froids qu'un test à cache chaud, pas une mesure des disques."
