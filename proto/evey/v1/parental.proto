syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service ParentalService {
  rpc GetParentalSettings(GetParentalSettingsRequest) returns (GetParentalSettingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/profiles/{profile_id}/parental"
    };
  }

  rpc UpdateParentalSettings(UpdateParentalSettingsRequest) returns (UpdateParentalSettingsResponse) {
    option (google.api.http) = {
      put: "/api/v1/profiles/{profile_id}/parental"
      body: "*"
    };
  }

  rpc VerifyPin(VerifyPinRequest) returns (VerifyPinResponse) {
    option (google.api.http) = {
      post: "/api/v1/profiles/{profile_id}/parental/verify-pin"
      body: "*"
    };
  }
}

message GetParentalSettingsRequest {
  string profile_id = 1;
}

message GetParentalSettingsResponse {
  bool enabled = 1;
  optional int32 max_age = 2;
  repeated string blocked_tags = 3;
  bool has_pin = 4;
}

message UpdateParentalSettingsRequest {
  string profile_id = 1;
  optional bool enabled = 2;
  optional int32 max_age = 3;
  bool unset_max_age = 7;
  repeated string blocked_tags = 4;
  optional string current_pin = 5;
  optional string new_pin = 6;
  // Required on the FIRST-TIME PIN set (no existing PIN yet). Protects
  // against a stolen JWT silently locking the legitimate owner out of
  // their profile. Ignored when rotating an existing PIN - `current_pin`
  // covers that path.
  optional string current_password = 8;
}

message UpdateParentalSettingsResponse {}

message VerifyPinRequest {
  string profile_id = 1;
  string pin = 2;
}

message VerifyPinResponse {
  bool valid = 1;
  // Short-lived proof of PIN entry, passed to RefreshToken to authorise a
  // switch out of a kids profile. Present only when valid is true.
  string pin_token = 2;
}
