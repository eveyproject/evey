name: Sign published images

# Signs image tags that are already on Docker Hub, for a release whose run
# published them without signing. Run by hand, from master.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Image tags to sign, separated by spaces (0.1.8 0.1.8-lean 0.1.8-nodejs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Sign published images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write # the signatures copied to the ghcr mirror
      id-token: write # keyless cosign: the workflow's OIDC identity is the signer
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest: a tag that moves later does not carry the signature along.
      - name: Sign each tag's manifest list (keyless)
        env:
          TAGS: ${{ inputs.tags }}
          IMAGE: docker.io/eveyproject/evey
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          ghcr="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/evey"
          signed=0
          for tag in $TAGS; do
            case "$tag" in *[!0-9A-Za-z._-]*) echo "::error::not an image tag: $tag"; exit 1 ;; esac
            digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
            case "$digest" in sha256:*) ;; *) echo "::error::no digest for ${IMAGE}:${tag}"; exit 1 ;; esac
            echo "sign ${IMAGE}@${digest} (${tag})"
            cosign sign --yes "${IMAGE}@${digest}"
            cosign copy --only=sig --force "${IMAGE}@${digest}" "${ghcr}:${tag}" || echo "::warning::signature of ${tag} not copied to the ghcr mirror"
            signed=$((signed + 1))
          done
          [ "$signed" -gt 0 ] || { echo "::error::no tag given"; exit 1; }
