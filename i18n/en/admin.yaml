  coldCacheStillStarvedLine: "Warning: the disk counter still saw almost nothing, despite the cache being evicted throughout. On this mount the kernel cannot see the reads (a network or 9p/virtiofs path), or a cache outside this system (a VM host, a NAS controller) is absorbing them. These figures measure that delivery path, not the disks."
  storageOpaqueLine: "The library sits on a {{fs}} mount. The server's kernel cannot see the reads behind it, so the disk counter stays blind and a pool counts as a single disk: the storage figures describe this delivery path, not the disks."
  storageOpaqueColdLine: "The library sits on a {{fs}} mount. Cold cache was applied to the mount, but the disks underneath may keep serving from their own cache, and the server's kernel cannot see the reads behind it (blind disk counter, a pool counts as a single disk). These figures are colder than a warm run, not a measure of the disks."
