version: "2"

run:
  go: "1.27"
  timeout: 5m

linters:
  enable:
    # Core (+ defaults: errcheck, govet, ineffassign, staticcheck, unused)
    - errorlint
    - wastedassign
    - nilerr
    - recvcheck
    # Code quality
    - misspell
    - unconvert
    - revive
    - gocritic
    - modernize
    - intrange
    # HTTP / SQL safety
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # Test quality
    - testifylint
    # nolint hygiene
    - nolintlint
    # TxUnit enforcement: repos must honor an ambient transaction
    - forbidigo
    # Sub-wiring guard: HTTP handler structs are pure dependency-injection (every
    # field is a service/checker set by the constructor). A keyed literal that
    # forgets a field compiles fine but leaves a nil dependency that nil-panics or
    # fails-open at request time (favorites/scheduler slipped this way). exhaustruct
    # is scoped (settings.exhaustruct.include) to ONLY these handler types, so a
    # forgotten field is a build-time lint error instead of a runtime surprise.
    - exhaustruct

  settings:
    # golangci-lint 2.13 shipped two NEW modernize analyzers that fire across
    # pre-existing code (25 sites): `stringscut` (strings.SplitN(s,sep,2)[0] ->
    # strings.Cut) and `errorsastype` (errors.As -> the Go 1.27 generic
    # errors.AsType). Both are genuine improvements and both are mechanical -
    # but a 114-file sweep does not belong in a dependency bump, and the
    # linter's own --fix produced INVALID code on cmd/evey/gateway.go
    # (it flattened a promoted field into a composite literal, which Go
    # forbids). Disabled here so the ratchet stays honest about NEW code;
    # the sweep is a backlog item to do deliberately, with tests.
    modernize:
      disable:
        - stringscut
        - errorsastype
        # embedlit's autofix is BROKEN on this tree: on cmd/evey/gateway.go it
        # rewrote `JSONPb{MarshalOptions: protojson.MarshalOptions{...}}` into
        # `JSONPb{EmitUnpopulated: true}`, dropping the FIELD NAME as well as
        # the type - a promoted field in a composite literal, which Go rejects.
        # The legal elision keeps the name (`MarshalOptions: {...}`).
        - embedlit
    misspell:
      # Les commentaires de ce dépôt sont en FRANÇAIS, et misspell est un
      # correcteur anglais : il lit des mots français comme des fautes anglaises
      # ("démarrage" -> marriage, "présence" -> sense). Reformuler à chaque fois
      # abîme la prose sans rien corriger, donc on exclut les jetons concernés.
      # Ajouter ici le jeton EXACT rapporté par le linter, pas le mot entier.
      ignore-rules:
        - marrage # démarrage, redémarrage
        - abandonne
        - normalis # normalisés, normalisation
        - journalis # journalisée, journalisation
        - sence # présence
        - portait
        - documentaire # le genre TMDB en français, lu comme une faute de "documentaries"
    exhaustruct:
      # Scope to the HTTP handler dependency structs ONLY - enabling exhaustruct
      # globally would flag every legitimate partial literal in the codebase.
      include:
        - 'github.com/evey-project/evey/internal/adapters/driving/http\..*Handler$'
    forbidigo:
      forbid:
        # A postgres repo calling its *sql.DB handle directly (r.db.ExecContext,
        # …) bypasses any ambient transaction set by TxUnit.Do - so a caller
        # wrapping several writes in uow.Do silently loses atomicity. Route every
        # statement through txFromCtx(ctx, r.db), which uses the ambient tx when
        # present and falls back to the raw handle otherwise. (Own-tx repos keep
        # using r.db.BeginTx + tx.ExecContext, which this does not match.)
        - pattern: '\.db\.(ExecContext|QueryContext|QueryRowContext)\('
          msg: "use txFromCtx(ctx, <recv>.db).XContext so the repo honors an ambient TxUnit transaction"
    errcheck:
      check-blank: true
      # Non-actionable error returns
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer close - error logged by DB/OS layer already
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Conn).Close
        - (*github.com/evey-project/evey/internal/adapters/driven/pluginrunner.pluginLogWriter).Close
        # startup best-effort initialization
        - (*github.com/evey-project/evey/internal/app/feed.CommandService).EnsureLibraryFeedConfig
        - (net/http.Response.Body).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (database/sql.Result).RowsAffected
        # intentional zero-fallback conversions
        - strconv.Atoi
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.ParseInt
        # process cleanup - error expected after cancel/kill
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        # cleanup / best-effort FS ops
        - os.RemoveAll
        - os.ReadDir
        # scan helpers - zero-value fallback on parse failure
        - fmt.Sscan
        # body drain to io.Discard
        - io.Copy
        # slog handler - multi-handler best-effort
        - (log/slog.Handler).Handle
        # websocket best-effort operations
        - (*golang.org/x/net/websocket.Conn).Close
        - (*golang.org/x/net/websocket.Conn).SetWriteDeadline
        - (golang.org/x/net/websocket.Codec).Send
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true  # project style: sparse comments
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
          - forbidigo
          # Tests construct handlers with partial/positional fields on purpose
          # (exercising one code path); the sub-wiring guard is for production
          # constructors only.
          - exhaustruct
      - path: gen/
        linters:
          - errcheck
          - unused
          - staticcheck
          - revive
          - gocritic
          - modernize
          - intrange
      - path: fakes/
        linters:
          - unused
          - revive
          - errcheck
      - path: internal/adapters/driven/ebml/
        linters:
          - errcheck
      - path: testhelpers/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
