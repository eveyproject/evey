name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"

      - name: generate proto
        run: buf generate

      - name: vet
        run: go vet $(go list ./... | grep -v /gen/)

      - name: build
        run: go build ./...

      - name: test (unit)
        run: |
          go test \
            $(go list ./... | grep -v "adapters/driven/postgres" | grep -v /gen/) \
            -count=1 -timeout=120s -race

      - name: test (postgres — testcontainers)
        run: go test ./internal/adapters/driven/postgres/... -count=1 -timeout=300s -race

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: enable corepack
        run: corepack enable

      - name: install pnpm
        run: corepack prepare pnpm@10.6.5 --activate

      - name: install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: build
        working-directory: frontend
        run: pnpm run build
