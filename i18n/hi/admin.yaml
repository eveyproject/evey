  storageOpaqueColdLine: "लाइब्रेरी {{fs}} माउंट पर है। कोल्ड कैश माउंट पर लागू किया गया, लेकिन नीचे की डिस्क अपने कैश से सर्व करती रह सकती हैं, और सर्वर का कर्नेल इसके पीछे की रीड नहीं देख पाता (अंधा डिस्क काउंटर, एक पूल एक ही डिस्क के रूप में गिना जाता है)। ये आंकड़े गर्म रन से ठंडे हैं, डिस्क का मापन नहीं।"
