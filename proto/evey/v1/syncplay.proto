syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service SyncPlayService {
  rpc CreateRoom(CreateSyncPlayRoomRequest) returns (CreateSyncPlayRoomResponse) {
    option (google.api.http) = {
      post: "/api/v1/syncplay/rooms"
      body: "*"
    };
  }

  rpc JoinByCode(JoinSyncPlayByCodeRequest) returns (JoinSyncPlayByCodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/syncplay/join"
      body: "*"
    };
  }

  rpc GetRoom(GetSyncPlayRoomRequest) returns (GetSyncPlayRoomResponse) {
    option (google.api.http) = {
      get: "/api/v1/syncplay/rooms/{room_id}"
    };
  }

  rpc JoinRoom(JoinSyncPlayRoomRequest) returns (JoinSyncPlayRoomResponse) {
    option (google.api.http) = {
      post: "/api/v1/syncplay/rooms/{room_id}/join"
      body: "*"
    };
  }

  rpc LeaveRoom(LeaveSyncPlayRoomRequest) returns (LeaveSyncPlayRoomResponse) {
    option (google.api.http) = {
      delete: "/api/v1/syncplay/rooms/{room_id}/leave"
    };
  }
}

message SyncPlayMember {
  string user_id = 1;
  string username = 2;
}

message SyncPlayState {
  bool playing = 1;
  int64 position_ms = 2;
}

message CreateSyncPlayRoomRequest {
  string media_id = 1;
  string name = 2;
  string media_type = 3; // "video" (default) or "music"
  string playlist_id = 4; // optional: bind room to a music playlist (implies media_type=music)
  // optional: an explicit ordered queue of track IDs (implies media_type=music).
  // Lets the client build a room from a mix of albums, individual tracks and
  // playlists. When set, the first id becomes the current track and the rest
  // form the queue; media_id/playlist_id are ignored.
  repeated string queue = 5;
}

message CreateSyncPlayRoomResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string media_id = 4;
  string host_id = 5;
  string media_type = 6;
}

message JoinSyncPlayByCodeRequest {
  string code = 1;
}

message JoinSyncPlayByCodeResponse {
  string room_id = 1;
  string media_id = 2;
  string ws_url = 3;
  string media_type = 4;
}

message GetSyncPlayRoomRequest {
  string room_id = 1;
}

message GetSyncPlayRoomResponse {
  string id = 1;
  string name = 2;
  string media_id = 3;
  string host_id = 4;
  repeated SyncPlayMember members = 5;
  SyncPlayState state = 6;
  string code = 7;
  string media_type = 8;
  repeated string queue = 9;
  int32 track_index = 10;
  string playlist_id = 11;
}

message JoinSyncPlayRoomRequest {
  string room_id = 1;
}

message JoinSyncPlayRoomResponse {
  string room_id = 1;
  string ws_url = 2;
}

message LeaveSyncPlayRoomRequest {
  string room_id = 1;
}

message LeaveSyncPlayRoomResponse {}
