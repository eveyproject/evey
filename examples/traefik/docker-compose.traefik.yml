# Example: Evey behind Traefik
# Merge with the main docker-compose.yml:
#   docker compose -f docker-compose.yml -f examples/traefik/docker-compose.traefik.yml up -d

services:
  # Traefik owns 80 and 443 here: park the base file's bundled Caddy behind a
  # profile that is never enabled.
  caddy:
    profiles: ["disabled"]

  evey:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evey.rule=Host(`${EVEY_DOMAIN:-media.example.com}`)"
      - "traefik.http.routers.evey.entrypoints=websecure"
      - "traefik.http.routers.evey.tls.certresolver=letsencrypt"
      - "traefik.http.services.evey.loadbalancer.server.port=9091"
    networks:
      - proxy

networks:
  proxy:
    external: true
