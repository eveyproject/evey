    title: "सर्वर खुद को कैलिब्रेट कर रहा है"
    body: "सर्वर माप रहा है कि यह मशीन क्या चला सकती है, इसमें लगभग 2 मिनट लगते हैं और यह तभी होता है जब और कुछ नहीं चल रहा हो। कुछ मिनट बाद फिर से कोशिश करें।"
