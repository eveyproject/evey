  bgTaskHelp:
    complexity_classifier: "हर वीडियो के कुछ फ़्रेम जाँचकर मापता है कि उसमें कितनी गति है। सामग्री के अनुसार ट्रांसकोडिंग बिटरेट चुनने में उपयोग होता है। लाइब्रेरी पर लगातार चलता है।"
    intro_detection: "एपिसोड के इंट्रो और अंत के क्रेडिट ढूँढता है (पूरे सीज़न में साझा ध्वनि, फ़ाइल के चैप्टर)। \"इंट्रो छोड़ें\" बटन को डेटा देता है। लगातार चलता है और प्लेबैक के दौरान रुक जाता है।"
    keyframe_backfill: "हर फ़ाइल का सीक इंडेक्स (कीफ़्रेम की स्थिति) पढ़ता है और जाँचता है कि फ़्रेम दर स्थिर है। वीडियो को बिना ट्रांसकोडिंग के भेजने देता है। वीडियो जानकारी अद्यतन के बाद लगातार चलता है।"
    level_backfill: "लाइब्रेरी में पहले से मौजूद फ़ाइलों की तकनीकी जानकारी दोबारा पढ़ता है (H.264/HEVC प्रोफ़ाइल, HDR, Dolby Vision, पुराने रिप्स का इंटरलेसिंग)। वीडियो को बिना ट्रांसकोडिंग के भेजने देता है और गलत रंगों से बचाता है। लगातार चलता है और प्लेबैक के दौरान रुक जाता है।"
    trickplay_generation: "सीक बार खींचते समय दिखने वाले थंबनेल बनाता है (हर 7 सेकंड में एक फ़्रेम)। मीडिया जोड़ने पर चलता है, और स्टार्टअप पर उन आइटम के लिए जिनके थंबनेल अभी नहीं हैं।"
    library_scan: "लाइब्रेरी फ़ोल्डरों को खंगालता है और नई या बदली फ़ाइलों का विश्लेषण करता है ताकि वे दिखें। स्टार्टअप पर, समय-समय पर और फ़ाइल बदलते ही चलता है।"
    collection_relink: "मेटाडेटा स्रोत से पूछता है कि हर फ़िल्म किस संग्रह की है और उसे जोड़ता है। केवल तब चलता है जब कोई एडमिन इसे शुरू करे।"
    compat_download: "ऐसे फ़ोन के लिए प्रति तैयार करता है जो मूल ऑडियो ट्रैक नहीं चला सकता: चित्र जस का तस कॉपी होता है, ध्वनि स्टीरियो में बदली जाती है। केवल तब चलता है जब कोई उपयोगकर्ता डाउनलोड शुरू करे।"
    reduced_download: "जब मूल फ़ाइल डिवाइस के लिए बहुत बड़ी हो, तब 720p की हल्की प्रति तैयार करता है। केवल तब चलता है जब कोई उपयोगकर्ता डाउनलोड शुरू करे।"
