// `~/.gradle/gradle.properties`, never committed). See android/app/SIGNING.md.
def releaseStoreFileName = System.getenv("EVEY_UPLOAD_STORE_FILE") ?: findProperty('EVEY_UPLOAD_STORE_FILE') ?: 'release.keystore'
def releaseKeyAlias = System.getenv("EVEY_UPLOAD_KEY_ALIAS") ?: findProperty('EVEY_UPLOAD_KEY_ALIAS') ?: 'evey'
def releaseStorePassword = System.getenv("EVEY_UPLOAD_STORE_PASSWORD") ?: findProperty('EVEY_UPLOAD_STORE_PASSWORD')
def releaseKeyPassword = System.getenv("EVEY_UPLOAD_KEY_PASSWORD") ?: findProperty('EVEY_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePassword && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.evey.app'
    defaultConfig {
        applicationId 'com.evey.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 92
        versionName "0.0.1-beta.83"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Credentials come from env vars or `~/.gradle/gradle.properties` (never committed).
            // See android/app/SIGNING.md. No hardcoded fallback: a release build without
            // real credentials must fail loudly rather than sign with a public secret.
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFileName)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            // -optimize: the plain file carries -dontoptimize (shrink + rename only).
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// Fail fast (not silently with debug/public signing) when a release task is requested
// but no real signing credentials were provided.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task -> task.path.startsWith(':app:') && task.name =~ /(?i)release/ }
    if (buildingRelease && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing credentials are missing. Set EVEY_UPLOAD_STORE_PASSWORD and " +
            "EVEY_UPLOAD_KEY_PASSWORD (plus optionally EVEY_UPLOAD_STORE_FILE / EVEY_UPLOAD_KEY_ALIAS) " +
            "as environment variables or in ~/.gradle/gradle.properties. See android/app/SIGNING.md."
        )
    }
}

