syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service PlaylistService {
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists"
    };
  }

  rpc GetPlaylist(GetPlaylistRequest) returns (PlaylistProto) {
    option (google.api.http) = {
      get: "/api/v1/playlists/{id}"
    };
  }

  rpc CreatePlaylist(CreatePlaylistRequest) returns (PlaylistProto) {
    option (google.api.http) = {
      post: "/api/v1/playlists"
      body: "*"
    };
  }

  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (PlaylistProto) {
    option (google.api.http) = {
      patch: "/api/v1/playlists/{id}"
      body: "*"
    };
  }

  rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse) {
    option (google.api.http) = {
      delete: "/api/v1/playlists/{id}"
    };
  }

  rpc GetPlaylistItems(GetPlaylistItemsRequest) returns (GetPlaylistItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/{id}/items"
    };
  }

  rpc AddPlaylistItem(AddPlaylistItemRequest) returns (AddPlaylistItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists/{id}/items"
      body: "*"
    };
  }

  rpc RemovePlaylistItem(RemovePlaylistItemRequest) returns (RemovePlaylistItemResponse) {
    option (google.api.http) = {
      delete: "/api/v1/playlists/{id}/items/{media_item_id}"
    };
  }
}

enum PlaylistType {
  PLAYLIST_TYPE_UNSPECIFIED = 0;
  PLAYLIST_TYPE_MANUAL = 1;
  PLAYLIST_TYPE_SMART = 2;
}

message PlaylistRule {
  string field = 1;
  string operator = 2;
  string value = 3;
}

message PlaylistProto {
  string id = 1;
  string name = 2;
  string description = 3;
  string user_id = 4;
  PlaylistType type = 5;
  repeated PlaylistRule rules = 6;
  string sort_by = 7;
  string sort_order = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message PlaylistItemProto {
  string playlist_id = 1;
  string media_item_id = 2;
  int32 sort_order = 3;
  google.protobuf.Timestamp added_at = 4;
  string title = 5;
  string type = 6;
  int32 year = 7;
  string media_type = 8;
}

message ListPlaylistsRequest {
  // Deprecated: playlists are user-scoped; the handler uses claims.UserID and
  // ignores this field. Retained for wire compatibility; remove in a future
  // proto release per ADR-0004.
  string profile_id = 1 [deprecated = true];
}

message ListPlaylistsResponse {
  repeated PlaylistProto playlists = 1;
}

message GetPlaylistRequest {
  string id = 1;
  string profile_id = 2 [deprecated = true];
}

message CreatePlaylistRequest {
  string name = 1;
  string description = 2;
  PlaylistType type = 3;
  repeated PlaylistRule rules = 4;
  string sort_by = 5;
  string sort_order = 6;
  string profile_id = 7 [deprecated = true];
}

message UpdatePlaylistRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated PlaylistRule rules = 4;
  string sort_by = 5;
  string sort_order = 6;
  string profile_id = 7 [deprecated = true];
}

message DeletePlaylistRequest {
  string id = 1;
  string profile_id = 2 [deprecated = true];
}

message DeletePlaylistResponse {}

message GetPlaylistItemsRequest {
  string id = 1;
  string profile_id = 2 [deprecated = true];
}

message GetPlaylistItemsResponse {
  repeated PlaylistItemProto items = 1;
}

message AddPlaylistItemRequest {
  string id = 1;
  string media_item_id = 2;
  string profile_id = 3 [deprecated = true];
  string media_type = 4;
}

message AddPlaylistItemResponse {}

message RemovePlaylistItemRequest {
  string id = 1;
  string media_item_id = 2;
  string profile_id = 3 [deprecated = true];
}

message RemovePlaylistItemResponse {}
