# wiki.eveyproject.org - the public documentation site.
#
# The `nav` below is the ONLY manifest of what gets published. `assemble.py`
# reads it, resolves every entry against `wiki/content/` then `docs/`, and
# copies just those files into `wiki/build/` (the real docs_dir). A page that
# is not in this nav is never copied, so an internal note dropped into `docs/`
# cannot leak onto the public site by accident - the failure mode is a missing
# page, never an extra one.
#
# Build:  python3 wiki/assemble.py && mkdocs build -f wiki/mkdocs.yml
# Serve:  python3 wiki/assemble.py && mkdocs serve -f wiki/mkdocs.yml
# Check:  python3 wiki/assemble.py --check   (CI gate: missing pages, stale
#         translations, and the leak guard)

site_name: Evey
site_description: Self-hosted media server - documentation
site_url: https://wiki.eveyproject.org/
repo_url: https://github.com/Evey-project/evey
repo_name: Evey-project/evey
edit_uri: edit/master/docs/
copyright: AGPL-3.0-or-later

docs_dir: build

theme:
  name: material
  language: en
  custom_dir: overrides
  # The full wordmark, not the V alone: the V stays the favicon.
  logo: assets/brand/wordmark.svg
  favicon: assets/brand/favicon.svg
  features:
    # Top-level sections become tabs across the header, one per kind of
    # question: getting a server running, administering it, understanding
    # playback, operating it, extending it, and how it is built.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    # Previous / next links at the foot of every page. The install path is
    # sequential - compose file, first launch, variations - and a reader who
    # finishes a page should not have to go hunting in the sidebar for what
    # follows.
    - navigation.footer
    - content.code.copy
    # Numbered bubbles in a code block that open the explanation of one line,
    # so the compose file stays short and every line can still be explained.
    - content.code.annotate
    # A tab picked once (docker-compose.yml / .env) stays picked on the page.
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # The brand red, in the exact pair validated for AA contrast on 2026-09-08
    # (see frontend/packages/theme/src/themeVars.ts). Raw #DC2626 fails 4.5:1
    # on the dark surfaces, which is why light and dark carry different reds.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

plugins:
  # Click a screenshot to open it full size, then pinch or scroll to zoom.
  - glightbox:
      zoomable: true
      draggable: true
      skip_classes:
        - no-zoom
  - search:
      # Without this the six languages share one index and a French search
      # surfaces German and Chinese pages. mkdocs-static-i18n rebuilds one
      # index per locale from this config when reconfigure_search is on.
      lang: en
  # Translations live beside their English source as `<page>.<lang>.md`, written
  # there by assemble.py from wiki/translations/<lang>/. A page with no
  # translation falls back to English rather than 404ing, which is what makes a
  # partially translated site usable at all.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        # A translation is published only once it is reviewed (`reviewed: true`,
        # see wiki/README.md). A language is built once its first reviewed page
        # lands, with its nav titles; until then only the review preview
        # (make wiki-drafts) shows its drafts.
        - locale: fr
          name: Français
          # Its reviewed pages are published; the others fall back to English.
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Premiers pas
            Install: Installation
            First setup: Première configuration
            Apps and devices: Applications et appareils
            Administration: Administration
            Libraries and metadata: Bibliothèques et métadonnées
            Users, profiles and parental control: Utilisateurs, profils et contrôle parental
            Remote access and HTTPS: Accès distant et HTTPS
            Reverse proxy configurations: Configurations de reverse proxy
            Hardware acceleration: Accélération matérielle
            Single sign-on (OIDC): Authentification unique (OIDC)
            E-mail and notifications: E-mail et notifications
            Backups and updates: Sauvegardes et mises à jour
            Playback: Lecture
            How playback is decided: Comment Evey choisit le mode de lecture
            Transcoding and server capacity: Transcodage et capacité du serveur
            HDR and Dolby Vision: HDR et Dolby Vision
            Audio: Audio
            Subtitles: Sous-titres
            Casting: Diffusion (Chromecast)
            Operations: Exploitation
            Troubleshooting: Dépannage
            Monitoring and logs: Supervision et logs
            Background work and server load: Tâches de fond et charge du serveur
            Media health: Santé des médias
            Command line: Ligne de commande
            Recovery: Restauration
            Database migrations: Migrations de la base
            Incident runbook: Procédures d'incident
            Advanced deployments: Déploiements avancés
            Without a container: Sans conteneur
            Plugin sandbox setup: Mise en place de la sandbox des plugins
            Configuration reference: Référence de configuration
            Environment variables: Variables d'environnement
            Server and network: Serveur et réseau
            Database and search: Base de données et recherche
            Accounts and sign-in: Comptes et connexion
            Transcoding and hardware: Transcodage et matériel
            Playback delivery and downloads: Diffusion de la lecture et téléchargements
            Background work: Tâches de fond
            Plugins and sandbox: Plugins et sandbox
            Backups, logs and monitoring: Sauvegardes, logs et supervision
            Plugins & API: Plugins et API
            Plugins: Plugins
            Writing a plugin: Écrire un plugin
            Plugin API reference: Référence de l'API des plugins
            Permissions and slots: Permissions et slots
            Themes: Thèmes
            Webhooks and API keys: Webhooks et clés d'API
            Server API: API du serveur
            Public API: API publique
            Admin API: API d'administration
            Plugin API: API des plugins
            Internals: Fonctionnement interne
            Design principles: Principes de conception
            Architecture: Architecture
            Playback pipeline: Chaîne de lecture
            Security model and plugin sandbox: Modèle de sécurité et sandbox des plugins
            Languages and accessibility: Langues et accessibilité
            Contributing: Contribuer
        - locale: de
          name: Deutsch
          build: false
        - locale: es
          name: Español
          build: false
        - locale: hi
          name: हिन्दी
          build: false
        - locale: zh
          name: 中文
          build: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # The default slugifier strips non-ASCII, so every Chinese and Hindi
      # heading collapses to an empty or numbered anchor: unusable permalinks,
      # a table of contents that cannot be linked into, and cross-page anchors
      # that land on the wrong section. The unicode slugifier keeps the
      # characters. ASCII headings slug exactly as before, so English, French,
      # German and Spanish anchors do not move.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # A link to a heading that does not exist is only an INFO by default, so
  # --strict waves it through. It is exactly the breakage translation produces:
  # translate a heading and every anchor pointing at it dies silently.
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Evey-project

# ── The manifest ──────────────────────────────────────────────────────────────
# Paths resolve against wiki/content/ first, then docs/. One tab per kind of
# question. Each topic has one canonical page; the others link to it rather
# than explaining it again (wiki/README.md, "One page per topic").
nav:
  - Home: index.md
  - Getting started:
      - Install: installation.md
      - First setup: getting-started/first-setup.md
      - Apps and devices: getting-started/apps.md
  - Administration:
      - Libraries and metadata: administration/libraries.md
      - Users, profiles and parental control: administration/users.md
      - Remote access and HTTPS:
          - administration/remote-access.md
          - Reverse proxy configurations: reverse-proxy.md
      - Hardware acceleration: administration/hardware-acceleration.md
      - Single sign-on (OIDC): oidc.md
      - E-mail and notifications: notifications.md
      - Backups and updates: backups.md
  - Playback:
      - How playback is decided: playback/how-playback-is-decided.md
      - Transcoding and server capacity: playback/transcoding.md
      - HDR and Dolby Vision: playback/hdr.md
      - Audio: playback/audio.md
      - Subtitles: playback/subtitles.md
      - Casting: playback/casting.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
      - Monitoring and logs: operations/monitoring.md
      - Background work and server load: operations/background-work.md
      - Media health: runbooks/media-health.md
      - Command line: runbooks/cli.md
      - Recovery: runbooks/recovery.md
      - Database migrations: runbooks/migration-runbook.md
      - Incident runbook: runbooks/incident-runbook.md
      - Advanced deployments:
          - operations/advanced-deployments.md
          - Without a container: deployment-bare-metal.md
          - Plugin sandbox setup: plugins/sandbox-deployment.md
      - Environment variables:
          - configuration.md
          - Server and network: environment/server.md
          - Database and search: environment/database-search.md
          - Accounts and sign-in: environment/accounts.md
          - Libraries and metadata: environment/libraries.md
          - Transcoding and hardware: environment/transcoding.md
          - Playback delivery and downloads: environment/playback-delivery.md
          - Background work: environment/background.md
          - Plugins and sandbox: environment/plugins.md
          - E-mail and notifications: environment/notifications.md
          - Backups, logs and monitoring: environment/logs-monitoring.md
  - Plugins & API:
      - Plugins: plugins.md
      - Writing a plugin: plugins/dev-setup.md
      - Plugin API reference: plugins/api-reference.md
      - Permissions and slots: plugins/security-model.md
      - Themes: themes.md
      - Webhooks and API keys: webhooks-api-keys.md
      - Server API:
          - api/README.md
          - Public API: api/public/README.md
          - Admin API: api/admin/README.md
          - Plugin API: api/plugins/README.md
  - Internals:
      - Design principles: design-principles.md
      - Architecture: ARCHITECTURE.md
      - Playback pipeline: playback-serving.md
      - Security model and plugin sandbox: SECURITY.md
      - Languages and accessibility: i18n-accessibility.md
      - Contributing: contributing.md
