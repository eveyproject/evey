# wiki.eveyproject.org - the public documentation site.
#
# The `nav` below is the ONLY manifest of what gets published. `assemble.py`
# reads it, resolves every entry against `wiki/content/` then `docs/`, and
# copies just those files into `wiki/build/` (the real docs_dir). A page that
# is not in this nav is never copied, so an internal note dropped into `docs/`
# cannot leak onto the public site by accident - the failure mode is a missing
# page, never an extra one.
#
# Build:  python3 wiki/assemble.py && mkdocs build -f wiki/mkdocs.yml
# Serve:  python3 wiki/assemble.py && mkdocs serve -f wiki/mkdocs.yml
# Check:  python3 wiki/assemble.py --check   (CI gate: missing pages, stale
#         translations, and the leak guard)

site_name: Evey
site_description: Self-hosted media server - documentation
site_url: https://wiki.eveyproject.org/
repo_url: https://github.com/Evey-project/evey
repo_name: Evey-project/evey
edit_uri: edit/master/docs/
copyright: AGPL-3.0-or-later

docs_dir: build

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/brand/favicon.svg
  favicon: assets/brand/favicon.svg
  features:
    # Top-level sections become tabs across the header instead of one long
    # sidebar. With nine sections and sixty pages, the sidebar forced a reader
    # to scroll past Operations to discover Contributing; tabs show the whole
    # map at a glance and the sidebar then only carries the current section.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    # Previous / next links at the foot of every page. The install path is
    # sequential - compose file, first launch, variations - and a reader who
    # finishes a page should not have to go hunting in the sidebar for what
    # follows.
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # The brand red, in the exact pair validated for AA contrast on 2026-09-08
    # (see frontend/packages/theme/src/themeVars.ts). Raw #DC2626 fails 4.5:1
    # on the dark surfaces, which is why light and dark carry different reds.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

plugins:
  - search:
      # Without this the six languages share one index and a French search
      # surfaces German and Chinese pages. mkdocs-static-i18n rebuilds one
      # index per locale from this config when reconfigure_search is on.
      lang: en
  # Translations live beside their English source as `<page>.<lang>.md`, written
  # there by assemble.py from wiki/translations/<lang>/. A page with no
  # translation falls back to English rather than 404ing, which is what makes a
  # partially translated site usable at all.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
