name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate proto
        run: buf generate

      - name: check proto breaking changes
        if: github.event_name == 'pull_request'
        # Diff current HEAD against the PR's base branch tip (not HEAD~1, which
        # silently passes on multi-commit PRs since it only looks at the last
        # commit). github.base_ref is the target branch name for pull_request.
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"

      - name: vet
        run: go vet $(go list ./... | grep -v /gen/)

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./cmd/... ./internal/...

      - name: build
        run: go build ./...

      - name: test (unit)
        run: |
          go test \
            $(go list ./... | grep -v "adapters/driven/postgres" | grep -v /gen/) \
            -count=1 -timeout=120s -race

      - name: test (postgres — testcontainers)
        run: go test ./internal/adapters/driven/postgres/... -count=1 -timeout=300s -race

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: enable corepack
        run: corepack enable

      - name: install pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate proto (swagger)
        run: buf generate

      - name: install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: generate api client
        working-directory: frontend
        run: pnpm --filter @evey/api run generate

      - name: typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: lint
        working-directory: frontend
        run: pnpm run lint

      - name: build
        working-directory: frontend
        run: pnpm run build

  docker:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/evey
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          compression: zstd
          compression-level: 3
