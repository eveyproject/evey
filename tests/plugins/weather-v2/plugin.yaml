name: weather-v2
kind: plugin
version: 2.17.1
description: "The weather where you live, on your home screen, behind a sky that matches it - sun, clouds, rain, snow, and the moon in its real phase tonight. Pick your city and your units in the settings."
author: evey-examples
language: nodejs
entrypoint: node main.js
permissions:
  - network
  - prefs
external_fetch:
  - api.open-meteo.com
  - geocoding-api.open-meteo.com
  - sdo.gsfc.nasa.gov
web_root: dist
frontend:
  - slot: home.section
    src: dist/index.js
  - slot: settings.user.appearance
    src: dist/settings.js
config_schema:
  city:
    type: string
    label: City
    required: true
    default: Paris
    description: City name (resolved via Open-Meteo geocoding)
  units:
    type: select
    label: Temperature units
    default: celsius
    options:
      - value: celsius
        label: Celsius (°C)
      - value: fahrenheit
        label: Fahrenheit (°F)
