  readAmplificationLine: "Achtung: Der Server liest {{ratio}}-mal mehr Bytes von der Festplatte, als er ausliefert. Er lastet den Speicher mit Daten aus, die er verwirft - eine Halbierung dieses Verhältnisses würde die Zuschauerzahl verdoppeln, auf derselben Hardware."
  appAmplificationLine: "Davon {{app}}x vom Server selbst angefordert: alles darüber liest der Kernel im Voraus, ohne dass es jemand wollte."
  servedFromCacheLine: "Achtung: Die Festplatte wurde kaum gelesen - alles kam aus dem Cache des Betriebssystems. Die Bibliothek passt in den RAM, im echten Betrieb aber nicht: Diese Zuschauerzahl ist zu hoch, teils um ein Vielfaches."
  coldCacheToggle: "Kalter Cache: den Speicher messen, nicht den RAM"
