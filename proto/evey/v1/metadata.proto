syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "evey/v1/library.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service MetadataService {
  rpc SearchMetadata(SearchMetadataRequest) returns (SearchMetadataResponse) {
    option (google.api.http) = {
      get: "/api/v1/metadata/search"
    };
  }

  rpc RefreshMetadata(RefreshMetadataRequest) returns (stream RefreshMetadataProgress) {
    option (google.api.http) = {
      post: "/api/v1/metadata/{media_item_id}/refresh"
    };
  }

  rpc GetArtwork(GetArtworkRequest) returns (GetArtworkResponse) {
    option (google.api.http) = {
      get: "/api/v1/metadata/{media_item_id}/artwork"
    };
  }

  rpc SetMetadataOverride(SetMetadataOverrideRequest) returns (MetadataOverride) {
    option (google.api.http) = {
      post: "/api/v1/metadata/overrides"
      body: "*"
    };
  }

  rpc RemoveMetadataOverride(RemoveMetadataOverrideRequest) returns (RemoveMetadataOverrideResponse) {
    option (google.api.http) = {
      delete: "/api/v1/metadata/overrides/{id}"
    };
  }

  rpc ListMetadataOverrides(ListMetadataOverridesRequest) returns (ListMetadataOverridesResponse) {
    option (google.api.http) = {
      get: "/api/v1/metadata/{media_item_id}/overrides"
    };
  }

  rpc GetMetadataProviders(GetMetadataProvidersRequest) returns (GetMetadataProvidersResponse) {
    option (google.api.http) = {
      get: "/api/v1/metadata/providers"
    };
  }

  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse) {
    option (google.api.http) = {
      put: "/api/v1/metadata/{media_item_id}"
      body: "*"
    };
  }

  rpc DeleteMetadata(DeleteMetadataRequest) returns (DeleteMetadataResponse) {
    option (google.api.http) = {
      delete: "/api/v1/metadata/{media_item_id}"
    };
  }

  rpc ResearchMetadata(ResearchMetadataRequest) returns (ResearchMetadataResponse) {
    option (google.api.http) = {
      post: "/api/v1/metadata/{media_item_id}/research"
      body: "*"
    };
  }
}

message MetadataResult {
  string provider = 1;
  string provider_id = 2;
  string title = 3;
  string original_title = 4;
  string overview = 5;
  int32 year = 6;
  string poster_url = 7;
  string backdrop_url = 8;
  double rating = 9;
  repeated string genres = 10;
  MediaItemType type = 11;
}

message MetadataOverride {
  string id = 1;
  string media_item_id = 2;
  string field_name = 3;
  string custom_value = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message MetadataProvider {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int32 priority = 4;
  repeated MediaItemType supported_types = 5;
  map<string, string> settings = 6;
}

message RefreshMetadataProgress {
  string media_item_id = 1;
  string phase = 2;
  string provider = 3;
  double percent = 4;
  string error = 5;
}

message SearchMetadataRequest {
  string query = 1;
  MediaItemType type = 2;
  int32 year = 3;
  string provider = 4;
  int32 limit = 5;
}

message SearchMetadataResponse {
  repeated MetadataResult results = 1;
}

message RefreshMetadataRequest {
  string media_item_id = 1;
  bool replace_all = 2;
  string preferred_provider = 3;
}

message GetArtworkRequest {
  string media_item_id = 1;
  ArtworkType type = 2;
  string provider = 3;
}

message GetArtworkResponse {
  repeated Artwork artwork = 1;
}

message SetMetadataOverrideRequest {
  string media_item_id = 1;
  string field_name = 2;
  string custom_value = 3;
}

message RemoveMetadataOverrideRequest {
  string id = 1;
}

message RemoveMetadataOverrideResponse {}

message ListMetadataOverridesRequest {
  string media_item_id = 1;
}

message ListMetadataOverridesResponse {
  repeated MetadataOverride overrides = 1;
}

message GetMetadataProvidersRequest {}

message GetMetadataProvidersResponse {
  repeated MetadataProvider providers = 1;
}

message UpdateMetadataRequest {
  string media_item_id = 1;
  string title = 2;
  string description = 3;
  int32 year = 4;
  repeated string genres = 5;
}

message UpdateMetadataResponse {}

message DeleteMetadataRequest {
  string media_item_id = 1;
}

message DeleteMetadataResponse {}

message ResearchMetadataRequest {
  string media_item_id = 1;
}

message ResearchMetadataResponse {
  string media_item_id = 1;
  bool matched = 2;
  string new_title = 3;
}
