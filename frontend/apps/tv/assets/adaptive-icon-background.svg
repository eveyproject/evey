<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Adaptive icon background layer: full bleed, the launcher crops it to its own shape. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0" stop-color="#1B1B20"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="54%" r="44%">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
</svg>
