syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections"
    };
  }

  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections/{id}"
    };
  }

  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse) {
    option (google.api.http) = {
      post: "/api/v1/collections"
      body: "*"
    };
  }

  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse) {
    option (google.api.http) = {
      put: "/api/v1/collections/{id}"
      body: "*"
    };
  }

  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/collections/{id}"
    };
  }

  rpc GetCollectionItems(GetCollectionItemsRequest) returns (GetCollectionItemsResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections/{id}/items"
    };
  }

  rpc AddCollectionItem(AddCollectionItemRequest) returns (AddCollectionItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/collections/{id}/items"
      body: "*"
    };
  }

  // The collections a title belongs to. Without it a film page cannot say
  // "part of the Alien saga" nor link to the rest of it - the one place a
  // viewer actually wonders about it.
  rpc ListCollectionsForMediaItem(ListCollectionsForMediaItemRequest) returns (ListCollectionsForMediaItemResponse) {
    option (google.api.http) = {
      get: "/api/v1/media/{media_item_id}/collections"
    };
  }

  rpc RemoveCollectionItem(RemoveCollectionItemRequest) returns (RemoveCollectionItemResponse) {
    option (google.api.http) = {
      delete: "/api/v1/collections/{id}/items/{media_item_id}"
    };
  }

  rpc ReorderCollectionItems(ReorderCollectionItemsRequest) returns (ReorderCollectionItemsResponse) {
    option (google.api.http) = {
      put: "/api/v1/collections/{id}/items/order"
      body: "*"
    };
  }
}

message CollectionProto {
  string id = 1;
  string name = 2;
  string overview = 3;
  optional int32 tmdb_id = 4;
  string poster_url = 5;
  string backdrop_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  repeated CollectionRule rules = 9;
  // How the members are ordered. "release" (default) reads a saga in release
  // order; "manual" honours the hand-set position, which is the only way to
  // express a chronological order that differs from it (prequels).
  // Also "title", "added_at", "year", "rating".
  string sort_by = 10;
  string sort_order = 11;
  // Number of members THIS caller can see - already access- and parental-
  // filtered. A client cannot compute it (it never receives the members of
  // every collection) and every surface needs it: to say "4 films", and to
  // tell a real saga from a one-title stub.
  int32 item_count = 12;
  // "saga" (sourced from a TMDB collection), "smart" (rule-driven) or
  // "manual" (hand-built). Lets a client badge them and filter, instead of
  // inferring it from the presence of tmdb_id.
  string kind = 13;
}

message CollectionRule {
  string field = 1;
  string operator = 2;
  string value = 3;
}

message ListCollectionsRequest {
  // Collections holding fewer than this many VISIBLE members are omitted.
  // 0 means the server default (2): a saga you own one film of is a film, not
  // a collection, and 97% of the auto-created TMDB sagas were exactly that -
  // a wall of one-title entries nobody could use (measured 2026-08-04).
  // Pass 1 to list everything, which is what curation screens want.
  int32 min_items = 1;
}

message ListCollectionsResponse {
  repeated CollectionProto collections = 1;
}

message GetCollectionRequest {
  string id = 1;
  // Page of members to return alongside the collection. 0 means the server
  // default (50). The mobile and TV clients were already sending these as
  // query parameters, against a response that carried no members at all.
  int32 limit = 2;
  int32 offset = 3;
}

message GetCollectionResponse {
  CollectionProto collection = 1;
  // The members themselves, access- and parental-filtered like item_count.
  // Without them a client had to make a second call to show anything, and the
  // two that did not made an empty page instead (found 2026-08-04).
  repeated CollectionItemProto items = 2;
  int32 total = 3;
}

message CreateCollectionRequest {
  string name = 1;
  repeated CollectionRule rules = 2;
  string sort_by = 3;
  bool smart = 4;
  // Free text shown under the title, like the synopsis a TMDB saga carries.
  // The column and the domain always had it; only the request did not, so a
  // description typed at creation went nowhere (found 2026-08-04).
  string overview = 5;
}

message CreateCollectionResponse {
  CollectionProto collection = 1;
}

message UpdateCollectionRequest {
  string id = 1;
  string name = 2;
  repeated CollectionRule rules = 3;
  string sort_by = 4;
  bool smart = 5;
  // Optional so that a client editing only the name leaves the synopsis of a
  // TMDB saga alone: absent means "keep", empty string means "clear".
  optional string overview = 6;
}

message UpdateCollectionResponse {
  CollectionProto collection = 1;
}

message DeleteCollectionRequest {
  string id = 1;
}

message DeleteCollectionResponse {}

message GetCollectionItemsRequest {
  string id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetCollectionItemsResponse {
  repeated string media_item_ids = 1;
  int32 total = 2;
  repeated CollectionItemProto items = 3;
}

message AddCollectionItemRequest {
  string id = 1;
  string media_item_id = 2;
  int32 sort_order = 3;
}

message AddCollectionItemResponse {}

message RemoveCollectionItemRequest {
  string id = 1;
  string media_item_id = 2;
}

message RemoveCollectionItemResponse {}

message ReorderCollectionItemsRequest {
  string id = 1;
  // The members in their new order. Position in this list IS the new
  // position; any member left out keeps its current one.
  repeated string media_item_ids = 2;
}

message ReorderCollectionItemsResponse {}

message CollectionItemProto {
  string id = 1;
  string title = 2;
  string type = 3;
  int32 year = 4;
  string overview = 5;
  double community_rating = 6;
  repeated string genres = 7;
}

message ListCollectionsForMediaItemRequest {
  string media_item_id = 1;
}

message ListCollectionsForMediaItemResponse {
  repeated CollectionProto collections = 1;
}
