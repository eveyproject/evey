services:
  # To disable Caddy: comment out the caddy service and change evey's
  # "expose" to "ports" with "8080:8080" and "50051:50051"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      evey:
        condition: service_healthy

  evey:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
      - "50051"
    environment:
      EVEY_SERVER_PORT: "8080"
      EVEY_DB_HOST: postgres
      EVEY_DB_PORT: "5432"
      EVEY_DB_USER: ${POSTGRES_USER:-evey}
      EVEY_DB_PASSWORD: ${POSTGRES_PASSWORD:-evey}
      EVEY_DB_NAME: ${POSTGRES_DB:-evey}
      EVEY_DB_SSLMODE: disable
      EVEY_MEILI_URL: http://meilisearch:7700
      EVEY_MEILI_API_KEY: ${MEILI_MASTER_KEY:-changeme}
      EVEY_JWT_PRIVATE_KEY_PATH: /etc/evey/jwt.key
      EVEY_TRANSCODING_HW_ACCEL_ENABLED: "true"
    volumes:
      - transcode-cache:/var/cache/evey
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evey}
      POSTGRES_DB: ${POSTGRES_DB:-evey}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evey}"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_ENV: ${MEILI_ENV:-development}
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  meili-data:
  transcode-cache:
  caddy-data:
  caddy-config:
