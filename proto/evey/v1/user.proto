syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service UserService {
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc GetCurrentUser(GetCurrentUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/api/v1/users/{id}"
      body: "*"
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/api/v1/users/{id}"
    };
  }

  rpc DisableUser(DisableUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/disable"
    };
  }

  rpc EnableUser(EnableUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/enable"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/users"
    };
  }

  // ImpersonateUser mints a short-lived access token that lets an admin act as
  // the target user/profile ("connect as"). Admin-only; rejected for API-key
  // callers (interactive web/mobile sessions only). The returned AuthResponse
  // carries an access_token with no refresh_token: the session is bounded by the
  // access TTL and the admin re-impersonates to extend it.
  rpc ImpersonateUser(ImpersonateUserRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/impersonate"
      body: "*"
    };
  }

  rpc CreateProfile(CreateProfileRequest) returns (Profile) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/profiles"
      body: "*"
    };
  }

  rpc UpdateProfile(UpdateProfileRequest) returns (Profile) {
    option (google.api.http) = {
      patch: "/api/v1/profiles/{id}"
      body: "*"
    };
  }

  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse) {
    option (google.api.http) = {
      delete: "/api/v1/profiles/{id}"
    };
  }

  rpc SetDefaultProfile(SetDefaultProfileRequest) returns (Profile) {
    option (google.api.http) = {
      post: "/api/v1/profiles/{id}/default"
      body: "*"
    };
  }

  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/profiles"
    };
  }

  // ListAllProfiles returns every profile on the server, owner included
  // (Profile.user_id). Admin-only: it is what lets the admin panel show one
  // row per user WITH its profiles in a single call instead of an N+1 fan-out
  // of ListProfiles, and what fills the "whose history?" profile picker.
  rpc ListAllProfiles(ListAllProfilesRequest) returns (ListAllProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/profiles"
    };
  }

  rpc CreateInviteLink(CreateInviteLinkRequest) returns (InviteLink) {
    option (google.api.http) = {
      post: "/api/v1/invites"
      body: "*"
    };
  }

  rpc ListInviteLinks(ListInviteLinksRequest) returns (ListInviteLinksResponse) {
    option (google.api.http) = {
      get: "/api/v1/invites"
    };
  }

  rpc RevokeInviteLink(RevokeInviteLinkRequest) returns (RevokeInviteLinkResponse) {
    option (google.api.http) = {
      delete: "/api/v1/invites/{id}"
    };
  }

  rpc RegisterWithInvite(RegisterWithInviteRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  // ValidateInvite reports whether an invite code can still be used to
  // register, so the registration form can show a clear "link no longer
  // valid" state instead of a full form that only fails on submit. Public
  // (the code is the capability); reveals nothing beyond usability + whether
  // the resulting account is an admin one.
  rpc ValidateInvite(ValidateInviteRequest) returns (ValidateInviteResponse) {
    option (google.api.http) = {
      get: "/api/v1/invites/{code}/validate"
    };
  }

  rpc InitiateQuickConnect(InitiateQuickConnectRequest) returns (QuickConnectResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/quick-connect/initiate"
    };
  }

  rpc AuthorizeQuickConnect(AuthorizeQuickConnectRequest) returns (AuthorizeQuickConnectResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/quick-connect/authorize"
      body: "*"
    };
  }

  rpc CheckQuickConnect(CheckQuickConnectRequest) returns (CheckQuickConnectResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/quick-connect/{code}"
    };
  }

  rpc CreateAPIKey(CreateAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = {
      post: "/api/v1/api-keys"
      body: "*"
    };
  }

  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = {
      get: "/api/v1/api-keys"
    };
  }

  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse) {
    option (google.api.http) = {
      delete: "/api/v1/api-keys/{id}"
    };
  }

  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password"
      body: "*"
    };
  }

  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
  }
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  bool is_admin = 4;
  bool enabled = 5;
  int32 max_streams = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Per-user caps. 0 / absent = unlimited.
  optional int32 max_profiles = 9;
  optional int32 max_devices_per_profile = 10;
  // Most recent successful login (local or OIDC); absent until first login.
  optional google.protobuf.Timestamp last_login = 11;
}

message Profile {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string avatar_path = 4;
  map<string, string> preferences = 5;
  string max_rating = 6;
  bool is_default = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional int32 max_bitrate_kbps = 10;
  string locale = 11;
  optional string region = 12; // ISO 3166-1 alpha-2, empty/absent = resolve via server/locale fallback
  // Kids profile: restricted content by default + forces non-kids profiles
  // on the same user to have a PIN set.
  bool is_kids = 13;
  // Parental MaxAge cap stored on the profile. Only meaningful when
  // is_kids=true; absent means "use the implicit kids default (12)".
  optional int32 max_age = 14;
  // When an access token was last minted for this profile (login or refresh).
  // Absent = never. Admin impersonation does not count.
  google.protobuf.Timestamp last_active_at = 15;
  // Whether a parental PIN is set: tells an edit dialog which proof to ask
  // for before changing it (the current PIN, or the account password for a
  // first one). The hash itself never leaves the server.
  bool has_pin = 16;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message ImpersonateUserRequest {
  string user_id = 1;
  // Optional: which of the target's profiles to activate. Empty = the target's
  // default profile. Must belong to user_id or the request is rejected.
  string profile_id = 2;
}

message InviteLink {
  string id = 1;
  string code = 2;
  string created_by = 3;
  int32 max_uses = 4;
  int32 times_used = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated string library_ids = 8;
  bool is_admin = 9;
  // Cap on the profiles of the account this invite creates (unset = no cap).
  optional int32 max_profiles = 10;
}

message QuickConnectResponse {
  string code = 1;
  string secret = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message APIKey {
  string id = 1;
  string name = 2;
  string key = 3;
  string user_id = 4;
  google.protobuf.Timestamp last_used_at = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated string scopes = 7;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  // Optional profile id to activate on the new access token.
  // Must belong to the same user or the refresh is rejected; absent falls
  // back to the profile the token was issued for (else the default).
  string profile_id = 2;
  // Short-lived proof, minted by /parental/verify-pin, that the caller entered
  // the target profile's PIN. Required only when switching FROM a kids profile
  // TO a non-kids one; ignored otherwise.
  string pin_token = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetCurrentUserRequest {}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  bool is_admin = 4;
  optional int32 max_profiles = 5;
  optional int32 max_devices_per_profile = 6;
}

message UpdateUserRequest {
  string id = 1;
  optional string username = 2;
  optional string email = 3;
  optional string password = 4;
  optional bool is_admin = 5;
  optional int32 max_streams = 6;
  optional int32 max_profiles = 7;
  optional int32 max_devices_per_profile = 8;
  // Required when the caller edits their OWN password, e-mail or username:
  // a stolen access token alone must not take the account over.
  optional string current_password = 9;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message DisableUserRequest {
  string id = 1;
  // Ignored: this route always disables. Re-enable with EnableUser.
  bool disabled = 2;
}

message EnableUserRequest {
  string id = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateProfileRequest {
  string user_id = 1;
  string name = 2;
  string avatar_path = 3;
  map<string, string> preferences = 4;
  string max_rating = 5;
  bool is_kids = 6;
  optional string pin = 7; // 4-digit PIN required when kids profile exists
  optional string locale = 8;
  optional string region = 9;
  // Parental age cap. Only honored when is_kids=true; ignored otherwise.
  // Unset = fall back to the implicit kids default (12).
  optional int32 max_age = 10;
}

message UpdateProfileRequest {
  string id = 1;
  optional string name = 2;
  optional string avatar_path = 3;
  map<string, string> preferences = 4;
  optional string max_rating = 5;
  optional int32 max_bitrate_kbps = 6;
  optional string locale = 7;
  optional string region = 8;
  optional bool is_kids = 9;
  optional string pin = 10; // empty string clears the PIN; 4 digits sets it
  // Parental age cap. Only honored when the profile is_kids=true; ignored
  // otherwise. Sentinel: -1 clears any stored value, 0+ sets it.
  optional int32 max_age = 11;
  // Proof required when `pin` is set, the same rule as the parental HTTP
  // route: a profile that already has a PIN needs its CURRENT PIN to change
  // or clear it (current_pin); a first PIN needs the caller's account
  // password (current_password). An admin editing another user's profile
  // proves their own password in both cases.
  optional string current_pin = 12;
  optional string current_password = 13;
}

message DeleteProfileRequest {
  string id = 1;
}

message DeleteProfileResponse {}

message SetDefaultProfileRequest {
  string id = 1;
}

message ListProfilesRequest {
  string user_id = 1;
}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message ListAllProfilesRequest {}

message ListAllProfilesResponse {
  repeated Profile profiles = 1;
}

message CreateInviteLinkRequest {
  int32 max_uses = 1;
  google.protobuf.Timestamp expires_at = 2;
  repeated string library_ids = 3;
  bool is_admin = 4;
  // Cap on the profiles of the account this invite creates, like
  // CreateUserRequest.max_profiles (unset = no cap, must be >= 0).
  optional int32 max_profiles = 5;
}

message ListInviteLinksRequest {}

message ListInviteLinksResponse {
  repeated InviteLink invite_links = 1;
}

message RevokeInviteLinkRequest {
  string id = 1;
}

message RevokeInviteLinkResponse {}

message RegisterWithInviteRequest {
  string invite_code = 1;
  string username = 2;
  string password = 3;
  string email = 4;
}

message ValidateInviteRequest {
  string code = 1;
}

message ValidateInviteResponse {
  bool valid = 1;    // false = revoked, expired, or exhausted
  bool is_admin = 2; // the account this invite would create is an admin one
}

message InitiateQuickConnectRequest {}

message AuthorizeQuickConnectRequest {
  string code = 1;
}

message AuthorizeQuickConnectResponse {}

message CheckQuickConnectRequest {
  string code = 1;
}

message CheckQuickConnectResponse {
  bool authorized = 1;
  AuthResponse auth = 2;
}

message CreateAPIKeyRequest {
  string name = 1;
  repeated string scopes = 2;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
}

message RevokeAPIKeyRequest {
  string id = 1;
}

message RevokeAPIKeyResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}
