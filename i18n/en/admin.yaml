seekIndex:
  title: "Media Health"
  description: "A read-only scan gives every MKV/WebM file ONE verdict, and there are only two. Repairable here: missing or unusable seek index, corrupted stretch, .mkv that is really an MP4 - Repair all fixes them all in one run, keeping the original as a restorable .mkvgobak backup. For information: everything else we noticed and cannot fix here - an incomplete download, keyframes too sparse to seek into, an offset between audio tracks, a shorter audio track, surplus bytes after the end. Those are remarks, not chores: a measurement can be wrong, and a file that plays fine is fine. Acknowledge them and this page tends towards zero instead of carrying the same rows for years."
  readOnlyNote: "Repairing writes to your media folders. If they are mounted read-only (:ro in docker-compose), remount them read-write and restart the containers first - scanning still works."
  keepBackups: "Keep backups"
  keepBackupsHint: "A .mkvgobak of every repaired file survives the job so you can roll back anytime - costs one extra copy per file on disk."
  keepBackupsOffHint: "No backup is left behind: only the last {{n}} are kept during the run and removed at the end, and each repair is deep-verified in exchange. Choose this on a tight disk."
  library: Library
  allLibraries: All libraries
  scan: Scan
  scanAgain: Scan again
  scanFailed: Scan failed
  pace: "Disk use"
  paceGentle: "Discreet"
  paceFast: "Fast"
  paceGentleHint: "One file at a time, then a pause as long as that file took to read: your disks stay free about half the time, so a film keeps playing while the scan runs. Slower, and the right choice unless nobody is watching."
  paceFastHint: "Several files at once, no pause: on a library spread over several disks this is about three times quicker, but the disks are busy for the whole run and playback may stutter."
  repairAll: "Repair all ({{count}})"
  rollbackAll: "Roll back all ({{count}})"
  statsInspected: Files inspected
  statsMissing: Missing seek index
  statsBackup: With backup
  statsAudioDelay: "Delayed audio"
