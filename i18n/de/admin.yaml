  coldCacheLine: "Die Bibliothek wurde während des gesamten Laufs aus dem System-Cache verdrängt: Diese Zahlen messen den Speicher, nicht den RAM. Niemals mit einem warmen Lauf vergleichen."
  coldCacheStillStarvedLine: "Achtung: Der Festplattenzähler hat fast nichts gesehen, obwohl der Cache durchgehend geleert wurde. Auf diesem Mount sieht der Kernel die Lesezugriffe nicht (Netzwerk- oder 9p/virtiofs-Pfad), oder ein Cache außerhalb dieses Systems (VM-Host, NAS-Controller) fängt sie ab. Diese Zahlen messen diesen Übertragungsweg, nicht die Festplatten."
  storageOpaqueLine: "Die Bibliothek liegt auf einem {{fs}}-Mount. Der Kernel des Servers sieht die Lesezugriffe dahinter nicht: Der Festplattenzähler bleibt blind und ein Pool zählt als eine einzige Festplatte. Die Speicherwerte beschreiben diesen Übertragungsweg, nicht die Festplatten."
  storageOpaqueColdLine: "Die Bibliothek liegt auf einem {{fs}}-Mount. Der kalte Cache wurde auf den Mount angewendet, aber die Festplatten darunter können weiter aus ihrem eigenen Cache liefern, und der Kernel des Servers sieht die Lesezugriffe dahinter nicht (blinder Festplattenzähler, ein Pool zählt als eine einzige Festplatte). Diese Zahlen sind kälter als ein warmer Lauf, aber keine Messung der Festplatten."
