syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravity/evey/gen/evey/v1;eveyv1";

service FavoriteService {
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteResponse) {
    option (google.api.http) = {
      post: "/api/v1/favorites/{media_item_id}"
      body: "*"
    };
  }

  rpc GetFavoriteStatus(GetFavoriteStatusRequest) returns (GetFavoriteStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/favorites/{media_item_id}"
    };
  }

  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse) {
    option (google.api.http) = {
      get: "/api/v1/favorites"
    };
  }
}

message ToggleFavoriteRequest {
  string media_item_id = 1;
}

message ToggleFavoriteResponse {
  bool is_favorite = 1;
}

message GetFavoriteStatusRequest {
  string media_item_id = 1;
}

message GetFavoriteStatusResponse {
  bool is_favorite = 1;
}

message ListFavoritesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message FavoriteItem {
  string media_item_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ListFavoritesResponse {
  repeated FavoriteItem items = 1;
}
