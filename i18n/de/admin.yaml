  paceFastHint: "Mehrere Dateien gleichzeitig, ohne Pause: Bei einer auf mehrere Festplatten verteilten Bibliothek ist das etwa dreimal schneller, aber die Festplatten sind die ganze Zeit belegt und die Wiedergabe kann stocken."
