services:
  # ── Infrastructure ──
  postgres:
    container_name: evey-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EVEY_DB_NAME:-evey}
      POSTGRES_USER: ${EVEY_DB_USER:-evey}
      POSTGRES_PASSWORD: ${EVEY_DB_PASSWORD:-evey}
    expose:
      - "5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-~/.evey/postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVEY_DB_USER:-evey}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meilisearch:
    container_name: evey-meilisearch
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Evey backend (registry image) ──
  evey:
    container_name: evey-server
    image: gravityz/evey:${EVEY_VERSION:-latest}
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '4'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    ports:
      - "${EVEY_HTTP_PORT:-9091}:${EVEY_HTTP_PORT:-9091}"
      - "${EVEY_SERVER_PORT:-9090}:${EVEY_SERVER_PORT:-9090}"
    environment:
      EVEY_DB_HOST: postgres
      EVEY_MEILI_URL: http://meilisearch:7700
      EVEY_JWT_PRIVATE_KEY_PATH: /data/jwt.key
      EVEY_TRANSCODING_CACHE_DIR: /data/transcode
      EVEY_TRICKPLAY_CACHE_DIR: /cache/trickplay
    env_file:
      - path: .env
        required: false
    volumes:
      - evey-data:/data
      - evey-cache:/cache
      - ${MEDIA_DIR:-/media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${EVEY_HTTP_PORT:-9091}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Caddy (optional — admins can use their own reverse proxy) ──
  caddy:
    container_name: evey-caddy
    profiles: [caddy]
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVEY_DOMAIN: ${EVEY_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      evey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meili-data:
  evey-data:
  evey-cache:
  caddy-data:
  caddy-config:
