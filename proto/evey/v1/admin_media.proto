syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service AdminMediaService {
  rpc RefreshAllMetadata(RefreshAllMetadataRequest) returns (RefreshAllMetadataResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/refresh-metadata"
    };
  }

  // MatchOrphansInLibrary targets only items missing provider IDs (TMDB
  // never matched them at scan time) and queues an async re-enrichment.
  // Returns immediately with the count of queued items; the enricher
  // pool drains them in the background under its existing concurrency
  // and rate-limit caps. Idempotent — re-run to pick up the still-
  // orphaned remainder once any rate limits clear.
  rpc MatchOrphansInLibrary(MatchOrphansInLibraryRequest) returns (MatchOrphansInLibraryResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/match-orphans"
      body: "*"
    };
  }

  rpc GenerateAllTrickplays(GenerateAllTrickplaysRequest) returns (GenerateAllTrickplaysResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/trickplay/generate-all"
    };
  }

  rpc DeleteMediaItem(DeleteMediaItemRequest) returns (DeleteMediaItemResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/media/{id}"
    };
  }

  // ScanSeekIndex returns the cached result of the last completed scan for the
  // scope — instant, no disk I/O. scanned_at_ms is 0 when no scan has completed
  // yet; kick one with StartSeekIndexScan and poll GetSeekIndexJob. Files
  // without an index seek/resume slowly because the player has to scan
  // linearly; has_backup reports whether a prior reindex left a restorable
  // .mkvgobak.
  rpc ScanSeekIndex(ScanSeekIndexRequest) returns (ScanSeekIndexResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/media/seek-index"
    };
  }

  // StartSeekIndexScan kicks a background scan of the library (all libraries
  // when library_id is empty) and returns immediately. Scanning walks every
  // MKV/WebM on disk so it can take minutes on a large/network-mounted library
  // — a synchronous call would time out behind a reverse proxy. Read-only.
  // Fails with RESOURCE_EXHAUSTED if a seek-index job is already running.
  rpc StartSeekIndexScan(StartSeekIndexScanRequest) returns (StartSeekIndexScanResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/seek-index/scan"
      body: "*"
    };
  }

  // GetSeekIndexJob reports the live progress of the running seek-index job
  // (scan, reindex or rollback) plus a summary of the last finished one.
  // Poll it after any Start*/Reindex*/Rollback* call.
  rpc GetSeekIndexJob(GetSeekIndexJobRequest) returns (GetSeekIndexJobResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/media/seek-index/job"
    };
  }

  // ReindexMediaSeekIndex rebuilds one media file's seek index in the
  // background (a rewrite of a multi-GB file takes minutes) and returns
  // immediately with accepted=true. Outcome is observable via GetSeekIndexJob.
  // The rebuild is validated + cross-checked before an atomic swap and the
  // original is kept as a .mkvgobak; on any failure the original is left
  // untouched. Fails with RESOURCE_EXHAUSTED if a job is already running.
  rpc ReindexMediaSeekIndex(ReindexMediaSeekIndexRequest) returns (ReindexMediaSeekIndexResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/{media_id}/seek-index/reindex"
    };
  }

  // RollbackMediaSeekIndex restores one media file from its .mkvgobak backup
  // in the background, undoing a prior reindex. Returns accepted=true
  // immediately; outcome via GetSeekIndexJob. Fails fast if the media has no
  // file, or with RESOURCE_EXHAUSTED if a job is already running.
  rpc RollbackMediaSeekIndex(RollbackMediaSeekIndexRequest) returns (RollbackMediaSeekIndexResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/{media_id}/seek-index/rollback"
    };
  }

  // ReindexLibrarySeekIndex kicks a background job that re-scans the library
  // then rebuilds the seek index of every un-indexed file. Returns immediately;
  // progress (scanning → processing, done/total) via GetSeekIndexJob.
  rpc ReindexLibrarySeekIndex(ReindexLibrarySeekIndexRequest) returns (ReindexLibrarySeekIndexResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/seek-index/reindex-library"
      body: "*"
    };
  }

  // RollbackLibrarySeekIndex kicks a background job that re-scans the library
  // then restores every file that has a .mkvgobak backup. Returns immediately;
  // progress via GetSeekIndexJob.
  rpc RollbackLibrarySeekIndex(RollbackLibrarySeekIndexRequest) returns (RollbackLibrarySeekIndexResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/seek-index/rollback-library"
      body: "*"
    };
  }
}

// SeekIndexItem is the per-file diagnosis surfaced by ScanSeekIndex.
message SeekIndexItem {
  string media_id = 1;
  string title = 2;
  string path = 3;
  bool has_index = 4;    // false = muxed without Cues → slow seek/resume
  bool has_backup = 5;   // a .mkvgobak exists → a prior reindex is rollback-able
  int64 size_bytes = 6;
  string container = 7;  // e.g. "mkv", "webm"
  // Audio starts this far after the video (seconds, max across audio tracks).
  // Above ~0.1s = repack mux defect playing as a constant A/V desync on
  // copied audio (transcoded audio auto-cancels it at playback). 0 = aligned.
  double audio_delay_sec = 8;
}

message ScanSeekIndexRequest {
  // Optional: when set, only this library is scanned. Empty = every library.
  string library_id = 1;
}

message ScanSeekIndexResponse {
  repeated SeekIndexItem items = 1;
  int32 total = 2;        // EBML files inspected
  int32 missing_index = 3; // count with has_index == false
  int32 with_backup = 4;   // count with has_backup == true
  // When the last completed scan for this scope finished (unix ms). 0 = no
  // scan has completed yet — items/counters are empty, not "all clean".
  int64 scanned_at_ms = 5;
  // Count with audio_delay_sec above the defect floor (~0.1s).
  int32 audio_delayed = 6;
}

message StartSeekIndexScanRequest {
  // Optional: when set, only this library is scanned. Empty = every library.
  string library_id = 1;
}

message StartSeekIndexScanResponse {}

message GetSeekIndexJobRequest {}

// SeekIndexJobFailure records one file a job could not process.
message SeekIndexJobFailure {
  string path = 1;
  string error = 2;
  // The failure came from a read-only mount (:ro media volume) — the user
  // must remount read-write before repairing.
  bool read_only = 3;
}

// SeekIndexJobSummary describes the last finished job (since server boot).
message SeekIndexJobSummary {
  string kind = 1;   // "scan" | "reindex" | "rollback"
  string scope = 2;  // "" = all libraries, else the library id
  int32 done = 3;
  int32 failed = 4;
  int32 skipped = 5; // files that already had an index (nothing to do)
  int32 total = 6;
  int64 finished_at_ms = 7;
  string error = 8;  // job-level error (e.g. the scan itself failed)
  bool read_only = 9; // at least one failure came from a read-only mount
  repeated SeekIndexJobFailure failures = 10; // capped at 50
}

message GetSeekIndexJobResponse {
  bool running = 1;
  string kind = 2;        // "scan" | "reindex" | "rollback"
  string scope = 3;       // "" = all libraries, else the library id
  string phase = 4;       // "scanning" | "processing"
  int32 done = 5;
  int32 failed = 6;
  int32 skipped = 7;
  int32 total = 8;
  string current_path = 9;
  int64 started_at_ms = 10;
  SeekIndexJobSummary last = 11; // unset until a first job finishes
}

message ReindexMediaSeekIndexRequest {
  string media_id = 1;
}

message ReindexMediaSeekIndexResponse {
  // The repair now runs in the background; per-file details (backup path,
  // warnings, sizes) land in the server log and the job summary.
  bool accepted = 7;

  // Deprecated pre-async fields, always zero now that the repair is a job.
  bool skipped = 1 [deprecated = true];
  bool reindexed = 2 [deprecated = true];
  string backup_path = 3 [deprecated = true];
  repeated string warnings = 4 [deprecated = true];
  int64 src_bytes = 5 [deprecated = true];
  int64 dst_bytes = 6 [deprecated = true];
}

message RollbackMediaSeekIndexRequest {
  string media_id = 1;
}

message RollbackMediaSeekIndexResponse {
  bool accepted = 2;
  // Deprecated: the restore now runs in the background — poll GetSeekIndexJob.
  bool restored = 1 [deprecated = true];
}

message ReindexLibrarySeekIndexRequest {
  string library_id = 1;
}

message ReindexLibrarySeekIndexResponse {
  // Deprecated: the candidate count is only known once the background scan
  // phase completes — always -1 now. Poll GetSeekIndexJob for done/total.
  int32 queued = 1 [deprecated = true];
}

message RollbackLibrarySeekIndexRequest {
  string library_id = 1;
}

message RollbackLibrarySeekIndexResponse {
  // Deprecated: always -1 — poll GetSeekIndexJob for done/total.
  int32 queued = 1 [deprecated = true];
}

message RefreshAllMetadataRequest {
  // Optional: when set, only items of this library are refreshed.
  // Empty (default) refreshes every library.
  string library_id = 1;
}

message RefreshAllMetadataResponse {
  int32 refreshed = 1;
}

message MatchOrphansInLibraryRequest {
  // Optional: when set, only orphans of this library are queued.
  // Empty (default) targets orphans in every library.
  string library_id = 1;
}

message MatchOrphansInLibraryResponse {
  // Number of orphaned items queued for enrichment. The job runs async;
  // the actual matched count is observable by re-listing items with
  // empty providerIds.
  int32 queued = 1;
}

message GenerateAllTrickplaysRequest {}

message GenerateAllTrickplaysResponse {
  int32 generated = 1;
}

message DeleteMediaItemRequest {
  string id = 1;
}

message DeleteMediaItemResponse {}
