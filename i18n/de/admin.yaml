seekIndex:
  title: "Medienzustand"
  description: "Ein reiner Lesescan gibt jeder MKV/WebM-Datei EIN Urteil, und es gibt nur zwei. Hier reparierbar: fehlender oder unbrauchbarer Suchindex, beschädigter Abschnitt, .mkv, das in Wahrheit ein MP4 ist - „Alles reparieren“ erledigt das in einem Durchlauf und behält das Original als wiederherstellbares .mkvgobak-Backup. Zur Information: alles andere, was uns aufgefallen ist und hier nicht behoben werden kann - ein unvollständiger Download, zu weit auseinanderliegende Keyframes, ein Versatz zwischen den Tonspuren, eine kürzere Tonspur, überschüssige Bytes am Ende. Das sind Hinweise, keine Aufgaben: eine Messung kann falsch sein, und eine Datei, die gut läuft, ist in Ordnung. Wer sie abhakt, sieht diese Seite gegen null gehen, statt jahrelang dieselben Zeilen zu tragen."
  readOnlyNote: "Die Reparatur schreibt in deine Medienordner. Sind sie schreibgeschützt eingebunden (:ro in docker-compose), binde sie zuerst beschreibbar ein und starte die Container neu - der Scan funktioniert trotzdem."
  keepBackups: "Sicherungen behalten"
  keepBackupsHint: "Ein .mkvgobak jeder reparierten Datei bleibt nach dem Auftrag erhalten, sodass du jederzeit zurückrollen kannst - kostet eine zusätzliche Kopie pro Datei auf der Festplatte."
  keepBackupsOffHint: "Keine Sicherung bleibt zurück: Nur die letzten {{n}} bleiben während des Laufs erhalten und werden am Ende entfernt, dafür wird jede Reparatur tief verifiziert. Bei knappem Speicher wählen."
