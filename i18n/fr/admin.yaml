  coldCacheLine: "La bibliothèque a été éjectée du cache du système pendant tout le test : ces chiffres mesurent le stockage, pas la RAM. Ne les comparez jamais à un test à cache chaud."
  coldCacheStillStarvedLine: "Attention : le compteur disque n'a presque rien vu, alors même que le cache était éjecté en continu. Sur ce montage, le noyau ne voit pas les lectures (chemin réseau ou 9p/virtiofs), ou un cache extérieur à ce système (hôte de VM, contrôleur NAS) les absorbe. Ces chiffres mesurent ce chemin de livraison, pas les disques."
  storageOpaqueLine: "La bibliothèque est sur un montage {{fs}}. Les disques derrière lui ont été identifiés par lecture au début du test (correspondance ci-dessous) ; la lecture disque est une mesure de toute la machine."
  storageOpaqueColdLine: "La bibliothèque est sur un montage {{fs}} : cache froid au montage, page cache des branches actif. L'éviction s'arrête au montage, les disques en dessous servent encore depuis leur propre cache : ces chiffres mesurent le chemin de livraison, pas un stockage froid."
