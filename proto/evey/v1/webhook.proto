syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (WebhookConfig) {
    option (google.api.http) = {
      post: "/api/v1/admin/webhooks"
      body: "*"
    };
  }

  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/webhooks"
    };
  }

  rpc UpdateWebhook(UpdateWebhookRequest) returns (WebhookConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/webhooks/{id}"
      body: "*"
    };
  }

  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/webhooks/{id}"
    };
  }

  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/webhooks/{webhook_id}/deliveries"
    };
  }
}

message WebhookConfig {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string events = 4;
  string secret = 5;
  map<string, string> headers = 6;
  bool enabled = 7;
  google.protobuf.Timestamp created_at = 8;
}

message WebhookDelivery {
  string id = 1;
  string webhook_id = 2;
  string event = 3;
  int32 status_code = 4;
  string error = 5;
  google.protobuf.Timestamp sent_at = 6;
}

message CreateWebhookRequest {
  string name = 1;
  string url = 2;
  repeated string events = 3;
  string secret = 4;
  map<string, string> headers = 5;
  bool enabled = 6;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated WebhookConfig webhooks = 1;
}

message UpdateWebhookRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string events = 4;
  string secret = 5;
  map<string, string> headers = 6;
  bool enabled = 7;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message ListWebhookDeliveriesRequest {
  string webhook_id = 1;
  int32 limit = 2;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
}
