version: "2"

run:
  go: "1.27"
  timeout: 5m

linters:
  enable:
    # Core (+ defaults: errcheck, govet, ineffassign, staticcheck, unused)
    - errorlint
    - wastedassign
    - nilerr
    - recvcheck
    # Code quality
    - misspell
    - unconvert
    - revive
    - gocritic
    - modernize
    - intrange
    # HTTP / SQL safety
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    # Test quality
    - testifylint
    # nolint hygiene
    - nolintlint
    # TxUnit enforcement: repos must honor an ambient transaction
    - forbidigo
    # Sub-wiring guard: HTTP handler structs are pure dependency-injection (every
    # field is a service/checker set by the constructor). A keyed literal that
    # forgets a field compiles fine but leaves a nil dependency that nil-panics or
    # fails-open at request time (favorites/scheduler slipped this way). exhaustruct
    # is scoped (settings.exhaustruct_v5.include) to ONLY these handler types, so a
    # forgotten field is a build-time lint error instead of a runtime surprise.
    - exhaustruct_v5

  settings:
    # modernize runs with every analyzer. stringscut, errorsastype and
    # embedlit were disabled until the 2026-10-18 sweep cleared their 90 sites
    # by hand-checked --fix (embedlit's autofix is only kept off
    # cmd/evey/gateway.go, by an explicit nolint: the embedded MarshalOptions
    # there decides the JSON of every API answer and stays spelled out).
    misspell:
      # Les commentaires de ce dépôt sont en FRANÇAIS, et misspell est un
      # correcteur anglais : il lit des mots français comme des fautes anglaises
      # ("démarrage" -> marriage, "présence" -> sense). Reformuler à chaque fois
      # abîme la prose sans rien corriger, donc on exclut les jetons concernés.
      # Ajouter ici le jeton EXACT rapporté par le linter, pas le mot entier.
      ignore-rules:
        - marrage # démarrage, redémarrage
        - abandonne
        - normalis # normalisés, normalisation
        - journalis # journalisée, journalisation
        - sence # présence
        - portait
        - documentaire # le genre TMDB en français, lu comme une faute de "documentaries"
    # exhaustruct_v5, not exhaustruct: the original was DEPRECATED in
    # golangci-lint 2.13 ("new major version") and will go away. Same checker,
    # same scoping key, renamed.
    exhaustruct_v5:
      # Scope to the HTTP handler dependency structs ONLY - enabling it
      # globally would flag every legitimate partial literal in the codebase
      # (measured: 1338 hits unscoped, against 1 when scoped).
      #
      # v5 did not just rename the option, it FLIPPED THE DEFAULT: v4's
      # `include` meant "check only these", while v5 checks every struct
      # literal in the codebase and `enforce-patterns` only adds to that.
      # Renaming alone took this from 1 finding to 1338. `explicit-mode` is
      # what restores the v4 behaviour: nothing is checked unless a pattern
      # (or an //exhaustruct:enforce directive) names it.
      explicit-mode: true
      enforce-patterns:
        - 'github.com/eveyproject/evey/internal/adapters/driving/http\..*Handler$'
    forbidigo:
      forbid:
        # A postgres repo calling its *sql.DB handle directly (r.db.ExecContext,
        # …) bypasses any ambient transaction set by TxUnit.Do - so a caller
        # wrapping several writes in uow.Do silently loses atomicity. Route every
        # statement through txFromCtx(ctx, r.db), which uses the ambient tx when
        # present and falls back to the raw handle otherwise. (Own-tx repos keep
        # using r.db.BeginTx + tx.ExecContext, which this does not match.)
        - pattern: '\.db\.(ExecContext|QueryContext|QueryRowContext)\('
          msg: "use txFromCtx(ctx, <recv>.db).XContext so the repo honors an ambient TxUnit transaction"
    errcheck:
      check-blank: true
      # Non-actionable error returns
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # defer close - error logged by DB/OS layer already
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Conn).Close
        - (*github.com/eveyproject/evey/internal/adapters/driven/pluginrunner.pluginLogWriter).Close
        # startup best-effort initialization
        - (*github.com/eveyproject/evey/internal/app/feed.CommandService).EnsureLibraryFeedConfig
        - (net/http.Response.Body).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
        - (database/sql.Result).RowsAffected
        # intentional zero-fallback conversions
        - strconv.Atoi
        - strconv.ParseFloat
        - strconv.ParseUint
        - strconv.ParseInt
        # process cleanup - error expected after cancel/kill
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        # cleanup / best-effort FS ops
        - os.RemoveAll
        - os.ReadDir
        # scan helpers - zero-value fallback on parse failure
        - fmt.Sscan
        # body drain to io.Discard
        - io.Copy
        # slog handler - multi-handler best-effort
        - (log/slog.Handler).Handle
        # websocket best-effort operations
        - (*golang.org/x/net/websocket.Conn).Close
        - (*golang.org/x/net/websocket.Conn).SetWriteDeadline
        - (golang.org/x/net/websocket.Codec).Send
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true  # project style: sparse comments
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - commentedOutCode
        - hugeParam

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
          - forbidigo
          # Tests construct handlers with partial/positional fields on purpose
          # (exercising one code path); the sub-wiring guard is for production
          # constructors only.
          - exhaustruct_v5
      - path: gen/
        linters:
          - errcheck
          - unused
          - staticcheck
          - revive
          - gocritic
          - modernize
          - intrange
      - path: fakes/
        linters:
          - unused
          - revive
          - errcheck
      - path: internal/adapters/driven/ebml/
        linters:
          - errcheck
      - path: testhelpers/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
