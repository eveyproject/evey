services:
  # ── Infrastructure (always) ──
  postgres:
    container_name: evey-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EVEY_DB_NAME:-evey}
      POSTGRES_USER: ${EVEY_DB_USER:-evey}
      POSTGRES_PASSWORD: ${EVEY_DB_PASSWORD:-evey}
    expose:
      - "5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-~/.evey/postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVEY_DB_USER:-evey}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  meilisearch:
    container_name: evey-meilisearch
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Dev ──
  evey:
    container_name: evey-server
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    ports:
      - "${EVEY_SERVER_PORT:-9090}:${EVEY_SERVER_PORT:-9090}"
      - "${EVEY_HTTP_PORT:-9091}:${EVEY_HTTP_PORT:-9091}"
    env_file: .env.dev
    environment:
      EVEY_DB_HOST: postgres
      EVEY_MEILI_URL: http://meilisearch:7700
      EVEY_JWT_PRIVATE_KEY_PATH: /data/jwt.key
      EVEY_TRANSCODING_CACHE_DIR: /data/transcode
      EVEY_TRICKPLAY_CACHE_DIR: /cache/trickplay
      EVEY_LOG_DEV_MODE: "true"
      EVEY_LOG_LEVEL: debug
    volumes:
      - .:/app
      - evey-data:/data
      - evey-cache:/cache
      - /path/to/movies:/media
      - /path/to/series:/media2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${EVEY_HTTP_PORT:-9091}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  web:
    container_name: evey-web
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    environment:
      VITE_API_TARGET: "http://evey:${EVEY_HTTP_PORT:-9091}"
      VITE_HMR_HOST: evey.test
      VITE_HMR_PORT: "443"
      VITE_HMR_PROTOCOL: wss
      VITE_ALLOWED_HOSTS: evey.test
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${WEB_PORT:-5173}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      evey:
        condition: service_healthy

  caddy:
    container_name: evey-caddy
    profiles: [dev]
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      - web

  # ── Prod ──
  evey-prod:
    container_name: evey-server-prod
    profiles: [prod]
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    env_file:
      - path: .env
        required: false
    expose:
      - "${EVEY_SERVER_PORT:-9090}"
    environment:
      EVEY_DB_HOST: postgres
      EVEY_MEILI_URL: http://meilisearch:7700
      EVEY_JWT_PRIVATE_KEY_PATH: /data/jwt.key
      EVEY_TRANSCODING_CACHE_DIR: /data/transcode
      EVEY_TRICKPLAY_CACHE_DIR: /cache/trickplay
    volumes:
      - evey-data:/data
      - evey-cache:/cache
      - ${MEDIA_DIR:-/media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${EVEY_HTTP_PORT:-9091}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  caddy-prod:
    container_name: evey-caddy-prod
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      EVEY_DOMAIN: ${EVEY_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      evey-prod:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meili-data:
  evey-data:
  evey-cache:
  caddy-data:
  caddy-config:
