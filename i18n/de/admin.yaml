seekIndex:
  title: "Medienzustand"
  description: "Ein reiner Lesescan gibt jeder MKV/WebM-Datei ein Urteil, und es gibt nur zwei."
  introRepairable: "fehlender Seek-Index, beschädigter Abschnitt, .mkv, das in Wahrheit ein MP4 ist. „Alles reparieren“ erledigt das in einem Durchlauf."
  introInformational: "was uns aufgefallen ist und hier nicht behoben werden kann. Als gesehen markieren, und die Seite leert sich nach und nach."
  introMore: "Mehr über die beiden Urteile"
  introDetailScope: "Jede reparierte Datei behält ihr Original als .mkvgobak-Backup, jederzeit wiederherstellbar."
  introDetailRemarks: "Auf der Seite „Zur Information“: unvollständiger Download, zu weit auseinanderliegende Keyframes, Versatz zwischen den Tonspuren, kürzere Tonspur, überschüssige Bytes am Ende."
  readOnlyNote: "Die Reparatur schreibt in Ihre Medienordner. Sind sie schreibgeschützt eingebunden (:ro in docker-compose), binden Sie sie zuerst beschreibbar ein und starten Sie die Container neu - der Scan funktioniert trotzdem."
  keepBackups: "Sicherungen behalten"
  keepBackupsHint: "Ein .mkvgobak jeder reparierten Datei bleibt nach dem Auftrag erhalten, sodass Sie jederzeit zurückrollen können - kostet eine zusätzliche Kopie pro Datei auf der Festplatte."
  keepBackupsOffHint: "Keine Sicherung bleibt zurück: Nur die letzten {{n}} bleiben während des Laufs erhalten und werden am Ende entfernt, dafür wird jede Reparatur tief verifiziert. Bei knappem Speicher wählen."
