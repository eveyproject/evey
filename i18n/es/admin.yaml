  storageCollapseLine: "Atención: el almacenamiento se desploma más allá de {{count}} lecturas simultáneas: el caudal se hunde y una sola lectura pasa a tardar segundos. Es el almacenamiento, no el servidor, lo que limita cuánta gente puede ver."
  readAmplificationLine: "Atención: el servidor lee {{ratio}} veces más bytes del disco de los que sirve. Satura su almacenamiento con datos que descarta: reducir a la mitad esta proporción duplicaría la audiencia, con el mismo hardware."
  appAmplificationLine: "De los cuales {{app}}x los pide el propio servidor: lo que exceda es el núcleo leyendo por adelantado datos que nadie pidió."
  servedFromCacheLine: "Atención: el disco apenas se leyó: todo se sirvió desde la caché del sistema. La biblioteca cabe en RAM, cosa que no ocurrirá en uso real: este número de espectadores está sobreestimado, a veces varias veces."
  coldCacheToggle: "Caché fría: medir el almacenamiento, no la RAM"
  coldCacheHint: "Expulsa continuamente la biblioteca de la caché del sistema durante toda la prueba. Más cercano al uso real cuando la biblioteca no cabe en memoria: espere un número de espectadores más bajo y más honesto."
  coldCacheLine: "La biblioteca fue expulsada de la caché del sistema durante toda la prueba: estas cifras miden el almacenamiento, no la RAM. Nunca las compare con una prueba en caliente."
  coldCacheStillStarvedLine: "Atención: el contador de disco apenas vio nada, pese a que la caché se expulsó continuamente. En este montaje el kernel no ve las lecturas (ruta de red o 9p/virtiofs), o una caché externa a este sistema (host de VM, controladora NAS) las absorbe. Estas cifras miden esa ruta de entrega, no los discos."
  storageOpaqueLine: "La biblioteca está en un montaje {{fs}}. El kernel del servidor no ve las lecturas que hay detrás: el contador de disco queda ciego y un pool cuenta como un solo disco. Las cifras de almacenamiento describen esta ruta de entrega, no los discos."
  storageOpaqueColdLine: "La biblioteca está en un montaje {{fs}}. La caché fría se aplicó al montaje, pero los discos de debajo pueden seguir sirviendo desde su propia caché, y el kernel del servidor no ve las lecturas que hay detrás (contador de disco ciego, un pool cuenta como un solo disco). Estas cifras son más frías que una prueba en caliente, no una medida de los discos."
