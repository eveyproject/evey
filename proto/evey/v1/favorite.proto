syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service FavoriteService {
  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse) {
    option (google.api.http) = {
      get: "/api/v1/favorites"
    };
  }

  rpc AddFavorite(AddFavoriteRequest) returns (AddFavoriteResponse) {
    option (google.api.http) = {
      post: "/api/v1/favorites/{media_item_id}"
      body: "*"
    };
  }

  rpc RemoveFavorite(RemoveFavoriteRequest) returns (RemoveFavoriteResponse) {
    option (google.api.http) = {
      delete: "/api/v1/favorites/{media_item_id}"
    };
  }

  rpc IsFavorite(IsFavoriteRequest) returns (IsFavoriteResponse) {
    option (google.api.http) = {
      get: "/api/v1/favorites/{media_item_id}"
    };
  }

  // Batch counterpart of IsFavorite: one call answers for a whole screen.
  // POST because the id list does not fit a query string at grid sizes, and on
  // a path deeper than /api/v1/favorites/{media_item_id} so the gateway can
  // never route it to AddFavorite with media_item_id="batch".
  rpc BatchIsFavorite(BatchIsFavoriteRequest) returns (BatchIsFavoriteResponse) {
    option (google.api.http) = {
      post: "/api/v1/favorites/batch/is-favorite"
      body: "*"
    };
  }
}

message FavoriteProto {
  string id = 1;
  string profile_id = 2;
  string media_item_id = 3;
  google.protobuf.Timestamp created_at = 4;
  string title = 5;
  string type = 6;
  int32 year = 7;
  double community_rating = 8;
}

message ListFavoritesRequest {
  string profile_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListFavoritesResponse {
  repeated FavoriteProto items = 1;
}

message AddFavoriteRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message AddFavoriteResponse {
  bool is_favorite = 1;
}

message RemoveFavoriteRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message RemoveFavoriteResponse {}

message IsFavoriteRequest {
  string media_item_id = 1;
  string profile_id = 2;
}

message IsFavoriteResponse {
  bool is_favorite = 1;
}

message BatchIsFavoriteRequest {
  // Over the server's ceiling the call is REFUSED, never truncated: a silently
  // shortened answer reads as "not a favorite" on the client and paints an
  // empty heart over a real favorite.
  repeated string media_item_ids = 1;
  string profile_id = 2;
}

message BatchIsFavoriteResponse {
  // Only the ids that ARE favorites of the caller's profile. Anything asked
  // about and not returned is simply "not a favorite" - which is also what an
  // unknown id, an item in a library the caller cannot access and a parentally
  // blocked item look like, so the answer never reveals that a media item exists.
  repeated string favorite_media_item_ids = 1;
}
