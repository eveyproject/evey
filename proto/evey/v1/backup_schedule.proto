syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service BackupScheduleService {
  rpc GetBackupSchedule(GetBackupScheduleRequest) returns (BackupSchedule) {
    option (google.api.http) = {
      get: "/api/v1/admin/backup-schedule"
    };
  }

  rpc UpdateBackupSchedule(UpdateBackupScheduleRequest) returns (BackupSchedule) {
    option (google.api.http) = {
      patch: "/api/v1/admin/backup-schedule"
      body: "*"
    };
  }

  rpc RunBackupNow(RunBackupNowRequest) returns (RunBackupNowResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/backup-schedule/run"
      body: "*"
    };
  }
}

message BackupSchedule {
  string cron_expression = 1;
  bool enabled = 2;
  int32 retention_days = 3;
  google.protobuf.Timestamp last_run_at = 4;
  google.protobuf.Timestamp next_run_at = 5;
  string last_status = 6;
  string last_error = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetBackupScheduleRequest {}

message UpdateBackupScheduleRequest {
  optional string cron_expression = 1;
  optional bool enabled = 2;
  optional int32 retention_days = 3;
}

message RunBackupNowRequest {}

message RunBackupNowResponse {
  string backup_id = 1;
}
