  audioOffsetHint: "Une piste audio démarre après l'image. C'est ainsi qu'un doublage est calé sur un montage, et tous les lecteurs le respectent - il n'y a rien à corriger."
  audioOffsetProvenHint: "Une piste audio démarre après l'image, et les pistes de ce fichier ont été comparées : elles concordent, le décalage est voulu. Rien à faire."
  audioTracksDisagreeBadge: "Pistes audio décalées de {{sec}} s"
  audioTracksDisagreeHint: "Les pistes audio de ce fichier ont été comparées : elles divergent de {{sec}} s, donc l'une d'elles est mal placée. Rien ici ne peut dire laquelle, donc rien n'est modifié automatiquement : écoutez les deux et gardez la bonne, ou reprenez le fichier."
  audioPictureOffBadge: "Son décalé de {{sec}} s par rapport à l'image"
  audioPictureOffHint: "Mesuré sur les sous-titres du fichier (calés sur l'image) : la piste audio {{track}} est à {{sec}} s de l'endroit où la parole devrait être - positif = le son doit être retardé. Au moins deux fenêtres du film sont d'accord. Vérifiez sur le clip d'aperçu et appliquez ce décalage depuis là ; rien n'est réécrit tout seul."
  audioTrackZeroedBadge: "Piste audio ramenée à 0"
  audioTrackZeroedHint: "Une piste audio de ce fichier démarre exactement sur l'image alors qu'une autre garde son petit décalage d'origine. C'est la marque que laisse une ancienne réparation audio quand elle tire une piste en arrière de son propre décalage déclaré. Si le doublage est en avance, la valeur retirée n'est plus dans le fichier et rien ici ne peut la rendre automatiquement : écoutez, corrigez à la main, ou récupérez le fichier."
  truncatedBadge: "Téléchargement incomplet"
  truncatedSizeBadge: "Incomplet - fin manquante ~{{size}}"
  damagedBadge: "Endommagé ~{{size}}"
  truncatedHint: "Ce fichier est un téléchargement incomplet : ses derniers octets ne sont jamais arrivés et aucun outil ne peut les recréer - il se lit normalement jusqu'à la coupure, puis s'arrête. Re-télécharge la source pour une copie complète ; aucune réparation ne s'applique, donc aucune n'est proposée."
  wrongContainerBadge: "Mauvais conteneur"
  wrongContainerHint: "Ce .mkv est en réalité un fichier MP4/MOV : il n'a pas d'index Matroska à construire. La réparation le renomme en .mp4 et met à jour la bibliothèque."
  brokenInterleaveBadge: "Pistes rangées par blocs"
  brokenInterleaveHint: "Les pistes sont rangées par blocs de plusieurs minutes (la vidéo seule, puis l'audio seul) au lieu d'être entrelacées - un horodatage recule de {{sec}}s entre deux points du fichier. Tous les en-têtes sont sains et tous les flux se décodent, mais aucun lecteur séquentiel ne dépasse le premier bloc : la lecture directe se fige et ffmpeg attend des minutes son premier segment audio. Seul l'empaqueteur (streaming sans conversion) le sert, en relisant environ deux fois le fichier et un bloc entier à chaque saut. Le bouton Ré-entrelacer le réécrit sans perte (l'original est gardé en sauvegarde) ; une simple copie de flux ailleurs reproduit le défaut."
  unreadableBadge: "Illisible"
  unreadableHint: "L'analyse n'a pas pu diagnostiquer ce fichier : absent ou illisible sur le disque, ou conteneur refusé par l'analyseur. Aucune réparation possible d'ici - vérifie le montage ou ré-acquiers la source. Détail : {{detail}}"
  trailingJunkBadge: "Octets excédentaires"
  trailingJunkHint: "Des octets superflus subsistent APRÈS la fin déclarée du Segment - le média est complet et lisible. Rien à faire : une réécriture pour une autre réparation les supprime au passage."
  statsAudioShort: "Audio écourté"
  audioShortBadge: "Audio -{{sec}}s"
  audioShortHint: "Une piste audio s'arrête {{sec}}s avant la vidéo (générique muet sur cette piste). Le fichier est sain par ailleurs et la lecture comble la fin manquante en silence. La mesure se fait par rapport à la fin réelle de l'image, pas à la durée déclarée du conteneur - une durée sur-déclarée n'est donc jamais mise sur le dos de l'audio. Aucune réparation possible : cet audio n'est simplement pas dans le fichier ; re-télécharger la source pour un vrai correctif."
  statsSeekCoarse: "Recherche imprécise"
  seekCoarseBadge: "Recherche imprécise"
  seekCoarseHint: "L'index a été reconstruit et un trou subsiste : {{detail}}. Une recherche DANS ce trou atterrit à son bord ; partout ailleurs elle est exacte. Mesuré en réel, le trou est le plus souvent le générique de fin (aucune image-clé après la dernière), qu'aucun index ne peut combler et qui ne gêne personne. Un trou en milieu de film vient des images-clés de l'encodage lui-même - seule une meilleure source y remédie."
  repair: "Réparer"
  repairHint: "Reconstruit l'index de lecture. Sûr par construction : réécriture vers une copie temporaire, re-validation complète (pistes, durée, index réellement présent), puis bascule par rename atomique - l'original est conservé en .mkvgobak restaurable, et tout contrôle en échec refuse la bascule et laisse le fichier intact."
  repairResync: "Réparer (resync)"
  repairResyncHint: "Pour un fichier refusé par la réparation normale (zone corrompue) : la réécriture tolérante saute la zone endommagée et se resynchronise - tout ce qui précède et suit est récupéré, seuls les octets endommagés sont perdus. Conserve toujours une sauvegarde."
  resyncRequiredBadge: "Corruption trouvée à la réparation"
  resyncRequiredHint: "La réparation normale a parcouru ce fichier et son flux ne se relit pas : une zone corrompue que l'analyse, qui ne lit que l'en-tête, ne pouvait pas voir. Seule la resynchronisation en vient à bout - elle saute la zone et perd ces octets pour de bon, en gardant toujours l'original en sauvegarde. La quantité perdue n'est pas connue à l'avance ici."
  resyncRequiredNote: "Dont {{count}} refusé(s) par la réparation normale : leur corruption n'a été trouvée qu'en les réécrivant, la quantité perdue n'est donc pas comprise dans le chiffre ci-dessus."
