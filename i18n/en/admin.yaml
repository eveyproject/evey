  statusIndexed: Indexed
  statusMissing: Missing
  backupBadge: Backup
  jobPurge: "Backup purge"
  purgeAll: "Delete backups ({{count}})"
  purgeAllConfirmTitle: "Delete all backups?"
  purgeAllConfirm_one: "Permanently delete {{count}} backup file (.mkvgobak)? Roll back first if a repaired file misbehaves - after this there is no undo."
  purgeAllConfirm_other: "Permanently delete {{count}} backup files (.mkvgobak)? Roll back first if a repaired file misbehaves - after this there is no undo."
  purgeStarted: "Backup purge started"
  deleteBackup: "Delete backup"
  backupDeleted: "Backup deleted"
  audioDelayBadge: "Audio +{{sec}}s"
  audioOffsetBadge: "Audio at +{{sec}}s"
  audioOffsetHint: "An audio track starts after the picture. That is how a dub is lined up with a cut, and every player follows it - nothing to fix here."
  audioOffsetProvenHint: "An audio track starts after the picture, and this file's own tracks were compared and agree: the offset is deliberate. Nothing to do."
  audioTracksDisagreeBadge: "Audio tracks {{sec}}s apart"
  audioTracksDisagreeHint: "This file's audio tracks were compared and drift {{sec}}s apart, so one of them sits in the wrong place. Nothing here can tell which, so nothing is changed automatically: play both and keep the good one, or re-acquire the file."
  audioTrackZeroedBadge: "Audio track pulled to 0"
  audioTrackZeroedHint: "One audio track of this file starts exactly on the picture while another keeps its small original offset. That is the mark an earlier audio repair leaves when it pulls a track back by its own declared delay. If the dub plays early, the amount removed is no longer in the file and nothing here can put it back automatically: listen, correct it by hand, or re-acquire the file."
  truncatedBadge: "Incomplete download"
  truncatedSizeBadge: "Incomplete - missing tail ~{{size}}"
  damagedBadge: "Damaged ~{{size}}"
  truncatedHint: "This file is an incomplete download: its last bytes never arrived and no tool can recover them - it plays fine up to the cut, then stops. Re-acquire the source for a complete copy; no repair applies, so none is offered."
  wrongContainerBadge: "Wrong container"
  wrongContainerHint: "This .mkv is really an MP4/MOV file: there is no Matroska index to build. Repair renames it to .mp4 and updates the library."
  trailingJunkBadge: "Trailing bytes"
  trailingJunkHint: "Surplus bytes lie after the declared end of the Segment - the media is complete and plays fine. Nothing to do: a rewrite for another repair drops them in passing."
  statsAudioShort: "Audio ends early"
  audioShortBadge: "Audio -{{sec}}s"
  audioShortHint: "An audio track stops {{sec}}s before the video does (silent credits on that track). The file is otherwise healthy and playback fills the missing tail with silence. Measured against where the picture actually ends, not against the container's declared duration - so an over-stated duration is never blamed on the audio. No repair can help: the audio simply is not in the file; re-acquire the source for a real fix."
  statsSeekCoarse: "Coarse seeking"
  seekCoarseBadge: "Coarse seeking"
  seekCoarseHint: "The index was rebuilt and a hole remains: {{detail}}. A seek INTO that hole lands at its edge; everywhere else seeking is exact. Measured live, the hole is most often the final credits (no keyframe after the last one), which no index can fix and which matters to nobody. A hole in the middle of the film is the encode's own keyframes - a better source is the only cure."
  repair: Repair
  repairHint: "Rebuilds the seek index. Safe by construction: rewritten to a temp copy, fully re-validated (tracks, duration, real on-disk index), then swapped in with an atomic rename - the original is kept as a .mkvgobak you can roll back to, and any failed check refuses the swap and leaves the file untouched."
  repairResync: "Resync repair"
  repairResyncHint: "For a file a normal repair refused (corrupted region): the tolerant rewrite skips the damaged span and resynchronises - everything before and after is recovered, only the damaged bytes are lost. Always keeps a backup."
