markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # The default slugifier strips non-ASCII, so every Chinese and Hindi
      # heading collapses to an empty or numbered anchor: unusable permalinks,
      # a table of contents that cannot be linked into, and cross-page anchors
      # that land on the wrong section. The unicode slugifier keeps the
      # characters. ASCII headings slug exactly as before, so English, French,
      # German and Spanish anchors do not move.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # A link to a heading that does not exist is only an INFO by default, so
  # --strict waves it through. It is exactly the breakage translation produces:
  # translate a heading and every anchor pointing at it dies silently.
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Evey-project

