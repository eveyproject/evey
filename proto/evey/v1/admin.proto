syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "evey/v1/transcoding.proto";

option go_package = "github.com/gravity/evey/gen/evey/v1;eveyv1";

service AdminService {
  rpc GetSystemInfo(GetSystemInfoRequest) returns (SystemInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/system"
    };
  }

  rpc GetSetupStatus(GetSetupStatusRequest) returns (SetupStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/setup/status"
    };
  }

  rpc GetServerConfig(GetServerConfigRequest) returns (ServerConfig) {
    option (google.api.http) = {
      get: "/api/v1/admin/config"
    };
  }

  rpc UpdateServerConfig(UpdateServerConfigRequest) returns (ServerConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/config"
      body: "*"
    };
  }

  rpc SetupWizard(SetupWizardRequest) returns (SetupWizardResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/setup"
      body: "*"
    };
  }

  rpc GetDashboard(GetDashboardRequest) returns (DashboardInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/dashboard"
    };
  }

  rpc ListScheduledTasks(ListScheduledTasksRequest) returns (ListScheduledTasksResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/tasks"
    };
  }

  rpc UpdateScheduledTask(UpdateScheduledTaskRequest) returns (ScheduledTask) {
    option (google.api.http) = {
      patch: "/api/v1/admin/tasks/{id}"
      body: "*"
    };
  }

  rpc RunScheduledTask(RunScheduledTaskRequest) returns (RunScheduledTaskResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tasks/{id}/run"
    };
  }

  rpc RefreshAllMetadata(RefreshAllMetadataRequest) returns (RefreshAllMetadataResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/refresh-metadata"
    };
  }

  rpc GenerateAllTrickplays(GenerateAllTrickplaysRequest) returns (GenerateAllTrickplaysResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/trickplay/generate-all"
    };
  }

  rpc DeleteMediaItem(DeleteMediaItemRequest) returns (DeleteMediaItemResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/media/{id}"
    };
  }

  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/audit-log"
    };
  }

  rpc ListPluginRuntimes(ListPluginRuntimesRequest) returns (ListPluginRuntimesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugin-runtimes"
    };
  }

  rpc AddPluginRuntime(AddPluginRuntimeRequest) returns (PluginRuntime) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugin-runtimes"
      body: "*"
    };
  }

  rpc RemovePluginRuntime(RemovePluginRuntimeRequest) returns (RemovePluginRuntimeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/plugin-runtimes/{id}"
    };
  }

  rpc InstallPlugin(InstallPluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/install"
      body: "*"
    };
  }

  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/plugins/{id}"
    };
  }

  rpc EnablePlugin(EnablePluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{id}/enable"
    };
  }

  rpc DisablePlugin(DisablePluginRequest) returns (Plugin) {
    option (google.api.http) = {
      post: "/api/v1/admin/plugins/{id}/disable"
    };
  }

  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins"
    };
  }

  rpc GetPluginConfig(GetPluginConfigRequest) returns (PluginConfig) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins/{plugin_id}/config"
    };
  }

  rpc UpdatePluginConfig(UpdatePluginConfigRequest) returns (PluginConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/plugins/{plugin_id}/config"
      body: "*"
    };
  }

  rpc GetPluginLogs(GetPluginLogsRequest) returns (GetPluginLogsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plugins/{plugin_id}/logs"
    };
  }

  rpc GetSystemStats(GetSystemStatsRequest) returns (SystemStats) {
    option (google.api.http) = {
      get: "/api/v1/admin/system/stats"
    };
  }

  rpc EnrichPeopleBios(EnrichPeopleBiosRequest) returns (EnrichPeopleBiosResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/metadata/enrich-people"
    };
  }

  rpc GetActiveSessions(GetActiveSessionsRequest) returns (GetActiveSessionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/sessions/active"
    };
  }

  rpc KillSession(KillSessionRequest) returns (KillSessionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/sessions/{session_id}"
    };
  }

  rpc GetUserBitrateLimit(GetUserBitrateLimitRequest) returns (GetUserBitrateLimitResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users/{user_id}/bitrate-limit"
    };
  }

  rpc SetUserBitrateLimit(SetUserBitrateLimitRequest) returns (SetUserBitrateLimitResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/users/{user_id}/bitrate-limit"
      body: "*"
    };
  }
}

message SystemInfo {
  string version = 1;
  string os = 2;
  string arch = 3;
  string ffmpeg_version = 4;
  repeated HWDevice hw_devices = 5;
  int64 uptime_seconds = 6;
  string go_version = 7;
  string server_id = 8;
  bool setup_complete = 9;
  bool password_recovery_enabled = 10;
  bool smtp_configured = 11;
}

message ServerConfig {
  map<string, string> values = 1;
}

message SetupWizardRequest {
  string admin_username = 1;
  string admin_password = 2;
  string admin_email = 3;
  string server_name = 4;
  string base_url = 5;
}

message SetupWizardResponse {
  string access_token = 1;
  string refresh_token = 2;
  string server_id = 3;
}

message DashboardInfo {
  int32 active_streams = 1;
  int32 active_transcodes = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  repeated StorageInfo storage = 5;
  int32 total_media_items = 6;
  int32 total_users = 7;
}

message StorageInfo {
  string path = 1;
  int64 total_bytes = 2;
  int64 used_bytes = 3;
  int64 free_bytes = 4;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_IDLE = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
}

message ScheduledTask {
  string id = 1;
  string name = 2;
  string description = 3;
  string cron_expression = 4;
  bool enabled = 5;
  TaskState state = 6;
  double progress_percent = 7;
  google.protobuf.Timestamp last_run_at = 8;
  google.protobuf.Timestamp next_run_at = 9;
  string last_error = 10;
}

message AuditLogEntry {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string action = 4;
  string resource_type = 5;
  string resource_id = 6;
  string details = 7;
  string ip_address = 8;
  google.protobuf.Timestamp created_at = 9;
}

message PluginRuntime {
  string id = 1;
  string name = 2;
  string language = 3;
  string version = 4;
  string binary_path = 5;
  bool available = 6;
}

message Plugin {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string author = 5;
  string language = 6;
  bool enabled = 7;
  PluginState state = 8;
  string entry_point = 9;
  google.protobuf.Timestamp installed_at = 10;
  repeated string permissions = 11;
  repeated string capabilities = 12;
  string source_hash = 13;
}

enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_INSTALLED = 1;
  PLUGIN_STATE_RUNNING = 2;
  PLUGIN_STATE_STOPPED = 3;
  PLUGIN_STATE_ERROR = 4;
  PLUGIN_STATE_INITIALIZING = 5;
}

message PluginConfig {
  string plugin_id = 1;
  map<string, string> values = 2;
  string config_schema_json = 3;
}

message PluginLogEntry {
  string level = 1;
  string message = 2;
  map<string, string> fields = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message GetSystemInfoRequest {}

message GetSetupStatusRequest {}

message SetupStatusResponse {
  bool setup_complete = 1;
}

message GetServerConfigRequest {}

message UpdateServerConfigRequest {
  map<string, string> values = 1;
}

message GetDashboardRequest {}

message ListScheduledTasksRequest {}

message ListScheduledTasksResponse {
  repeated ScheduledTask tasks = 1;
}

message UpdateScheduledTaskRequest {
  string id = 1;
  optional string cron_expression = 2;
  optional bool enabled = 3;
}

message RunScheduledTaskRequest {
  string id = 1;
}

message RunScheduledTaskResponse {}

message RefreshAllMetadataRequest {}

message RefreshAllMetadataResponse {
  int32 refreshed = 1;
}

message GenerateAllTrickplaysRequest {}

message GenerateAllTrickplaysResponse {
  int32 generated = 1;
}

message DeleteMediaItemRequest {
  string id = 1;
}

message DeleteMediaItemResponse {}

message GetAuditLogRequest {
  string user_id = 1;
  string action = 2;
  string resource_type = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message GetAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total = 2;
}

message ListPluginRuntimesRequest {}

message ListPluginRuntimesResponse {
  repeated PluginRuntime runtimes = 1;
}

message AddPluginRuntimeRequest {
  string name = 1;
  string language = 2;
  string version = 3;
  string binary_path = 4;
}

message RemovePluginRuntimeRequest {
  string id = 1;
}

message RemovePluginRuntimeResponse {}

message InstallPluginRequest {
  string source = 1;
  string name = 2;
}

message UninstallPluginRequest {
  string id = 1;
}

message UninstallPluginResponse {}

message EnablePluginRequest {
  string id = 1;
}

message DisablePluginRequest {
  string id = 1;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

message GetPluginConfigRequest {
  string plugin_id = 1;
}

message UpdatePluginConfigRequest {
  string plugin_id = 1;
  map<string, string> values = 2;
}

message GetPluginLogsRequest {
  string plugin_id = 1;
  string level = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetPluginLogsResponse {
  repeated PluginLogEntry entries = 1;
  int32 total = 2;
}

// --- System stats ---

message GetSystemStatsRequest {}

message SystemStats {
  int32 goroutines = 1;
  uint64 mem_alloc_bytes = 2;
  uint64 mem_sys_bytes = 3;
  uint32 num_gc = 4;
  int64 uptime_seconds = 5;
  string go_version = 6;
  string os = 7;
  string arch = 8;
  int32 num_cpu = 9;
}

// --- Enrich people bios ---

message EnrichPeopleBiosRequest {}

message EnrichPeopleBiosResponse {
  string message = 1;
}

// --- Active sessions ---

message GetActiveSessionsRequest {}

message ActiveSession {
  string session_id = 1;
  string profile_name = 2;
  string media_title = 3;
  string media_type = 4;
  string media_item_id = 5;
  double progress = 6;
  int64 duration_ms = 7;
  int64 position_ms = 8;
  google.protobuf.Timestamp started_at = 9;
  string device_name = 10;
  string device_type = 11;
  string client_ip = 12;
  string play_method = 13;
  string video_codec = 14;
  string audio_codec = 15;
  string resolution = 16;
  int64 bandwidth_bps = 17;
  optional string transcode_info = 18;
}

message GetActiveSessionsResponse {
  repeated ActiveSession sessions = 1;
}

message KillSessionRequest {
  string session_id = 1;
}

message KillSessionResponse {}

// --- User bitrate limit ---

message GetUserBitrateLimitRequest {
  string user_id = 1;
}

message GetUserBitrateLimitResponse {
  int32 max_bitrate_kbps = 1;
}

message SetUserBitrateLimitRequest {
  string user_id = 1;
  int32 max_bitrate_kbps = 2;
}

message SetUserBitrateLimitResponse {
  int32 max_bitrate_kbps = 1;
}
