server {
    listen 443 ssl http2;
    server_name media.example.com;

    ssl_certificate     /etc/ssl/certs/media.example.com.pem;
    ssl_certificate_key /etc/ssl/private/media.example.com.key;

    client_max_body_size 100M;

    # Streaming - no buffering, no timeout
    location ~ ^/api/v1/media/.+/(transcode|hls|stream) {
        proxy_pass http://evey:9091;
        proxy_buffering off;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/libraries/.+/scan {
        proxy_pass http://evey:9091;
        proxy_buffering off;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (SyncPlay)
    location /api/v1/syncplay/ {
        proxy_pass http://evey:9091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://evey:9091;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else - the Evey server serves BOTH the API and the web UI on
    # :9091, so proxy the SPA to the backend too. There is no separate frontend
    # to build or deploy on disk.
    location / {
        proxy_pass http://evey:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
