syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gravity/evey/gen/evey/v1;eveyv1";

service CollectionService {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/collections"
    };
  }

  rpc GetCollection(GetCollectionRequest) returns (Collection) {
    option (google.api.http) = {
      get: "/api/v1/collections/{id}"
    };
  }

  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse) {
    option (google.api.http) = {
      post: "/api/v1/collections"
      body: "*"
    };
  }

  rpc UpdateCollection(UpdateCollectionRequest) returns (Collection) {
    option (google.api.http) = {
      put: "/api/v1/collections/{id}"
      body: "*"
    };
  }

  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/collections/{id}"
    };
  }
}

enum CollectionType {
  COLLECTION_TYPE_UNSPECIFIED = 0;
  COLLECTION_TYPE_SMART = 1;
  COLLECTION_TYPE_MANUAL = 2;
}

message CollectionRule {
  string field = 1;
  string operator = 2;
  string value = 3;
}

message Collection {
  string id = 1;
  string name = 2;
  string overview = 3;
  CollectionType type = 4;
  repeated CollectionRule rules = 5;
  string sort_by = 6;
  string sort_order = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

message GetCollectionRequest {
  string id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message CreateCollectionRequest {
  string name = 1;
  string overview = 2;
  CollectionType type = 3;
  repeated CollectionRule rules = 4;
  string sort_by = 5;
  string sort_order = 6;
}

message CreateCollectionResponse {
  string id = 1;
}

message UpdateCollectionRequest {
  string id = 1;
  string name = 2;
  string overview = 3;
  CollectionType type = 4;
  repeated CollectionRule rules = 5;
  string sort_by = 6;
  string sort_order = 7;
}

message DeleteCollectionRequest {
  string id = 1;
}

message DeleteCollectionResponse {}
