markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # The default slugifier strips non-ASCII, so every Chinese and Hindi
      # heading collapses to an empty or numbered anchor: unusable permalinks,
      # a table of contents that cannot be linked into, and cross-page anchors
      # that land on the wrong section. The unicode slugifier keeps the
      # characters. ASCII headings slug exactly as before, so English, French,
      # German and Spanish anchors do not move.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # A link to a heading that does not exist is only an INFO by default, so
  # --strict waves it through. It is exactly the breakage translation produces:
  # translate a heading and every anchor pointing at it dies silently.
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Evey-project

# ── The manifest ──────────────────────────────────────────────────────────────
# Paths resolve against wiki/content/ first, then docs/. Two parts: Discover is
# for someone deciding whether Evey is for them, the Technical guide for someone
# running it. Contributor documents (decision records, codebase map, code
# conventions, frontend design system) stay in the repository, linked from
# contributing.md: the person who lands here is choosing or running a server,
# not reading an ADR.
nav:
  - Home: index.md
  - Discover:
      - Why Evey: philosophy.md
      - What you get: discover/features.md
      - On every screen: discover/apps.md
  - Technical guide:
      - Setup:
          - Installation: installation.md
          - First steps: guide/first-steps.md
          - Configuration: configuration.md
          - Reverse proxy: reverse-proxy.md
          - Bare metal deployment: deployment-bare-metal.md
          - Backups: backups.md
      - Settings:
          - Viewer settings: guide/viewer-settings.md
          - Administration: guide/admin-settings.md
          - Transcoding and hardware: transcoding.md
          - Single sign-on (OIDC): oidc.md
          - Notifications: notifications.md
          - Languages and accessibility: i18n-accessibility.md
      - Operations:
          - runbooks/index.md
          - Command line: runbooks/cli.md
          - Media health: runbooks/media-health.md
          - Recovery: runbooks/recovery.md
          - Migrations: runbooks/migration-runbook.md
          - Incidents: runbooks/incident-runbook.md
          - Releases: runbooks/release.md
      - Extending:
          - Plugins: plugins.md
          - Plugin API reference: plugins/api-reference.md
          - Plugin developer setup: plugins/dev-setup.md
          - Plugin sandbox deployment: plugins/sandbox-deployment.md
          - Plugin permissions and slots: plugins/security-model.md
          - Theme API reference: themes/api-reference.md
          - Theme security model: themes/security-model.md
      - Under the hood:
          - How playback works: playback-serving.md
          - Architecture: ARCHITECTURE.md
          - Plugin sandbox and threat model: SECURITY.md
          - Server API:
              - Overview: api/README.md
              - Public API: api/public/README.md
              - Admin API: api/admin/README.md
              - Plugin API: api/plugins/README.md
          - Contributing: contributing.md
