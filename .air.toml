root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/evey ./cmd/evey"
  bin = "./tmp/evey"
  full_bin = "./tmp/evey"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "frontend", "gen", "docker", "internal/adapters/driven/postgres/migrations"]
  delay = 500
  kill_delay = 500
  rerun = false

[log]
  main_only = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
