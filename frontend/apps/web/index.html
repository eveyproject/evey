<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Evey</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon-180.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta property="og:title" content="Evey" />
    <meta property="og:description" content="Self-hosted media server for movies, TV shows, music, and photos." />
    <meta property="og:image" content="/social/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social/og-image.png" />
    <!-- Loaded normally, NOT with the media="print" + onload="this.media='all'"
         trick: that inline event handler is a CSP violation (script-src-attr),
         so under any policy without 'unsafe-inline' the stylesheet stayed
         media="print" and the theme never applied. It is a small same-origin
         file - the render-blocking cost is negligible next to a broken theme. -->
    <link id="theme-link" rel="stylesheet" href="/themes/default.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
