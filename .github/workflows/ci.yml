name: CI

on:
  push:
    branches:
      - main
      - master
      # Beta/alpha branches publish their own tag; `latest` stays on semver tags.
      - 'beta-*'
      - 'alpha-*'
    # Release tags also trigger publish (vX.Y.Z → latest alias + semver tags).
    tags: ['v*.*.*']
    # Docs/wiki-only pushes change nothing the jobs test or ship.
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  # Manual run, mainly to force the arm64 half of the image without a tag.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Image platforms to build (buildx list)'
        required: false
        default: 'linux/amd64,linux/arm64'

# Only the newest push of a branch is worth finishing; tag builds are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege by default; the docker job widens it for ghcr only.
# pull-requests: read lets golangci-lint compute only-new-issues on a PR.
permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # One job: split in two, the setup was paid twice for no wall-clock gain.
  backend:
    name: Backend - quality, build & test
    # fetch-depth: 0 below - the proto breaking-change check diffs against the pre-push SHA.
    # Self-hosted disabled; restore this ternary to keep fork PRs on GitHub-hosted (RCE guard):
    # runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto
        run: buf generate

      - name: check proto breaking changes
        # Diff against the target tip, not HEAD~1 (silently passes on multi-commit pushes).
        # A push targets the pre-push SHA: the contract in play is what clients run now; a first push has no `before`.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            against="https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch, no previous tip to compare against - skipping"
            exit 0
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            # master ships: diff against the last release, the contract clients actually run.
            last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [ -z "${last_tag}" ]; then
              echo "no release tag yet - nothing shipped to break - skipping"
              exit 0
            fi
            against=".git#tag=${last_tag}"
          else
            before="${{ github.event.before }}"
            # A force-push leaves `before` missing from this clone; buf would fail on a missing tree, not on a break.
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "previous tip ${before} is gone (history rewritten) - skipping"
              exit 0
            fi
            against=".git#ref=${before}"
          fi
          echo "buf breaking against: ${against}"
          buf breaking --against "${against}"

      - name: vet
        run: go vet $(go list ./... | grep -v /gen/)

      # Pinned and version-checked, not just existence-checked, so a bump is not masked by a stale binary.
      # v1.7.0 is the floor that parses Go 1.27 syntax.
      - name: govulncheck
        run: |
          VULN_VERSION=v1.7.0
          BIN="$(go env GOPATH)/bin/govulncheck"
          "$BIN" -version 2>/dev/null | grep -q "${VULN_VERSION#v}" || go install golang.org/x/vuln/cmd/govulncheck@${VULN_VERSION}
          "$BIN" ./cmd/... ./internal/...

      # Ratchet: only issues introduced by the push/PR diff fail; skipped on tags (no diff base).
      - name: lint (golangci-lint, new issues only)
        # A branch's first push has no `before`: the action 404s on the compare.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.event.before != '0000000000000000000000000000000000000000')
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.14.0
          only-new-issues: true

      # Curated high-signal gosec rules (.golangci.gosec.yml), same ratchet.
      - name: gosec security scan (curated, new issues only)
        # A branch's first push has no `before`: the action 404s on the compare.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.event.before != '0000000000000000000000000000000000000000')
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.14.0
          only-new-issues: true
          skip-save-cache: true
          args: --config=.golangci.gosec.yml

      - name: build
        run: go build ./...

      # -race kept: many goroutines. -timeout is per package; the ffmpeg calibration benchmarks need the headroom.
      - name: test (unit)
        run: |
          go test \
            $(go list ./... | grep -v "adapters/driven/postgres" | grep -v /gen/) \
            -count=1 -timeout=600s -race

      # Serialised through a shared testcontainer; no -race here (little signal), re-run nightly (nightly-race.yml).
      # 600s so organic suite growth does not trip a false hang.
      - name: test (postgres - testcontainers)
        run: go test ./internal/adapters/driven/postgres/... -count=1 -timeout=600s

  frontend:
    name: Frontend - typecheck, test & build
    # Self-hosted disabled; restore this ternary to keep fork PRs on GitHub-hosted (RCE guard):
    # runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || 'self-hosted' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: enable corepack
        run: corepack enable

      - name: install pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: "1.68.2"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: generate proto (swagger)
        run: buf generate

      - name: install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: generate api client
        working-directory: frontend
        run: pnpm --filter @evey/api run generate

      - name: typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: lint
        working-directory: frontend
        run: pnpm run lint

      # All vitest projects; the default is CPUs-1 workers, i.e. one on a 2-vCPU runner.
      # nproc is printed to show the count used.
      - name: unit tests
        working-directory: frontend
        run: |
          echo "nproc=$(nproc)"
          pnpm run test --maxWorkers="$(nproc)"

      - name: build
        working-directory: frontend
        run: pnpm run build

      - name: bundle budget
        run: sh scripts/bundle-budget.sh frontend/apps/web/dist

  # Resolves once what every leg and the merge job must agree on (platforms, timestamp, tags, labels),
  # so the amd64 and arm64 halves of one manifest do not differ.
  docker-plan:
    name: Docker - plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      date: ${{ steps.stamp.outputs.date }}
      full-tags: ${{ steps.meta-full.outputs.tags }}
      full-labels: ${{ steps.meta-full.outputs.labels }}
      full-version: ${{ steps.meta-full.outputs.version }}
      lean-tags: ${{ steps.meta-lean.outputs.tags }}
      lean-labels: ${{ steps.meta-lean.outputs.labels }}
      lean-version: ${{ steps.meta-lean.outputs.version }}
      nodejs-tags: ${{ steps.meta-nodejs.outputs.tags }}
      nodejs-labels: ${{ steps.meta-nodejs.outputs.labels }}
      nodejs-version: ${{ steps.meta-nodejs.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `latest` is gated on vX.Y.Z tags only: it always means the latest semver release.
      # The three variants share every layer but the runtimes: one leg builds full, then lean/nodejs from cache.
      # Branch pushes build full only (the variant prod runs); lean and nodejs ship on tags and manual runs.
      # The unsuffixed tag is the full image; flavor.suffix adds -lean / -nodejs.
      - name: Docker meta (lean)
        id: meta-lean
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/eveyproject/evey
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # `latest` = newest stable release only: a hyphenated pre-release never takes it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          flavor: |
            suffix=-lean,onlatest=true

      - name: Docker meta (nodejs)
        id: meta-nodejs
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/eveyproject/evey
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # `latest` = newest stable release only: a hyphenated pre-release never takes it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          flavor: |
            suffix=-nodejs,onlatest=true

      - name: Docker meta (full)
        id: meta-full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/eveyproject/evey
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # `latest` = newest stable release only: a hyphenated pre-release never takes it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          flavor: |
            suffix=,onlatest=true

      - name: Build timestamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Also emits the leg matrix: one leg per requested platform; only amd64 and arm64 have a runner.
      - name: Resolve build platforms
        id: platforms
        env:
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          if [[ -n "${DISPATCH_PLATFORMS}" ]]; then
            value="${DISPATCH_PLATFORMS}"
            echo "manual dispatch - building ${value}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            value="linux/amd64,linux/arm64"
            echo "release tag - building multi-arch amd64 + arm64"
          elif [[ "${HEAD_COMMIT_MSG}" == *"[arm64]"* ]]; then
            value="linux/amd64,linux/arm64"
            echo "commit message carries [arm64] - building multi-arch"
          else
            value="linux/amd64"
            echo "branch push - building amd64 only (tag or [arm64] to get both)"
          fi
          legs=()
          if [[ ",${value}," == *",linux/amd64,"* ]]; then
            legs+=('{"platform":"linux/amd64"}')
          fi
          if [[ ",${value}," == *",linux/arm64,"* ]]; then
            legs+=('{"platform":"linux/arm64"}')
          fi
          [ "${#legs[@]}" -gt 0 ] || { echo "::error::no buildable platform (amd64, arm64) in: ${value}"; exit 1; }
          {
            echo "value=${value}"
            echo "matrix={\"include\":[$(IFS=,; echo "${legs[*]}")]}"
          } >> "$GITHUB_OUTPUT"

  # One leg per platform, pushed BY DIGEST (no tag): legs start alongside backend/frontend, `docker` merges and tags only after both pass.
  # ubuntu-24.04-arm is public-repo only: arm64 is native there, QEMU-emulated while the repo is private.
  docker-build:
    name: Docker - build (${{ matrix.platform }})
    needs: [docker-plan]
    # arm64 goes native only when the repo is public.
    runs-on: ${{ matrix.platform == 'linux/arm64' && github.event.repository.private == false && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docker-plan.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Emulation only for arm64 on an amd64 runner (private repo).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform == 'linux/arm64' && github.event.repository.private != false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Artifact and cache names cannot carry a slash.
      - name: Platform pair
        id: pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "value=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retried once: Docker Hub's auth endpoint sometimes resets the connection before the build starts; the action has no retry input.
      # COMMIT/BUILD_DATE stamp the binary: VERSION alone is a branch name.
      # Cache scope per platform, exported by the full build only (mode=max already holds the shared layers).
      # ignore-error: a cache-service hiccup must not red-fail a build that already shipped.
      - name: Build and push by digest (full)
        id: build-full
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-plan.outputs.full-labels }}
          build-args: |
            VERSION=${{ needs.docker-plan.outputs.full-version }}
            RUNTIMES=full
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.docker-plan.outputs.date }}
            IMAGE_REPO=docker.io/eveyproject/evey
          cache-from: type=gha,scope=docker-${{ steps.pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.pair.outputs.value }},ignore-error=true
          outputs: type=image,name=docker.io/eveyproject/evey,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true

      - name: Build and push by digest (full, retry)
        id: build-full-retry
        if: steps.build-full.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-plan.outputs.full-labels }}
          build-args: |
            VERSION=${{ needs.docker-plan.outputs.full-version }}
            RUNTIMES=full
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.docker-plan.outputs.date }}
            IMAGE_REPO=docker.io/eveyproject/evey
          cache-from: type=gha,scope=docker-${{ steps.pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.pair.outputs.value }},ignore-error=true
          outputs: type=image,name=docker.io/eveyproject/evey,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true

      # Digests travel as empty files named <variant>-<hash>.
      - name: Record the full digest
        env:
          DIGEST: ${{ steps.build-full.outputs.digest || steps.build-full-retry.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "::error::the full build produced no digest"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/full-${DIGEST#sha256:}"

      # lean/nodejs ride in the same leg after full (shared layers hit the local cache); tagged only once full has booted.
      - name: Build and push by digest (lean)
        id: build-lean
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-plan.outputs.lean-labels }}
          build-args: |
            VERSION=${{ needs.docker-plan.outputs.lean-version }}
            RUNTIMES=lean
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.docker-plan.outputs.date }}
            IMAGE_REPO=docker.io/eveyproject/evey
          cache-from: type=gha,scope=docker-${{ steps.pair.outputs.value }}
          outputs: type=image,name=docker.io/eveyproject/evey,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true

      - name: Build and push by digest (nodejs)
        id: build-nodejs
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-plan.outputs.nodejs-labels }}
          build-args: |
            VERSION=${{ needs.docker-plan.outputs.nodejs-version }}
            RUNTIMES=nodejs
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.docker-plan.outputs.date }}
            IMAGE_REPO=docker.io/eveyproject/evey
          cache-from: type=gha,scope=docker-${{ steps.pair.outputs.value }}
          outputs: type=image,name=docker.io/eveyproject/evey,push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true

      - name: Record the lean and nodejs digests
        if: steps.build-lean.outcome == 'success' && steps.build-nodejs.outcome == 'success'
        env:
          LEAN: ${{ steps.build-lean.outputs.digest }}
          NODEJS: ${{ steps.build-nodejs.outputs.digest }}
        run: |
          set -eu
          touch "/tmp/digests/lean-${LEAN#sha256:}" "/tmp/digests/nodejs-${NODEJS#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ steps.pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merges the legs' digests, boots the result, then points moving tags at it; waits for backend AND frontend.
  docker:
    name: Docker - merge & push
    runs-on: ubuntu-latest  # GitHub-hosted
    # runs-on: self-hosted  # re-enable to switch back to the self-hosted workers
    needs: [backend, frontend, docker-plan, docker-build]
    # Never on PRs; backend/frontend gate this so a failing test blocks the image.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Lowercase owner (ghcr requires lowercase)
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # The build pushed no tag: sha-<short> is created here and boot-tested; moving tags follow only once it boots.
      - name: Pick the immutable tag
        id: immutable
        env:
          TAGS_FULL: ${{ needs.docker-plan.outputs.full-tags }}
        run: |
          set -eu
          tag=$(printf '%s\n' "$TAGS_FULL" | grep ':sha-' | head -1)
          [ -n "$tag" ] || { echo "::error::no sha- tag in: $TAGS_FULL"; exit 1; }
          echo "full=${tag}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the immutable manifest list (full)
        id: merge-full
        env:
          IMG: ${{ steps.immutable.outputs.full }}
        run: |
          set -eu
          refs=$(for f in /tmp/digests/full-*; do echo "docker.io/eveyproject/evey@sha256:${f##*/full-}"; done)
          echo "$IMG <- $refs"
          # shellcheck disable=SC2086 # one ref per word, none contains a space
          docker buildx imagetools create -t "$IMG" $refs
          docker buildx imagetools inspect "$IMG"

      # Boot the assembled image through the real scenarios (tests/ops): the gate never runs the image.
      - name: Operations harness (boot the built image)
        id: ops
        if: steps.merge-full.outcome == 'success'
        env:
          IMG: ${{ steps.immutable.outputs.full }}
        run: |
          set -eu
          echo "ops harness against $IMG"
          docker pull "$IMG"
          make ops OPS_IMG="$IMG"

      # Booted: the moving tags are manifest copies of it.
      - name: Promote the booted image to its moving tags
        if: steps.ops.outcome == 'success'
        env:
          TAGS_FULL: ${{ needs.docker-plan.outputs.full-tags }}
          IMG: ${{ steps.immutable.outputs.full }}
        run: |
          set -eu
          printf '%s\n' "$TAGS_FULL" | while read -r t; do
            [ -z "$t" ] || [ "$t" = "$IMG" ] && continue
            echo "promote $IMG -> $t"
            docker buildx imagetools create -t "$t" "$IMG"
          done

      # Built next to full, tagged only once full has booted.
      - name: Publish the lean manifest list
        id: build-lean
        if: steps.ops.outcome == 'success' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        env:
          TAGS: ${{ needs.docker-plan.outputs.lean-tags }}
        run: |
          set -eu
          targs=$(printf '%s\n' "$TAGS" | while read -r t; do [ -z "$t" ] || printf -- '-t %s ' "$t"; done)
          refs=$(for f in /tmp/digests/lean-*; do echo "docker.io/eveyproject/evey@sha256:${f##*/lean-}"; done)
          # shellcheck disable=SC2086 # words are tags and refs, none contains a space
          docker buildx imagetools create $targs $refs

      - name: Publish the nodejs manifest list
        id: build-nodejs
        if: steps.ops.outcome == 'success' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        env:
          TAGS: ${{ needs.docker-plan.outputs.nodejs-tags }}
        run: |
          set -eu
          targs=$(printf '%s\n' "$TAGS" | while read -r t; do [ -z "$t" ] || printf -- '-t %s ' "$t"; done)
          refs=$(for f in /tmp/digests/nodejs-*; do echo "docker.io/eveyproject/evey@sha256:${f##*/nodejs-}"; done)
          # shellcheck disable=SC2086 # words are tags and refs, none contains a space
          docker buildx imagetools create $targs $refs

      # GHCR is a best-effort mirror: a refusal must not fail a run already shipped to Docker Hub.
      - name: Mirror tags to GHCR (best effort)
        if: steps.ops.outcome == 'success'
        continue-on-error: true
        env:
          GHCR_IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/evey
          TAGS_FULL: ${{ needs.docker-plan.outputs.full-tags }}
          TAGS_LEAN: ${{ steps.build-lean.outcome == 'success' && needs.docker-plan.outputs.lean-tags || '' }}
          TAGS_NODEJS: ${{ steps.build-nodejs.outcome == 'success' && needs.docker-plan.outputs.nodejs-tags || '' }}
        run: |
          set -eu
          printf '%s\n%s\n%s\n' "$TAGS_FULL" "$TAGS_LEAN" "$TAGS_NODEJS" | while read -r src; do
            [ -z "$src" ] && continue
            dst="${GHCR_IMAGE}:${src##*:}"
            echo "mirror $src -> $dst"
            docker buildx imagetools create -t "$dst" "$src"
          done

      # Best-effort: the image is the deliverable, the page copy is not.
      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: eveyproject/evey
          short-description: "Self-hosted media server. One container, hardware transcoding included, sandboxed plugins."
          readme-filepath: ./docs/dockerhub.md
          enable-url-completion: false


  # Single required check for branch protection; tolerates `docker` being skipped on PRs.
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest  # GitHub-hosted
    # runs-on: self-hosted  # re-enable to switch back to the self-hosted workers
    needs: [backend, frontend, docker-plan, docker-build, docker]
    if: always()
    steps:
      - name: verify required jobs
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER_PLAN: ${{ needs.docker-plan.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -e
          fail=0
          for kv in "backend=$BACKEND" "frontend=$FRONTEND" "docker-plan=$DOCKER_PLAN" "docker-build=$DOCKER_BUILD" "docker=$DOCKER"; do
            name="${kv%%=*}"
            result="${kv#*=}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Required job '$name' did not pass (result: $result)"
              fail=1
            else
              echo "OK: $name -> $result"
            fi
          done
          exit $fail
