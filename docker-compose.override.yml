# Dev overrides — automatically merged by docker compose
# Prod servers: don't include this file, or use: docker compose -f docker-compose.yml up -d
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Standalone Meilisearch container for dev — easier to attach the Meili
  # UI / curl directly on :7700 than to tunnel into the evey container.
  # Prod runs Meili embedded inside evey (see entrypoint.sh + base compose).
  meilisearch:
    container_name: evey-meilisearch
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - ./meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailcatcher:
    container_name: evey-mailcatcher
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"
    expose:
      - "1025"
    restart: unless-stopped

  # Override evey: local build with Air hot-reload instead of registry image
  evey:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: evey-dev
    deploy: {}
    env_file: .env.dev
    environment:
      EVEY_LOG_DEV_MODE: "true"
      EVEY_LOG_LEVEL: debug
      EVEY_RATELIMIT_LOGIN_MAX: "1000"
      EVEY_RATELIMIT_GLOBAL_MAX: "10000"
      # Dev points at the standalone meili container above, NOT the embedded
      # one in the evey image — keeps Meili UI accessible on :7700 and lets
      # `docker compose restart meilisearch` reset just the index without
      # restarting the app.
      EVEY_EMBEDDED_MEILI: "false"
      EVEY_MEILI_URL: http://meilisearch:7700
      # MEILI_MASTER_KEY is already inherited from the project .env file.
    # bwrap needs CAP_SYS_ADMIN to create user/pid/net namespaces. Docker
    # drops it by default (kernel.unprivileged_userns_clone=0 inside the
    # container), so plugin sandbox setup fails with "No permissions to
    # creating new namespace". Granting the cap restores plugin runtime in
    # dev. Production deploys should use the default unprivileged user
    # namespace path (host sysctl=1).
    volumes:
      - .:/app
      - ./evey-data:/data
      - ./plugins:/data/plugins
      - evey-cache:/cache
      - /path/to/movies:/media
      - /path/to/series:/media2
      - /path/to/photos:/media3
      - /path/to/music:/media4
    healthcheck:
      start_period: 60s
      retries: 10
    # Override base depends_on so the dev evey waits on the standalone meili
    # container too (base only depends on postgres now that prod ships meili
    # embedded inside the image).
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Hardware-accelerated transcode test container (NVENC, glibc runtime).
  # Opt-in dev variant: builds the runtime-nvidia image target, runs with the
  # GPU injected (Docker Desktop / nvidia-container-toolkit), and turns the HW
  # transcode flag ON. The default Air `evey` service (Alpine) stays
  # software-only and untouched. Reach this instance on :9092.
  #   docker compose up -d --build evey-hw
  # Verify HW kicked in:
  #   docker compose logs evey-hw | grep -i 'benchmark.*hardware\|hw_backend'
  #   nvidia-smi   # an ffmpeg process appears while a media transcodes
  evey-hw:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-nvidia
      args:
        VERSION: hw-dev
    image: evey-hw
    container_name: evey-hw
    env_file: .env.dev
    environment:
      EVEY_TRANSCODING_HW_ACCEL_ENABLED: "true"
      EVEY_DB_HOST: postgres
      EVEY_EMBEDDED_MEILI: "false"
      EVEY_MEILI_URL: http://meilisearch:7700
      EVEY_HTTP_PORT: "9091"
      EVEY_JWT_PRIVATE_KEY_PATH: /data/jwt.key
      EVEY_TRANSCODING_CACHE_DIR: /cache/transcode
      EVEY_TRICKPLAY_CACHE_DIR: /data/trickplay
      EVEY_LOG_DIR: /data/logs
      EVEY_BACKUP_DIR: /data/backups
      EVEY_LOG_LEVEL: debug
      # Dev mode relaxes the production config validation (default DB password,
      # etc.) exactly like the Air `evey` service above — this is a local HW
      # test box, not a deployment.
      EVEY_LOG_DEV_MODE: "true"
      EVEY_PLUGINS_COSIGN_POLICY: "off"
    ports:
      - "9092:9091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - evey-hw-data:/data
      - evey-hw-cache:/cache
      - /path/to/movies:/media
      - /path/to/series:/media2
      - /path/to/photos:/media3
      - /path/to/music:/media4
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: "no"

  # Vite dev server with HMR
  web:
    container_name: evey-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    environment:
      VITE_API_TARGET: "http://evey:${EVEY_HTTP_PORT:-9091}"
      VITE_HMR_HOST: evey.test
      VITE_HMR_PORT: "443"
      VITE_HMR_PROTOCOL: wss
      VITE_ALLOWED_HOSTS: evey.test
    volumes:
      - ./frontend:/app
      - ./gen:/gen:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${WEB_PORT:-5173}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      evey:
        condition: service_healthy

  # Expo / Metro bundler for the mobile app. Runs in a container so the
  # native binaries pnpm installs (lightningcss, etc.) match the runtime
  # where Metro executes — avoids glibc/musl mismatch when Metro is run
  # from WSL against a node_modules tree populated by an Alpine container.
  mobile:
    container_name: evey-mobile
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${METRO_PORT:-8081}:8081"
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Override CI=true baked into Dockerfile.web.dev — Metro disables watch
      # mode under CI=true, which kills HMR for live mobile development.
      CI: "false"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${METRO_HOST:-localhost}"
    volumes:
      - ./frontend:/app
      - ./gen:/gen:ro
    command: ["sh", "-c", "CI=true pnpm install && pnpm --filter mobile exec expo start --port 8081"]
    depends_on:
      web:
        condition: service_healthy

  # Dev Caddy with local TLS + HMR proxy (overrides prod caddy)
  caddy:
    image: caddy:2.9-alpine
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile
      - ./caddy-data:/data
      - ./caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      - web

# Dedicated transcode cache for the HW test container, kept separate from the
# software `evey` cache so an HW run produces fresh GPU-encoded segments
# instead of serving the software ones (the two are byte-compatible by design,
# but a clean cache makes the HW path observable).
volumes:
  evey-hw-cache:
  evey-hw-data:
