# Dev overrides - automatically merged by docker compose
# Prod servers: don't include this file, or use: docker compose -f docker-compose.yml up -d
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Standalone Meilisearch container for dev - easier to attach the Meili
  # UI / curl directly on :7700 than to tunnel into the evey container.
  # Prod runs Meili embedded inside evey (see entrypoint.sh + base compose).
  meilisearch:
    container_name: evey-meilisearch
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - ./meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailcatcher:
    container_name: evey-mailcatcher
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"
    expose:
      - "1025"
    restart: unless-stopped

  # Override evey: local build with Air hot-reload + full HW transcode (the
  # one-image model of a typical media server). ONE dev container, like prod - replaces the old
  # Alpine-software `evey` + glibc-HW `evey-hw` split (no more shared-DB
  # capability conflict). Maps BOTH the NVIDIA GPU (Container Toolkit, for NVENC)
  # AND /dev/dri (VAAPI/QSV); the admin "Hardware acceleration" mode picks which.
  # Defaults to NVENC (works on this box); VAAPI is auto-greyed in the admin on
  # WSL2 (Mesa d3d12 can't sustain the multi-variant encode - docs/adr/0015).
  # NOTE: the nvidia reservation, /dev/dxg + /usr/lib/wsl + LIBVA_DRIVER_NAME are
  # WSL2/NVIDIA-specific; on a native Linux box NVENC needs only the nvidia
  # reservation and VAAPI/QSV only /dev/dri - drop /dev/dxg + the wsl bits.
  evey:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: evey-dev
    env_file: .env.dev
    environment:
      EVEY_LOG_DEV_MODE: "true"
      EVEY_LOG_LEVEL: debug
      EVEY_RATELIMIT_LOGIN_MAX: "1000"
      EVEY_RATELIMIT_GLOBAL_MAX: "10000"
      # Dev points at the standalone meili container above, NOT the embedded
      # one in the evey image - keeps Meili UI accessible on :7700 and lets
      # `docker compose restart meilisearch` reset just the index without
      # restarting the app.
      EVEY_EMBEDDED_MEILI: "false"
      EVEY_MEILI_URL: http://meilisearch:7700
      # MEILI_MASTER_KEY is already inherited from the project .env file.
      # HW transcode: master gate + default mode. The admin panel overrides both
      # live (toggle off -> software; backend select -> nvenc/vaapi/qsv). MODE is
      # nvenc (not auto) so boot doesn't probe the WSL2 d3d12 VAAPI path the admin
      # greys anyway.
      EVEY_TRANSCODING_HW_ACCEL_ENABLED: "true"
      EVEY_TRANSCODING_HW_MODE: nvenc
      # NVENC needs the `video` capability so the toolkit injects libnvidia-encode
      # (the image sets this too; explicit here for visibility).
      NVIDIA_DRIVER_CAPABILITIES: all
      # WSL2 VAAPI path (harmless to leave; a native NAS auto-selects its driver):
      # Mesa d3d12 + the host GPU libs on the lib path.
      LIBVA_DRIVER_NAME: d3d12
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      # Dev plugins are unsigned; cosign ships in the image but the policy stays
      # off so local installs don't fail closed.
      EVEY_PLUGINS_COSIGN_POLICY: "off"
    volumes:
      - .:/app
      - ./evey-data:/data
      - ./plugins:/data/plugins
      - evey-cache:/cache
      # WSL2 d3d12 VAAPI runtime libs (host GPU userspace); ignored off-WSL.
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Your own libraries, set in .env.dev (MEDIA_DIR, MEDIA_DIR_2..4).
      - ${MEDIA_DIR:-./media}:/media
      - ${MEDIA_DIR_2:-./media}:/media2
      - ${MEDIA_DIR_3:-./media}:/media3
      - ${MEDIA_DIR_4:-./media}:/media4
    # NVENC: reserve the NVIDIA GPU (Container Toolkit injects the driver).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Map the host DRM render node (the cryptominer-gpu red-team test probes a
    # REAL GPU device + the VAAPI/QSV path) and /dev/dxg for the WSL2 d3d12 path.
    # Needs the host /dev/dri to exist (WSL2: `sudo modprobe vgem`, cf
    # hw_transcode_wsl_setup).
    devices:
      - /dev/dri:/dev/dri
      - /dev/dxg:/dev/dxg
    # The render node is root:render - add the host render GID so a privilege-
    # dropped plugin can open /dev/dri/renderD128 (then Landlock denies it).
    # `getent group render` (vgem node was GID 992 on the dev box); override via
    # EVEY_RENDER_GID.
    group_add:
      - "${EVEY_RENDER_GID:-992}"
    healthcheck:
      start_period: 60s
      retries: 10
    # Override base depends_on so the dev evey waits on the standalone meili
    # container too (base only depends on postgres now that prod ships meili
    # embedded inside the image).
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Vite dev server with HMR
  web:
    container_name: evey-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    environment:
      VITE_API_TARGET: "http://evey:${EVEY_HTTP_PORT:-9091}"
      VITE_HMR_HOST: evey.test
      VITE_HMR_PORT: "443"
      VITE_HMR_PROTOCOL: wss
      VITE_ALLOWED_HOSTS: evey.test
    volumes:
      - ./frontend:/app
      - ./gen:/gen:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${WEB_PORT:-5173}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      evey:
        condition: service_healthy

  # Expo / Metro bundler for the mobile app. Runs in a container so the
  # native binaries pnpm installs (lightningcss, etc.) match the runtime
  # where Metro executes - avoids glibc/musl mismatch when Metro is run
  # from WSL against a node_modules tree populated by an Alpine container.
  mobile:
    container_name: evey-mobile
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${METRO_PORT:-8081}:8081"
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Override CI=true baked into Dockerfile.web.dev - Metro disables watch
      # mode under CI=true, which kills HMR for live mobile development.
      CI: "false"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${METRO_HOST:-localhost}"
    volumes:
      - ./frontend:/app
      - ./gen:/gen:ro
    command: ["sh", "-c", "CI=true pnpm install && pnpm --filter mobile exec expo start --port 8081"]
    depends_on:
      web:
        condition: service_healthy

  # Dev Caddy with local TLS + HMR proxy (overrides prod caddy)
  caddy:
    image: caddy:2.9-alpine
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile
      - ./caddy-data:/data
      - ./caddy-config:/config
    healthcheck:
      # /healthz, not `/`: the dev site is evey.test only, so a bare probe on
      # localhost got a 308 to HTTPS and then failed the TLS handshake against
      # an internal cert issued for another name. It could never go green.
      # Caddyfile.dev serves this path over plain HTTP for exactly this check.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      - web
