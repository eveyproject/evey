syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";
import "evey/v1/transcoding.proto";

option go_package = "github.com/evey-project/evey/gen/evey/v1;eveyv1";

service AdminSystemService {
  rpc GetSystemInfo(GetSystemInfoRequest) returns (SystemInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/system"
    };
  }

  rpc GetSetupStatus(GetSetupStatusRequest) returns (SetupStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/setup/status"
    };
  }

  rpc GetServerConfig(GetServerConfigRequest) returns (ServerConfig) {
    option (google.api.http) = {
      get: "/api/v1/admin/config"
    };
  }

  rpc UpdateServerConfig(UpdateServerConfigRequest) returns (ServerConfig) {
    option (google.api.http) = {
      put: "/api/v1/admin/config"
      body: "*"
    };
  }

  rpc SetupWizard(SetupWizardRequest) returns (SetupWizardResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/setup"
      body: "*"
    };
  }

  rpc GetDashboard(GetDashboardRequest) returns (DashboardInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/dashboard"
    };
  }
}

message SystemInfo {
  string version = 1;
  string os = 2;
  string arch = 3;
  string ffmpeg_version = 4;
  repeated HWDevice hw_devices = 5;
  int64 uptime_seconds = 6;
  string go_version = 7;
  string server_id = 8;
  bool setup_complete = 9;
  bool password_recovery_enabled = 10;
  bool smtp_configured = 11;
}

message ServerConfig {
  map<string, string> values = 1;
}

message SetupWizardRequest {
  string admin_username = 1;
  string admin_password = 2;
  string admin_email = 3;
  string server_name = 4;
  string base_url = 5;
  // Optional: locale+region chosen during the wizard. Persisted as
  // server.language / server.region so new profiles inherit them.
  string server_language = 6;
  string server_region = 7;
}

message SetupWizardResponse {
  string access_token = 1;
  string refresh_token = 2;
  string server_id = 3;
}

message DashboardInfo {
  int32 active_streams = 1;
  int32 active_transcodes = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  repeated StorageInfo storage = 5;
  int32 total_media_items = 6;
  int32 total_users = 7;
  // Measured streaming throughput: bytes actually written to stream/HLS/
  // download responses since the previous GetDashboard call, as bits/s.
  // -1 on the very first call (no previous sample to diff against).
  int64 streaming_bps = 8;
  // Cumulative streaming bytes served since the server started.
  int64 streaming_bytes_total = 9;
  // Theoretical outgoing rate: the summed source bitrate of every active
  // play session — what the server would push if every client pulled at
  // full speed.
  int64 active_sessions_bps = 10;
}

message StorageInfo {
  // Representative path for this physical disk (the first library path that
  // resolved to it). Kept for backwards compatibility with older clients.
  string path = 1;
  int64 total_bytes = 2;
  int64 used_bytes = 3;
  int64 free_bytes = 4;
  // Every distinct library path that lives on this same physical disk (same
  // filesystem device id). Lets the UI group libraries per drive instead of
  // showing the same disk's capacity once per library.
  repeated string paths = 5;
}

message GetSystemInfoRequest {}

message GetSetupStatusRequest {}

message SetupStatusResponse {
  bool setup_complete = 1;
  // server_language/server_region expose the server-wide defaults so the
  // SPA can render pre-auth routes (login, setup) in the admin-picked
  // language instead of falling back to navigator.language.
  string server_language = 2;
  string server_region = 3;
  // password_recovery_enabled lets the (unauthenticated) login page decide
  // whether to show the "Forgot password?" link. The same flag lives on the
  // admin-only SystemInfo; this is its public projection (it only reveals
  // whether SMTP + recovery are configured, no sensitive detail).
  bool password_recovery_enabled = 4;
}

message GetServerConfigRequest {}

message UpdateServerConfigRequest {
  map<string, string> values = 1;
}

message GetDashboardRequest {}
