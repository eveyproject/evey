syntax = "proto3";

package evey.v1;

import "google/api/annotations.proto";

option go_package = "github.com/eveyproject/evey/gen/evey/v1;eveyv1";

service AdminIntroService {
  rpc InvalidateIntroCache(InvalidateIntroCacheRequest) returns (InvalidateIntroCacheResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/intro-cache/{tmdb_id}/{season}/{episode}"
    };
  }

  rpc BackfillIntroDetection(BackfillIntroDetectionRequest) returns (BackfillIntroDetectionResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/intro-cache/backfill"
      body: "*"
    };
  }
}

message InvalidateIntroCacheRequest {
  int32 tmdb_id = 1;
  int32 season = 2;
  int32 episode = 3;
}

message InvalidateIntroCacheResponse {
  int64 rows_deleted = 1;
}

message BackfillIntroDetectionRequest {
  // library_id scopes the backfill to one library. Empty = all libraries.
  string library_id = 1;
}

message BackfillIntroDetectionResponse {
  // seasons_scheduled is the number of seasons passed to the detection
  // pipeline. The job runs in the background; this is not a completion count.
  int32 seasons_scheduled = 1;
}
